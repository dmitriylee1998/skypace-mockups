// Container and seal numbers for many containers: paste a list from the carrier's confirmation or type them row by row
function NumbersDrawer({ list, onClose, onSave }) {
  const [rows, setRows] = useState(() => list.map((c) => ({ id: c.id, type: c.type, number: c.number || '', seal: c.seal || '' })));
  const [paste, setPaste] = useState('');
  const [msgApi, msgCtx] = message.useMessage();
  const set = (id, patch) => setRows((r) => r.map((x) => (x.id === id ? { ...x, ...patch } : x)));
  const counts = rows.reduce((m, r) => (r.number ? { ...m, [r.number]: (m[r.number] || 0) + 1 } : m), {});
  const errOf = (r) => cnNumberError(r.number) || (r.number && counts[r.number] > 1 ? 'Same number is used twice' : null);
  const hasErr = rows.some(errOf);
  const fill = () => {
    const tokens = paste.split(/[\s,;]+/).map(normalizeCn).filter(Boolean);
    const empty = rows.filter((r) => !r.number);
    const take = tokens.slice(0, empty.length);
    setRows((rs) => { let i = 0; return rs.map((r) => (!r.number && i < take.length ? { ...r, number: take[i++] } : r)); });
    setPaste('');
    msgApi.info(tokens.length > empty.length ? `Filled ${take.length} containers · ${tokens.length - take.length} numbers left over` : `Filled ${take.length} containers`);
  };
  const changed = rows.filter((r) => { const c = list.find((x) => x.id === r.id); return c.number !== r.number || (c.seal || '') !== r.seal.trim(); });
  return (
    <Drw title="Container & seal numbers" width={760} onClose={onClose} bordered className="gray"
      footer={<><Button onClick={onClose}>Cancel</Button><Button type="primary" disabled={!changed.length || hasErr} onClick={() => onSave(Object.fromEntries(changed.map((r) => [r.id, { number: r.number, seal: r.seal.trim() }])))}>
        {changed.length > 1 ? `Save ${changed.length} containers` : 'Save'}</Button></>}>
      {msgCtx}
      <div className="cn-stack">
        <div className="card">
          <b className="cn-sub">Paste numbers</b>
          <div className="lbl muted">Copy container numbers from the booking confirmation — one per line or separated by commas. They fill the containers without a number, top to bottom.</div>
          <Input.TextArea rows={3} value={paste} onChange={(e) => setPaste(e.target.value)} placeholder={'MSKU7712300\nTGHU8802144'} />
          <Button style={{ alignSelf: 'flex-start' }} icon={<I.CopyOutlined />} disabled={!paste.trim()} onClick={fill}>Fill numbers</Button>
        </div>
        {rows.map((r, i) => {
          const e = errOf(r);
          return (
            <div key={r.id} className={'assign-row cn-num-row' + (!r.number ? ' hl' : '')}>
              <div className="ic-box"><Ic n="container" size={16} /></div>
              <div className="cn-num-name"><b>{i + 1}. {CN_TYPES[r.type][1]}</b><div className="lbl muted">ID {r.id}</div></div>
              <div className="cn-num-field">
                <Input value={r.number} placeholder="Container number" status={e ? 'error' : undefined} aria-label={`Container number for container ${i + 1}`}
                  onChange={(ev) => set(r.id, { number: normalizeCn(ev.target.value) })} />
                {e && <div className="cn-err">{e}</div>}
              </div>
              <div className="cn-num-field">
                <Input value={r.seal} placeholder="Seal number" aria-label={`Seal number for container ${i + 1}`} onChange={(ev) => set(r.id, { seal: ev.target.value })} />
              </div>
            </div>
          );
        })}
      </div>
    </Drw>
  );
}

// Load plan for all containers in one place: switch containers without closing, see what's left and how full each box is
function LoadPlanDrawer({ list, startId, onClose, onSave, cargo = SHIP_CARGO }) {
  const [draft, setDraft] = useState(() => Object.fromEntries(list.map((c) => [c.id, c.load || {}])));
  const [cur, setCur] = useState(startId || list[0]?.id);
  const screens = Grid.useBreakpoint();
  const virtual = list.map((c) => ({ ...c, load: draft[c.id] }));
  const c = virtual.find((x) => x.id === cur);
  const avail = cnAvailable(virtual, cur, cargo);
  const load = draft[cur];
  const setLine = (gid, patch) => setDraft((d) => ({ ...d, [cur]: { ...d[cur], [gid]: { ...d[cur][gid], ...patch } } }));
  const fillLine = (g) => { const a = avail[g.id]; setLine(g.id, { pcs: a.pcs, kg: a.kg, cbm: a.cbm }); };
  const toggle = (g, on) => {
    if (on) return fillLine(g);
    setDraft((d) => { const next = { ...d[cur] }; delete next[g.id]; return { ...d, [cur]: next }; });
  };
  // Weight and volume follow the units (average per package), the user can still correct them
  const setUnits = (g, pcs) => setLine(g.id, { pcs, kg: pcs == null ? null : Math.round((pcs * g.kg) / g.pcs), cbm: pcs == null ? null : round3((pcs * g.cbm) / g.pcs) });
  const problems = (cid) => {
    const vl = virtual.find((x) => x.id === cid); const av = cnAvailable(virtual, cid, cargo); const ld = draft[cid];
    const lineErr = cargo.some((g) => ld[g.id] && (!(ld[g.id].pcs > 0) || ['pcs', 'kg', 'cbm'].some((k) => (ld[g.id][k] || 0) > av[g.id][k] + 1e-9)));
    const t = sumLoad(ld); const cap = cnCap(vl.type);
    return { lineErr, overCap: t.kg > cap.kg || t.cbm > cap.cbm };
  };
  const norm = (l) => JSON.stringify(Object.fromEntries(Object.entries(l || {}).map(([k, x]) => [k, { pcs: x.pcs || 0, kg: x.kg || 0, cbm: x.cbm || 0, value: x.value || 0 }])));
  const changedIds = list.filter((x) => norm(x.load) !== norm(draft[x.id])).map((x) => x.id);
  const blocked = list.some((x) => { const p = problems(x.id); return p.lineErr || p.overCap; });
  const p = problems(cur);
  const idx = list.findIndex((x) => x.id === cur);
  const over = (g, k) => load[g.id] && (load[g.id][k] || 0) > avail[g.id][k] + 1e-9;
  const leftAll = cargo.reduce((t, g) => t + Math.max(0, g.pcs - virtual.reduce((s, x) => s + (x.load[g.id]?.pcs || 0), 0)), 0);
  return (
    <Drw title="Edit container load plan" width={screens.md ? 960 : '100%'} onClose={onClose} bordered className="gray lp-drawer"
      footer={<><Button onClick={onClose}>Cancel</Button>
        <Button type="primary" disabled={!changedIds.length || blocked} onClick={() => onSave(Object.fromEntries(changedIds.map((id) => [id, { load: Object.fromEntries(Object.entries(draft[id]).map(([k, x]) => [k, { pcs: x.pcs || 0, kg: x.kg || 0, cbm: x.cbm || 0, value: x.value || 0 }])) }])))}>
          {changedIds.length > 1 ? `Update ${changedIds.length} containers` : 'Update Container'}</Button></>}>
      <div className="cn-stack">
        <div className="card lp-switch">
          <div className="lp-switch-row">
            <Button icon={<I.LeftOutlined />} disabled={idx <= 0} onClick={() => setCur(list[idx - 1].id)} aria-label="Previous container" />
            <Select value={cur} onChange={setCur} className="lp-switch-sel" popupMatchSelectWidth={false}
              options={list.map((x, i) => {
                const pr = problems(x.id); const changed = changedIds.includes(x.id);
                return { value: x.id, label: <span className="lp-opt"><Ic n="container" size={14} /><b>{i + 1}. {cnName(x)}</b><span className="muted">{CN_TYPES[x.type][0]}</span>{(pr.lineErr || pr.overCap) ? <I.WarningFilled style={{ color: '#ff4d4f' }} /> : changed ? <span className="lp-dot" title="Changed" /> : null}</span> };
              })} />
            <Button icon={<I.RightOutlined />} disabled={idx >= list.length - 1} onClick={() => setCur(list[idx + 1].id)} aria-label="Next container" />
            <span className="lp-left muted">{leftAll > 0 ? <><b>{num(leftAll)} pcs</b> of shipment cargo not loaded yet</> : <><I.CheckCircleFilled style={{ color: '#52c41a' }} /> All cargo is loaded</>}</span>
          </div>
          <CapBars c={c} load={load} />
          {p.overCap && <Alert type="error" showIcon title={`Over the ${CN_TYPES[c.type][1]} limits — move some cargo to another container.`} />}
        </div>

        <div className="lp-hint lbl muted"><I.BulbOutlined /> Tick a cargo line to load everything that’s left of it. Changing units recalculates weight and volume.</div>

        {cargo.map((g) => {
          const l = load[g.id]; const on = !!l; const a = avail[g.id];
          const none = a.pcs <= 0 && !on;
          return (
            <div key={g.id} className={'link-card lp-card' + (on ? ' sel' : '') + (none ? ' off' : '')}>
              <div className="row">
                <Checkbox checked={on} disabled={none} onChange={(e) => toggle(g, e.target.checked)} aria-label={`Load ${g.name}`} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <b className="lp-name">{g.name}</b>
                  <div className="lp-meta">
                    <span>HS {g.hs} · {g.pkg}</span>
                    <Tooltip title="Still available for this container"><span className="lp-av"><I.InfoCircleOutlined /> {num(a.pcs)} pcs · {num(a.kg)} kg · {num(a.cbm, 3)} cbm</span></Tooltip>
                    {none && <span>All loaded in other containers</span>}
                  </div>
                </div>
                {on && (l.pcs !== a.pcs || l.kg !== a.kg) && a.pcs > 0 && <LinkBtn icon={<I.VerticalAlignBottomOutlined />} onClick={() => fillLine(g)}>Load all left</LinkBtn>}
              </div>
              {on && (
                <div className="lp-inputs">
                  {[['pcs', 'Units', 'pcs', 0], ['kg', 'Weight', 'kg', 0], ['cbm', 'Volume', 'cbm', 3]].map(([k, label, unit, prec]) => (
                    <div key={k} className="lp-cell">
                      <span className="lbl">{label}, {unit}</span>
                      <InputNumber min={0} precision={prec} value={l[k]} style={{ width: '100%' }} aria-label={`${label}, ${unit}`}
                        status={over(g, k) || (k === 'pcs' && !(l.pcs > 0)) ? 'error' : undefined}
                        onChange={(v) => (k === 'pcs' ? setUnits(g, v) : setLine(g.id, { [k]: v }))} />
                      <span className={'lp-max' + (over(g, k) ? ' err' : '')}>{over(g, k) ? `Only ${num(a[k], prec)} ${unit} left` : `of ${num(a[k], prec)} ${unit}`}</span>
                    </div>
                  ))}
                  <div className="lp-cell">
                    <span className="lbl">Goods value, USD</span>
                    <InputNumber min={0} precision={2} value={l.value} style={{ width: '100%' }} aria-label="Goods value, USD" onChange={(v) => setLine(g.id, { value: v })} />
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </Drw>
  );
}

/* Drawers of the containers screens, opened by { type, id } */
function useCnDrawers(cn, msg) {
  const [d, setD] = useState(null);
  const close = () => setD(null);
  const el = d && ({
    add: <AddContainersDrawer onClose={close} onSave={(items) => { cn.addMany(items); close(); msg.success(items.length > 1 ? `${items.length} containers added` : 'Container added'); }} />,
    numbers: <NumbersDrawer list={cn.list} onClose={close} onSave={(p) => { cn.patchMany(p); close(); msg.success(`Numbers saved for ${Object.keys(p).length} container${Object.keys(p).length > 1 ? 's' : ''}`); }} />,
    load: <LoadPlanDrawer list={cn.list} startId={d.id} onClose={close} onSave={(p) => { cn.patchMany(p); close(); msg.success(Object.keys(p).length > 1 ? `Load plan updated for ${Object.keys(p).length} containers` : 'Load plan updated'); }} />,
    info: d.id && <ContainerInfoDrawer initial={cn.list.find((x) => x.id === d.id)} onClose={close} onSave={(v) => { cn.update(d.id, v); close(); msg.success('Container updated'); }} />,
  })[d.type];
  return [setD, el];
}

  const noNum = list.filter((c) => !c.number).length;
  const sealed = list.filter((c) => c.seal).length;
  const alloc = cargoLoaded(list);
  const pcsTotal = SHIP_CARGO.reduce((t, g) => t + g.pcs, 0);

  const allOpen = shown.length > 0 && shown.every((c) => openIds.has(c.id));
  const bars = [

  ].filter((x) => x && !hidden.includes(x.key));
  return (
    <ShipmentShell selected="containers">
      {msgCtx}
      {bars.map((x) => (
        <Alert key={x.key} type="warning" showIcon className="exc-bar" title={x.text}

          <h2>Containers</h2>
          <Button icon={<I.NumberOutlined />} onClick={() => openDrawer({ type: 'numbers' })} disabled={!list.length}><span className="cn-btn-txt">Container numbers</span></Button>
          <Button type="primary" icon={<I.PlusOutlined />} onClick={() => openDrawer({ type: 'add' })}><span className="cn-btn-txt">Add Containers</span></Button>
        </div>
        <div className="stat-tiles cn-stats">
          <div className="stat-tile"><b>{list.length}</b><span>Containers</span></div>
          <div className="stat-tile"><b>{list.length - noNum}/{list.length}</b><span>With number</span></div>
          <div className="stat-tile"><b>{sealed}/{list.length}</b><span>Sealed</span></div>
          <div className="stat-tile"><b>{pcsTotal ? Math.round((pcsLoaded / pcsTotal) * 100) : 0}%</b><span>Cargo loaded</span></div>
        </div>
        <Collapse ghost className="cn-alloc" items={[{
          key: 'a', label: <span><b>Cargo allocation</b> <span className="muted">· {num(pcsLoaded)} of {num(pcsTotal)} pcs loaded</span></span>,
          children: (
            <div className="cn-alloc-list">
              {alloc.map((g) => (
                <div key={g.id} className="item cn-alloc-row">
                  <div className="item-head" style={{ alignItems: 'center' }}>
                    <div style={{ flex: 1, minWidth: 0 }}><div className="cn-alloc-name">{g.name}</div><div className="lbl muted">HS {g.hs} · {num(g.pcs)} {g.pkg.toLowerCase()} · {num(g.kg)} kg</div></div>
                    {g.left > 0 ? <Tag color="warning" variant="filled">{num(g.left)} pcs not loaded</Tag> : <StatusTag s="done" />}
                  </div>
                  <Progress percent={g.pcs ? (g.loadedPcs / g.pcs) * 100 : 0} showInfo={false} size="small" />
                </div>
              ))}
            </div>
          ),
        }]} />
      </section>

      <div className="cn-toolbar">
        <Input allowClear prefix={<I.SearchOutlined className="muted" />} placeholder="Search number, seal or reference" value={q} onChange={(e) => setQ(e.target.value)} className="cn-search" />
        <Segmented value={f} onChange={setF} options={CN_FILTERS.map(([value, label]) => ({ value, label: `${label} · ${list.filter((c) => cnMatches(c, value)).length}` }))} />
        <Button type="link" onClick={() => setOpenIds(allOpen ? new Set() : new Set(shown.map((c) => c.id)))} disabled={!shown.length}>{allOpen ? 'Collapse all' : 'Expand all'}</Button>
      </div>

      <div className="cn-stack">
        {shown.map((c) => <CnCard key={c.id} c={c} i={list.indexOf(c)} open={openIds.has(c.id)} onToggle={() => toggle(c.id)} cn={cn} msg={msgApi} openDrawer={openDrawer} />)}
        {!shown.length && (
          <div className="cn-card"><Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description={list.length ? 'No containers match' : 'No containers yet'}>
            {list.length ? <Button onClick={() => { setQ(''); setF('all'); }}>Clear filters</Button> : <Button type="primary" icon={<I.PlusOutlined />} onClick={() => openDrawer({ type: 'add' })}>Add Containers</Button>}
          </Empty></div>
        )}
      </div>
      {drawerEl}
    </ShipmentShell>
  );
}


/* =====================================================================
   Shipment · Inland Pickup · Dispatches: shared dispatch store + the previous dispatch page
   (the new list and dispatch orders live in dispatch_order.jsx)

const DISPATCH_PATH = SHIPMENT_PATH + '/dispatches';
const DSP_STATUS = {
  unassigned: ['Unassigned', 'Unassigned', 'dsp-st-ns'], assigned: ['Assigned', 'Assigned', 'dsp-st-blue'],
  confirmed: ['Confirmed', 'Dispatched', 'dsp-st-ok'], transit: ['In transit', 'In Transit', 'dsp-st-ns'], completed: ['Completed', 'Completed', 'dsp-st-ok'],
};
const DspTag = ({ s }) => <Tag className={'dsp-tag ' + DSP_STATUS[s][2]}>{DSP_STATUS[s][1]}</Tag>;
const DSP_CARRIERS = {
  fast: { name: 'FastFreight LLC', address: '330 North State Street Chicago, IL, 60654 United States', email: 'mike@fastfreight.com', contact: 'Mike Johnson', phone: '+1 201 555 0124' },
  swift: { name: 'Swift Transport Inc', address: '1200 Harbor Blvd, Weehawken, NJ, 07086 United States', email: 'dispatch@swifttransport.com', contact: 'Anna Lee', phone: '+1 201 555 0188' },
};
const DSP_CY = { apm: 'APM Terminals Elizabeth', global: 'Global Terminal LLC' };
const DSP_PICKUP = { chicago: '330 N State ST, Chicago, IL', secaucus: '500 Meadowlands Pkwy, Secaucus, NJ' };
const DSP_CTO = { global: 'Global Terminal LLC, Jersey City NJ', apm: 'APM Terminals Elizabeth, NJ' };
const DSP_LOADING = ['Live Load', 'Drop & Pick'];
const DSP_SCHEDULING = ['FCFS', 'Appointment'];
const dspOpts = (o) => (Array.isArray(o) ? o.map((v) => ({ value: v, label: v })) : Object.entries(o).map(([value, label]) => ({ value, label })));
const DSP_FMT = 'D MMM, HH:mm';
const fmtDt = (iso, f = DSP_FMT) => (iso ? dayjs(iso).format(f) : null);

const DSP_EVENTS = [['Arrived to CY', 'CY', 'cy'], ['Gate Out (Empty)', 'CY', 'cy'], ['Arrived to Supplier', 'Pickup', 'pickup'], ['Departed from Supplier', 'Pickup', 'pickup'], ['Arrived to Terminal', 'CTO', 'cto'], ['Gate In (Full)', 'CTO', 'cto']];
const DONE_BY_STATUS = { unassigned: 0, assigned: 0, confirmed: 2, transit: 4, completed: 6 };
const dspEvents = (d) => DSP_EVENTS.map(([name, kind, k], i) => {
  const place = k === 'cy' ? DSP_CY[d.route.cy] : k === 'pickup' ? DSP_PICKUP[d.route.pickup] : DSP_CTO[d.route.cto];
  const base = dayjs(d.plan?.emptyDrop || '2026-06-15T08:00').add(i * 10, 'hour');
  const done = i < (d.actualDone ?? DONE_BY_STATUS[d.status]);
  return { name, place: `${kind}: ${place}`, short: place, at: base, date: base.format('D MMM YYYY, HH:mm'), done };
});

const DSP_STATUSES = ['confirmed', 'confirmed', 'confirmed', 'transit', 'unassigned', 'assigned', 'confirmed', 'assigned', 'unassigned', 'assigned', 'completed', 'assigned'];
const DSP_NUMS = ['HAMU1481029', '', '', 'MRKU4930122', 'NWRU3517440', 'NWRU3517440', 'ONEU1051502', 'ONEU1051502', 'FXLU2152499', 'FXLU2152499', 'BMOU5003200', 'AFFU2404470'];
const DSP_SEED = DSP_STATUSES.map((status, i) => {
  const bare = status === 'unassigned';
  return {
    id: `ID-${9981 + i}`, doId: 943211 + i, status, number: DSP_NUMS[i], size: i % 5 === 3 ? '40’HC' : '20’ST',
    seal: bare ? '' : `SL-2024-00${1234 + i}`, refs: ['983812312', '988312312', 'PO 4F0268'],
    cargo: bare ? null : { desc: 'Chemical Products (IMDG Class 3)', weight: 17000 + (i % 3) * 750 },
    carrier: bare ? null : i % 2 ? 'swift' : 'fast',
    plan: bare ? null : { emptyDrop: '2026-06-15T08:00', fullPickup: '2026-06-15T12:00', loading: 'Live Load', scheduling: 'FCFS', notes: 'Driver to call the warehouse 30 minutes before arrival. Dock 4, forklift on site.' },
    route: { cy: 'apm', pickup: 'chicago', cto: 'global' },
    charges: [{ id: 1, service: 'Base Drayage Rate', buy: 860, sell: 1040 }, { id: 2, service: 'Chassis Rental (2 days)', buy: 860, sell: 800 }, { id: 3, service: 'Emergency Fuel Surcharge', buy: 860, sell: 1040 }],
    free: { detention: [2, 10], demurrage: [2, 10] },
  };
});

/* shared store, same pattern as containers */
const DSP_KEY = 'skypace.dispatches.v2';
let dspCache = null;
const dspSubs = new Set();
const dspAll = () => (dspCache ||= store.get(DSP_KEY, null) || DSP_SEED);
const dspSave = (list) => { dspCache = list; store.set(DSP_KEY, list); dspSubs.forEach((f) => f(list)); };
// A carrier on an unassigned dispatch makes it assigned
const withStatus = (d) => (d.status === 'unassigned' && d.carrier ? { ...d, status: 'assigned' } : d);
function useDispatches() {
  const [list, setList] = useState(dspAll);
  useEffect(() => { dspSubs.add(setList); return () => dspSubs.delete(setList); }, []);
  return {
    list,
    update: (id, patch) => dspSave(dspAll().map((d) => (d.id === id ? withStatus({ ...d, ...(typeof patch === 'function' ? patch(d) : patch) }) : d))),
    updateMany: (ids, fn) => dspSave(dspAll().map((d) => (ids.includes(d.id) ? withStatus(fn(d)) : d))),
  };
}

const RefTags = ({ refs, max = 2 }) => (
  <span className="cn-tags">{refs.slice(0, max).map((r) => <Tag key={r} className="ref-tag">{r}</Tag>)}
    {refs.length > max && <Tooltip title={refs.slice(max).join(', ')}><Tag className="ref-tag">+{refs.length - max}</Tag></Tooltip>}</span>
);
const LoadedItems = ({ d }) => (
  <Popover trigger="click" title="Loaded items" content={
    <div className="dsp-pop">
      <div><b>{d.cargo.desc}</b></div>
      <div className="lbl muted">{num(d.cargo.weight)} kg · 20 drums · UN 1993</div>
    </div>}>
    <a className="dsp-link"><I.EyeOutlined /> View loaded item</a>
  </Popover>
);
const KVb = ({ k, children }) => <div className="dsp-kv"><div className="lbl muted">{k}</div><div>{children}</div></div>;
const Muted = ({ children }) => <span className="muted">{children}</span>;

/* ---------- dispatch page ---------- */
const Section = ({ title, onUpdate, action, children }) => (
  <section className="cn-card dsp-sec">
    <div className="dsp-sec-head"><b>{title}</b>{action || (onUpdate && <LinkBtn icon={<I.EditOutlined />} onClick={onUpdate}>Update</LinkBtn>)}</div>
    {children}
  </section>
);
const AddSlot = ({ children, onClick }) => <button type="button" className="dsp-slot" onClick={onClick}><I.PlusOutlined /> {children}</button>;
const dtVal = (iso) => (iso ? dayjs(iso) : undefined);
const dtIso = (v) => (v ? v.format('YYYY-MM-DDTHH:mm') : null);
const DT = (p) => <DatePicker showTime={{ format: 'HH:mm' }} format="DD/MM/YY HH:mm" placeholder="DD/MM/YY" style={{ width: '100%' }} {...p} />;

function FormDrawer({ title, initial, onClose, onSave, width = 480, children }) {
  const [form] = Form.useForm();
  const save = async () => { const v = await form.validateFields().catch(() => null); if (v) onSave(v); };
  return (
    <Drw title={title} width={width} onClose={onClose} bordered footer={<><Button onClick={onClose}>Cancel</Button><Button type="primary" onClick={save}>Save</Button></>}>
      <Form form={form} layout="vertical" requiredMark={false} initialValues={initial}>{typeof children === 'function' ? children(form) : children}</Form>
    </Drw>
  );
}

function DispatchDrawers({ d, which: w, close, ds, msg }) {
  const [which, arg] = String(w).split(':').map((x, i) => (i ? Number(x) : x));
  const done = (patch, text = 'Dispatch updated') => { ds.update(d.id, patch); msg.success(text); close(); };
  switch (which) {
    case 'container': return (
      <FormDrawer title="Container information" onClose={close} initial={{ number: d.number, size: d.size, seal: d.seal, refs: d.refs, desc: d.cargo?.desc, weight: d.cargo?.weight }}
        onSave={(v) => done({ number: v.number || '', size: v.size, seal: (v.seal || '').trim(), refs: v.refs || [], cargo: v.desc ? { desc: v.desc, weight: v.weight || 0 } : null })}>
        <div className="grid-2 dsp-g2">
          <Form.Item name="number" label="Container" normalize={normalizeCn} rules={[CN_NUMBER_RULE]} validateTrigger="onBlur"><Input placeholder="MSKU1234567" /></Form.Item>
          <Form.Item name="size" label="Size"><Select options={dspOpts(['20’ST', '40’ST', '40’HC', '45’HC'])} /></Form.Item>
        </div>
        <Form.Item name="seal" label="Seal Number"><Input placeholder="SL-2024-001234" /></Form.Item>
        <Form.Item name="refs" label="References" extra="Press Enter after each reference"><Select mode="tags" open={false} suffixIcon={null} tokenSeparators={[',']} /></Form.Item>
        <hr className="hr dsp-hr" />
        <Form.Item name="desc" label="Cargo description" rules={[{ required: true, message: 'Describe the cargo' }]}><Input placeholder="Chemical Products (IMDG Class 3)" /></Form.Item>
        <Form.Item name="weight" label="Estimated load weight" rules={[{ required: true, message: 'Enter the weight' }]}><InputNumber min={0} style={{ width: '100%' }} suffix="kg" /></Form.Item>
      </FormDrawer>
    );
    case 'carrier': return (
      <FormDrawer title="Carrier information" onClose={close} initial={{ carrier: d.carrier }} onSave={(v) => done({ carrier: v.carrier }, 'Carrier assigned')}>
        {(form) => <CarrierPick form={form} />}
      </FormDrawer>
    );
    case 'planning': return (
      <FormDrawer title="Planning" onClose={close} initial={{ emptyDrop: dtVal(d.plan?.emptyDrop), fullPickup: dtVal(d.plan?.fullPickup), loading: d.plan?.loading || 'Live Load', scheduling: d.plan?.scheduling || 'FCFS', notes: d.plan?.notes }}
        onSave={(v) => done({ plan: { emptyDrop: dtIso(v.emptyDrop), fullPickup: dtIso(v.fullPickup), loading: v.loading, scheduling: v.scheduling, notes: v.notes || '' } })}>
        <Form.Item name="emptyDrop" label="Empty Drop Date/Time" rules={[{ required: true, message: 'Pick a date' }]}><DT /></Form.Item>
        <Form.Item name="fullPickup" label="Full Pickup Date/Time" dependencies={['emptyDrop']} rules={[{ required: true, message: 'Pick a date' }, ({ getFieldValue }) => ({ validator: (_, v) => (!v || !getFieldValue('emptyDrop') || !v.isBefore(getFieldValue('emptyDrop')) ? Promise.resolve() : Promise.reject(new Error('Pickup can’t be before the empty drop'))) })]}><DT /></Form.Item>
        <div className="grid-2 dsp-g2">
          <Form.Item name="loading" label="Loading method"><Select options={dspOpts(DSP_LOADING)} /></Form.Item>
          <Form.Item name="scheduling" label="Scheduling method"><Select options={dspOpts(DSP_SCHEDULING)} /></Form.Item>
        </div>
        <Form.Item name="notes" label="Additional Notes"><Input.TextArea rows={4} placeholder="Instructions for the driver" /></Form.Item>
      </FormDrawer>
    );
    case 'route': return (
      <FormDrawer title="Route" onClose={close} initial={d.route} onSave={(v) => done({ route: v })}>
        <Form.Item name="cy" label="CY Location"><Select options={dspOpts(DSP_CY)} /></Form.Item>
        <Form.Item name="pickup" label="Pickup Location"><Select options={dspOpts(DSP_PICKUP)} /></Form.Item>
        <Form.Item name="cto" label="CTO Location"><Select options={dspOpts(DSP_CTO)} /></Form.Item>
      </FormDrawer>
    );
    case 'events': {
      const ev = dspEvents(d);
      return (
        <FormDrawer title="Tracking Events" width={560} onClose={close} initial={Object.fromEntries(ev.map((e, i) => [`e${i}`, e.done ? e.at : undefined]))}
          onSave={(v) => { const n = ev.filter((_, i) => v[`e${i}`]).length; done({ actualDone: n, status: n >= 6 ? 'completed' : n > 2 ? 'transit' : d.status }, 'Tracking events updated'); }}>
          <div className="lbl muted" style={{ marginBottom: 12 }}>Add the actual date when an event happened.</div>
          {ev.map((e, i) => (
            <Form.Item key={e.name} name={`e${i}`} label={<span><b>{e.name}</b> <span className="muted">· {e.short}</span></span>} extra={`Estimated ${e.date}`}><DT /></Form.Item>
          ))}
        </FormDrawer>
      );
    }
    case 'charge': {
      const c = d.charges.find((x) => x.id === arg) || null;
      return (
        <FormDrawer title={c ? 'Edit charge' : 'Add charge'} onClose={close} initial={c || {}}
          onSave={(v) => done({ charges: c ? d.charges.map((x) => (x.id === c.id ? { ...x, ...v } : x)) : [...d.charges, { id: Date.now(), ...v }] }, c ? 'Charge updated' : 'Charge added')}>
          <Form.Item name="service" label="Service" rules={[{ required: true, message: 'Name the service' }]}>
            <AutoComplete options={dspOpts(['Base Drayage Rate', 'Chassis Rental', 'Emergency Fuel Surcharge', 'Detention', 'Pre-pull', 'Waiting time'])} placeholder="Base Drayage Rate" filterOption />
          </Form.Item>
          <div className="grid-2 dsp-g2">
            <Form.Item name="buy" label="Buy Price" rules={[{ required: true, message: 'Enter a price' }]}><InputNumber min={0} precision={2} prefix="$" style={{ width: '100%' }} /></Form.Item>
            <Form.Item name="sell" label="Sell Price" rules={[{ required: true, message: 'Enter a price' }]}><InputNumber min={0} precision={2} prefix="$" style={{ width: '100%' }} /></Form.Item>
          </div>
        </FormDrawer>
      );
    }
    case 'free': return (
      <FormDrawer title="Free time counter" onClose={close} initial={{ det: d.free.detention[1], dem: d.free.demurrage[1] }}
        onSave={(v) => done({ free: { detention: [d.free.detention[0], v.det], demurrage: [d.free.demurrage[0], v.dem] } }, 'Free time updated')}>
        <Form.Item name="det" label="Detention, days"><InputNumber min={0} max={60} style={{ width: '100%' }} /></Form.Item>
        <Form.Item name="dem" label="Demurrage, days"><InputNumber min={0} max={60} style={{ width: '100%' }} /></Form.Item>
      </FormDrawer>
    );
    case 'cutoffs': return <CutoffsDrawer close={close} />;
    default: return null;
  }
}
function CarrierPick({ form }) {
  const id = Form.useWatch('carrier', form);
  const c = DSP_CARRIERS[id];
  return (
    <>
      <Form.Item name="carrier" label="Drayage carrier" rules={[{ required: true, message: 'Choose a carrier' }]}>
        <Select placeholder="Please Select" options={Object.entries(DSP_CARRIERS).map(([value, x]) => ({ value, label: x.name }))} />
      </Form.Item>
      {c && <div className="gray-box dsp-carrier-prev"><KVb k="Contact Person">{c.contact}</KVb><KVb k="Email">{c.email}</KVb><KVb k="Phone">{c.phone}</KVb><KVb k="Address">{c.address}</KVb></div>}
    </>
  );
}

function DispatchPage({ id }) {
  const ds = useDispatches();
  const d = ds.list.find((x) => x.id === id);
  const [drawer, setDrawer] = useState(null);
  const [msgApi, msgCtx] = message.useMessage();
  if (!d) return <div className="cn-card"><Result status="404" title="Dispatch not found" extra={<Button type="primary" onClick={() => go(DISPATCH_PATH)}>Back to dispatches</Button>} /></div>;
  const carrier = DSP_CARRIERS[d.carrier];
  const missing = [!d.cargo && 'cargo', !carrier && 'carrier', !d.plan && 'planning'].filter(Boolean);
  const ev = dspEvents(d);
  const profit = (c) => c.sell - c.buy;
  const total = d.charges.reduce((t, c) => ({ buy: t.buy + c.buy, sell: t.sell + c.sell }), { buy: 0, sell: 0 });
  const bar = (label, [used, max]) => (
    <div className="dsp-free"><div className="dsp-free-top"><span>{max} days {label}</span></div>
      <div className="dsp-free-bar"><Progress percent={(used / max) * 100} showInfo={false} size="small" strokeColor="#323656" /><span className="lbl muted">{used}/{max} days</span></div></div>
  );
  const listFmt = (arr) => arr.length > 1 ? `${arr.slice(0, -1).join(', ')} and ${arr.at(-1)}` : arr[0];
  return (
    <div className="dsp-page">
      {msgCtx}
      <div className="cn-card dsp-head">
        <Button type="text" icon={<I.ArrowLeftOutlined />} onClick={() => go(DISPATCH_PATH)} aria-label="Back to dispatches" />
        <b className="dsp-id">ID {d.doId}</b><DspTag s={d.status} />
        <Button icon={<I.PrinterOutlined />} className="dsp-print" onClick={() => window.print()}>Print PDF</Button>
      </div>
      <div className="dsp-cols">
        <div className="dsp-main">
          {missing.length > 0 && <Alert type="warning" showIcon className="exc-bar" title={`Please add ${listFmt(missing)} information`} />}
          <Section title="Container information" onUpdate={() => setDrawer('container')}>
            <div className="dsp-box"><KVb k="Container">{(() => { const c = cnForDispatch(d); const label = d.number || <Muted>Not provided</Muted>; return c ? <a href={href(`${CONTAINERS_PATH}/${c.id}`)}>{label}</a> : label; })()} <Tag className="ref-tag">{d.size}</Tag></KVb><KVb k="Seal Number">{d.seal || <Muted>Not provided</Muted>}</KVb><KVb k="References"><RefTags refs={d.refs} /></KVb></div>
            {d.cargo
              ? <div className="dsp-box"><KVb k="Cargo description">{d.cargo.desc}</KVb><KVb k="Estimated Load weight">{num(d.cargo.weight)} kg</KVb><KVb k="Load plan"><LoadedItems d={d} /></KVb></div>
              : <AddSlot onClick={() => setDrawer('container')}>Add Cargo</AddSlot>}
          </Section>
          <Section title="Carrier information" onUpdate={carrier ? () => setDrawer('carrier') : null}>
            {carrier ? (
              <>
                <div className="dsp-box two"><KVb k="Company name">{carrier.name}</KVb><KVb k="Address">{carrier.address}</KVb></div>
                <div className="dsp-box"><KVb k="Email"><a href={`mailto:${carrier.email}`}>{carrier.email}</a></KVb><KVb k="Contact Person">{carrier.contact}</KVb><KVb k="Phone"><a href={`tel:${carrier.phone.replace(/\s/g, '')}`}>{carrier.phone}</a></KVb></div>
              </>
            ) : <AddSlot onClick={() => setDrawer('carrier')}>Add Carrier</AddSlot>}
          </Section>
          <Section title="Planning" onUpdate={d.plan ? () => setDrawer('planning') : null}>
            {d.plan ? (
              <>
                <div className="dsp-box"><KVb k="Empty Drop Date/Time">{fmtDt(d.plan.emptyDrop) || <Muted>—</Muted>}</KVb><KVb k="Full Pickup Date/Time">{fmtDt(d.plan.fullPickup) || <Muted>—</Muted>}</KVb>
                  <KVb k="Loading / Scheduling Method"><span className="cn-tags"><Tag className="ref-tag">{d.plan.loading}</Tag><Tag className="ref-tag">{d.plan.scheduling}</Tag></span></KVb></div>
                {d.plan.notes && <div className="dsp-box one"><KVb k="Additional Notes">{d.plan.notes}</KVb></div>}
              </>
            ) : <AddSlot onClick={() => setDrawer('planning')}>Add Planning information</AddSlot>}
          </Section>
          <Section title="Route" onUpdate={() => setDrawer('route')}>
            <div className="dsp-box"><KVb k="CY Location">{DSP_CY[d.route.cy]}</KVb><KVb k="Pickup Location">{DSP_PICKUP[d.route.pickup]}</KVb><KVb k="CTO Location">{DSP_CTO[d.route.cto]}</KVb></div>
          </Section>
          <Section title="Tracking Events" onUpdate={() => setDrawer('events')}>
            <div className="dsp-ev">
              <div className="dsp-ev-head"><span>Event</span><span>Date</span></div>
              {ev.map((e, i) => (
                <div key={e.name} className={'dsp-ev-row' + (e.done ? ' done' : '')}>
                  <div className="dsp-ev-rail"><span className="r-dot" />{i < ev.length - 1 && <span className="r-line fill" />}</div>
                  <div className="dsp-ev-name"><b>{e.name}</b><div>{e.place}</div><div className="muted">Transport: Truck</div></div>
                  <div className="dsp-ev-date">{e.done ? e.date : <span className="muted">Est. {e.date}</span>}</div>
                </div>
              ))}
            </div>
            <div className="gray-box dsp-freebox">
              <div className="dsp-sec-head"><b>Free time counter</b><LinkBtn icon={<I.EditOutlined />} onClick={() => setDrawer('free')}>Update</LinkBtn></div>
              <div className="grid-2 dsp-g2">{bar('Detention', d.free.detention)}{bar('Demurrage', d.free.demurrage)}</div>

          <Section title="Ocean transportation"><div className="gray-box dsp-stack"><KVb k="Carrier">Maersk</KVb><KVb k="Booking number">412431231212</KVb><KVb k="Main Vessel / Voyage">CMA CGM T. JEFFERSON / 0XRBKW1MA</KVb><KVb k="Vessel / Train ETD">20 Feb, 2026 08:00</KVb></div></Section>
          <Section title="Cutoffs" action={<LinkBtn icon={<I.EditOutlined />} onClick={() => setDrawer('cutoffs')}>Edit</LinkBtn>}>

          </Section>

            <div className="gray-box dsp-stack">
              <div><div className="lbl muted">Origin</div><div className="dsp-2"><span>Detention: 4 days</span><span>Demurrage: 5 days</span></div></div>
            </div>
            <div className="gray-box dsp-stack">
              <div><div className="lbl muted">Destination</div><div className="dsp-2"><span>Detention: {d.free.detention[1]} days</span><span>Demurrage: {d.free.demurrage[1]} days</span></div></div>
            </div>
          </Section>
        </div>
      </div>
      {drawer && <DispatchDrawers d={d} which={drawer} close={() => setDrawer(null)} ds={ds} msg={msgApi} />}
    </div>
  );
}


/* =====================================================================
   Container page: one place for the box, its drayage (dispatch) and the
   ocean journey — modelled on carrier tracking pages (Maersk, Hapag-Lloyd,
   CMA CGM): milestone strip, events per leg with transport mode,
   free time / D&D with a what-if date, export readiness, equipment.
   ===================================================================== */

const HUB_NOW = dayjs('2026-06-16T15:00'); // demo "now", in line with the dispatch timeline
const HUB_FMT = 'D MMM, HH:mm';
const CN_DISPATCH = { '10682': 'ID-9982', '10683': 'ID-9984' };
// The container a dispatch moves: explicit link first, then the same container number
const cnForDispatch = (d) => cnAll().find((c) => (c.dispatchId || CN_DISPATCH[c.id]) === d.id) || (d.number ? cnAll().find((c) => c.number === d.number) : null);
const ISO_CODE = { '20ST': '22G1', '40ST': '42G1', '40HC': '45G1', '45HC': 'L5G1', '20RF': '22R1', '40RF': '45R1' };
const TARE = { '20ST': 2200, '40ST': 3750, '40HC': 3900, '45HC': 4800, '20RF': 3050, '40RF': 4600 };
const OWNERS = { MRKU: 'Maersk', MSKU: 'Maersk', HAMU: 'Hapag-Lloyd', TGHU: 'Textainer', ONEU: 'ONE', FXLU: 'Florens', NWRU: 'CMA CGM', BMOU: 'Beacon', AFFU: 'CMA CGM' };
const HUB_CUTOFFS = [['Docs', '2026-06-18T17:00'], ['VGM', '2026-06-19T12:00'], ['Port', '2026-06-20T12:00']];
const HUB_RATES = { detention: 150, storage: 95 };
const HUB_FREE = { detention: 4, storage: 5 };
const VESSEL_LOAD = '2026-06-22T10:00';
// Ocean and destination legs come from the carrier; drayage events come from our dispatch
const OCEAN_LEG = [
  ['Loaded on vessel', 'Port Newark, NJ, US', '2026-06-22T10:00', 'vessel', 'CMA CGM T. JEFFERSON / 0XRBKW1MA'],
  ['Vessel departure', 'Port Newark, NJ, US', '2026-06-23T06:00', 'vessel', 'CMA CGM T. JEFFERSON / 0XRBKW1MA'],
  ['Transshipment discharge', 'Singapore, SG', '2026-07-18T08:00', 'vessel', 'CMA CGM T. JEFFERSON / 0XRBKW1MA'],
  ['Loaded on vessel', 'Singapore, SG', '2026-07-20T14:00', 'vessel', 'MAERSK SENTOSA / 2415'],
  ['Vessel arrival', 'Cat Lai, Ho Chi Minh City, VN', '2026-07-27T06:00', 'vessel', 'MAERSK SENTOSA / 2415'],
];
const DEST_LEG = [
  ['Discharged', 'Cat Lai, Ho Chi Minh City, VN', '2026-07-27T14:00', 'vessel', 'Terminal: Tan Cang – Cat Lai'],
  ['Gate out (Full) for delivery', 'Cat Lai, Ho Chi Minh City, VN', '2026-07-29T09:00', 'truck', 'Carrier haulage · Maersk'],
  ['Delivered to consignee', 'Nha Trang, VN', '2026-07-30T08:00', 'truck', 'Carrier haulage · Maersk'],
  ['Empty returned', 'Cat Lai, Ho Chi Minh City, VN', '2026-08-02T10:00', 'truck', 'Carrier haulage · Maersk'],
];
const MODE_ICON = { truck: <I.CarOutlined />, vessel: <Ic n="nav-ship" size={14} />, rail: <I.NodeIndexOutlined /> };
const HUB_CHECKS = [
  ['release', 'Booking released', 'Empty release REL-88231 · APM Terminals Elizabeth'],
  ['si', 'Shipping instructions', 'Submitted 14 Jun, 11:20'],
  ['aes', 'Export customs (AES)', 'ITN X20260615123456'],
  ['vgm', 'VGM submitted', 'Due before the VGM cutoff'],
  ['gatein', 'Full gate-in at the port', 'Before the port cutoff'],
];
const HUB_DOCS = [
  { id: 1, name: 'EIR – empty gate out.pdf', kind: 'Interchange receipt', date: '15 Jun, 18:05', by: 'APM Terminals' },
  { id: 2, name: 'Booking confirmation 412431231212.pdf', kind: 'Booking', date: '12 Jun, 09:40', by: 'CMA CGM' },
  { id: 3, name: 'AES filing ITN X20260615123456.pdf', kind: 'Customs', date: '15 Jun, 10:12', by: 'Skypace' },
];
const until = (iso) => {
  const m = dayjs(iso).diff(HUB_NOW, 'minute');
  if (m < 0) return { text: `${Math.ceil(-m / 60)}h overdue`, late: true };
  const d = Math.floor(m / 1440); const h = Math.floor((m % 1440) / 60);
  return { text: d ? `in ${d}d ${h}h` : `in ${h}h`, soon: m < 48 * 60 };
};

function hubData(c, d) {
  const drayage = d ? dspEvents(d).map((e) => ({ name: e.name, place: e.short, at: e.at, done: e.done, mode: 'truck', note: `${DSP_CARRIERS[d.carrier]?.name || 'Carrier not assigned'} · ${d.id}` })) : [];
  const gateIn = drayage.find((e) => e.name === 'Gate In (Full)');
  const shipped = d?.status === 'completed';
  const leg = (rows, doneFn) => rows.map(([name, place, at, mode, note]) => ({ name, place, at: dayjs(at), done: doneFn(at), mode, note }));
  const ocean = leg(OCEAN_LEG, (at) => shipped && dayjs(at).isBefore(HUB_NOW));
  const dest = leg(DEST_LEG, () => false);
  const all = [...drayage, ...ocean, ...dest];
  const last = [...all].reverse().find((e) => e.done);
  const next = all.find((e) => !e.done);
  const emptyOut = drayage.find((e) => e.name === 'Gate Out (Empty)');
  return { drayage, ocean, dest, all, last, next, gateIn, emptyOut };
}

/* Milestone strip like the carriers' “Shipment progress” */
function HubMilestones({ h }) {
  const pick2 = (name, list) => list.find((e) => e.name === name);
  const ms = [
    ['Empty picked up', pick2('Gate Out (Empty)', h.drayage)], ['Loaded at shipper', pick2('Departed from Supplier', h.drayage)],
    ['Gate-in POL', h.gateIn], ['Departed POL', h.ocean[1]], ['Arrived POD', h.ocean[4]], ['Delivered', h.dest[2]], ['Empty returned', h.dest[3]],
  ];
  const current = ms.findIndex(([, e]) => !e?.done);
  return (
    <div className="hub-steps-wrap"><Steps size="small" className="hub-steps" current={current < 0 ? ms.length : current} labelPlacement="vertical" responsive={false}
      items={ms.map(([title, e], i) => ({
        title, status: !e ? 'wait' : e.done ? 'finish' : i === current ? 'process' : 'wait',
        description: e ? <span className={e.done ? '' : 'muted'}>{e.done ? '' : 'ETA '}{e.at.format('D MMM')}</span> : <span className="muted">Not planned</span>,
      }))} /></div>
  );
}

function HubTimeline({ h, d, subs }) {
  const legs = [
    ['Origin · drayage', subs?.[0] ?? (d ? <span>Merchant haulage · <a href={href(`${DISPATCH_PATH}/${d.id}`)}>{d.id}</a></span> : 'Not arranged'), h.drayage],
    ['Main carriage', subs?.[1] ?? 'CMA CGM · Booking 412431231212', h.ocean],
    ['Destination', subs?.[2] ?? 'Carrier haulage · Maersk', h.dest],
  ];
  return (
    <div className="hub-legs">
      {legs.map(([title, sub, evs]) => (
        <div key={title} className="hub-leg">
          <div className="hub-leg-head"><b>{title}</b><span className="lbl muted">{sub}</span>
            <span className="hub-leg-st">{evs.length && evs.every((e) => e.done) ? <StatusTag s="done" /> : evs.some((e) => e.done) ? <StatusTag s="prog" /> : <StatusTag s="ns" />}</span></div>
          {evs.length ? evs.map((e, i) => (
            <div key={e.name + i} className={'hub-ev' + (e.done ? ' done' : '') + (h.next === e ? ' next' : '')}>
              <div className="hub-ev-rail"><span className="hub-ev-ic">{MODE_ICON[e.mode]}</span>{i < evs.length - 1 && <span className="hub-ev-line" />}</div>
              <div className="hub-ev-body">
                <div className="hub-ev-top"><b>{e.name}</b>{h.next === e && <Tag color="processing" variant="filled" className="st-tag">Next</Tag>}</div>
                <div>{e.place}</div><div className="lbl muted">{e.note}</div>
              </div>
              <div className="hub-ev-date">{e.done ? e.at.format('D MMM YYYY, HH:mm') : <span className="muted">Est. {e.at.format('D MMM YYYY, HH:mm')}</span>}
                <div className="lbl muted">{e.done ? 'Actual' : 'Estimated'}</div></div>
            </div>
          )) : <div className="lbl muted hub-empty">No drayage dispatch for this container yet.</div>}
        </div>
      ))}
    </div>
  );
}

/* Free time and D&D with a what-if gate-in date (like Maersk's D&D view) */
function HubFreeTime({ h }) {
  const out = h.emptyOut?.done ? h.emptyOut.at : null;
  const plannedIn = h.gateIn?.at;
  const [gateIn, setGateIn] = useState(plannedIn);
  const [msgApi, msgCtx] = message.useMessage();
  if (!out) return <div className="lbl muted">Free time starts when the empty container leaves the depot.</div>;
  const lfd = out.add(HUB_FREE.detention, 'day');
  const detDays = gateIn ? Math.max(0, Math.ceil(gateIn.diff(out, 'hour') / 24)) : 0;
  const detOver = Math.max(0, detDays - HUB_FREE.detention);
  const stDays = gateIn ? Math.max(0, Math.ceil(dayjs(VESSEL_LOAD).diff(gateIn, 'hour') / 24)) : 0;
  const stOver = Math.max(0, stDays - HUB_FREE.storage);
  const total = detOver * HUB_RATES.detention + stOver * HUB_RATES.storage;
  const row = (label, used, free, over, rate, sub) => (
    <div className="hub-ft">
      <div className="hub-ft-top"><b>{label}</b><span className={over ? 'err' : 'muted'}>{used} of {free} free days</span></div>
      <Progress percent={Math.min(100, (used / free) * 100)} showInfo={false} size="small" status={over ? 'exception' : 'normal'} />
      <div className="lbl muted">{sub}{over ? <span className="err"> · {over} extra days × ${rate}</span> : null}</div>
    </div>
  );
  return (
    <div className="hub-free">
      {msgCtx}
      {row('Detention (merchant haulage)', detDays, HUB_FREE.detention, detOver, HUB_RATES.detention, `Last free day ${lfd.format(HUB_FMT)} · from empty gate out`)}
      {row('Storage at Port Newark', stDays, HUB_FREE.storage, stOver, HUB_RATES.storage, `From gate-in until loading ${dayjs(VESSEL_LOAD).format(HUB_FMT)}`)}
      <div className="hub-whatif">
        <div className="lbl muted">What if the full gate-in happens on…</div>
        <DatePicker showTime={{ format: 'HH:mm' }} format="D MMM YYYY, HH:mm" value={gateIn} onChange={(v) => setGateIn(v || plannedIn)} allowClear={false} style={{ width: '100%' }}
          aria-label="Planned full gate-in" />
        <div className="hub-total"><span>Estimated D&amp;D</span><b className={total ? 'err' : 'ok'}>{total ? money(total) : 'No charges'}</b></div>
        {gateIn && gateIn.isAfter(dayjs(HUB_CUTOFFS[2][1])) && <Alert type="error" showIcon title="After the port cutoff — the container will miss the vessel." />}
      </div>
      <Button block icon={<I.ShoppingCartOutlined />} onClick={() => msgApi.success('Request for 3 extra detention days sent to CMA CGM')}>Buy extra free time</Button>
    </div>
  );
}

/* Drayage block: the dispatch behind this container */
function HubDrayage({ c, d, onCreate }) {
  if (!d) {
    return <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="Drayage isn’t arranged for this container"><Button type="primary" icon={<I.PlusOutlined />} onClick={onCreate}>Create dispatch</Button></Empty>;
  }
  const carrier = DSP_CARRIERS[d.carrier];
  const ev = dspEvents(d);
  const appt = (label, e, extra) => (
    <div className="hub-appt"><span className={'hub-appt-dot' + (e?.done ? ' done' : '')}>{e?.done ? <I.CheckOutlined /> : <I.ClockCircleOutlined />}</span>
      <div style={{ flex: 1, minWidth: 0 }}><div>{label}</div><div className="lbl muted">{e ? `${e.done ? 'Done' : 'Appointment'} · ${e.date}` : 'Not planned'}{extra ? ` · ${extra}` : ''}</div></div></div>
  );
  return (
    <div className="hub-dray">
      <div className="hub-dray-head">
        <a href={href(`${DISPATCH_PATH}/${d.id}`)} className="hub-dray-id">{d.id}</a><DspTag s={d.status} /><Tag className="ref-tag">Merchant haulage</Tag>
      </div>
      {(!carrier || !d.plan) && <Alert type="warning" showIcon title={`Add ${[!carrier && 'a carrier', !d.plan && 'planning'].filter(Boolean).join(' and ')} to the dispatch`} />}
      <div className="gray-box dsp-stack">
        <KVb k="Drayage carrier">{carrier ? carrier.name : <Muted>Not assigned</Muted>}</KVb>
        {carrier && <div className="dsp-2"><KVb k="Contact">{carrier.contact}</KVb><KVb k="Phone"><a href={`tel:${carrier.phone.replace(/\s/g, '')}`}>{carrier.phone}</a></KVb></div>}
        {carrier && <div className="dsp-2"><KVb k="Driver / Truck">L. Ortega · NJ 48 21K</KVb><KVb k="Chassis">DCLI 284113 · pool</KVb></div>}
      </div>
      <div className="hub-appts">
        {appt(`Empty pickup · ${DSP_CY[d.route.cy]}`, ev[1], 'Release REL-88231')}
        {appt(`Loading at shipper · ${DSP_PICKUP[d.route.pickup]}`, ev[3], d.plan ? d.plan.loading : null)}
        {appt(`Full gate-in · ${DSP_CTO[d.route.cto]}`, ev[5])}
      </div>
      <div className="hub-dray-acts">
        <Button icon={<I.ExportOutlined />} onClick={() => go(`${DISPATCH_PATH}/${d.id}`)}>Open dispatch</Button>
        {carrier && <Button icon={<I.MailOutlined />} href={`mailto:${carrier.email}?subject=${encodeURIComponent(`${c.number || 'Container'} · ${d.id}`)}`}>Email carrier</Button>}
      </div>
    </div>
  );
}

function HubReadiness({ c, h, onToggle }) {
  const checks = { release: true, si: true, aes: true, vgm: false, ...(c.checks || {}), gatein: !!h.gateIn?.done };
  const done = Object.values(checks).filter(Boolean).length;
  return (
    <div className="hub-ready">
      <div className="hub-ready-top"><Progress type="circle" size={44} percent={(done / HUB_CHECKS.length) * 100} format={() => `${done}/${HUB_CHECKS.length}`} /><div><b>Ready for gate-in</b><div className="lbl muted">Export checks before the port cutoff</div></div></div>
      {HUB_CHECKS.map(([k, label, sub]) => {
        const ok = checks[k];
        const cutoff = k === 'vgm' ? HUB_CUTOFFS[1][1] : k === 'gatein' ? HUB_CUTOFFS[2][1] : null;
        const u = cutoff && !ok ? until(cutoff) : null;
        return (
          <div key={k} className={'hub-check' + (ok ? ' ok' : '')}>
            <span className="hub-check-ic">{ok ? <I.CheckCircleFilled /> : <I.ClockCircleOutlined />}</span>
            <div style={{ flex: 1, minWidth: 0 }}><div>{label}</div><div className="lbl muted">{sub}{u && <span className={u.late ? 'err' : u.soon ? 'warn' : ''}> · cutoff {u.text}</span>}</div></div>
            {k === 'vgm' && <Button size="small" type={ok ? 'text' : 'default'} onClick={() => onToggle(k, !ok)}>{ok ? 'Undo' : 'Mark submitted'}</Button>}
          </div>
        );
      })}
    </div>
  );
}

function HubDocs({ c, onChange, msg }) {
  const docs = c.docs || HUB_DOCS;
  const missing = ['VGM certificate', 'Proof of delivery'].filter((n) => !docs.some((x) => x.kind === n));
  return (
    <div className="hub-docs">
      <List dataSource={docs} renderItem={(x) => (
        <List.Item actions={[<Button key="dl" type="text" size="small" icon={<I.DownloadOutlined />} aria-label={`Download ${x.name}`} onClick={() => msg.info('Download starts in the real app')} />,
          <Popconfirm key="del" title="Remove this document?" okText="Remove" okButtonProps={{ danger: true }} onConfirm={() => onChange(docs.filter((y) => y.id !== x.id))}><Button type="text" size="small" icon={<I.DeleteOutlined />} aria-label={`Remove ${x.name}`} /></Popconfirm>]}>
          <List.Item.Meta avatar={<span className="icon-box sm"><I.FileTextOutlined /></span>} title={x.name} description={`${x.kind} · ${x.date} · ${x.by}`} />
        </List.Item>
      )} />
      {missing.length > 0 && <div className="lbl muted hub-missing"><I.InfoCircleOutlined /> Still expected: {missing.join(', ')}</div>}
      <Upload.Dragger multiple showUploadList={false} beforeUpload={(f) => {
        const kind = /vgm/i.test(f.name) ? 'VGM certificate' : /pod|delivery/i.test(f.name) ? 'Proof of delivery' : 'Other';
        onChange([...docs, { id: Date.now() + Math.random(), name: f.name, kind, date: dayjs().format('D MMM, HH:mm'), by: 'You' }]); msg.success(`${f.name} added`); return false;
      }}>
        <p className="ant-upload-drag-icon"><I.InboxOutlined /></p>
        <p className="ant-upload-text">Drop files here or click to upload</p>
        <p className="ant-upload-hint">EIR, VGM certificate, proof of delivery, photos</p>
      </Upload.Dragger>
    </div>
  );
}

function ContainerHubPage({ id }) {
  const cn = useContainers();
  const ds = useDispatches();
  const [msgApi, msgCtx] = message.useMessage();
  const [openDrawer, drawerEl] = useCnDrawers(cn, msgApi);
  const [tab, setTab] = useState('tracking');
  const c = cn.list.find((x) => x.id === id);
  if (!c) {
    return (
      <ShipmentShell selected="containers">
        <section className="cn-card"><Result status="404" title="Container not found" subTitle="It may have been deleted from this shipment."
          extra={<Button type="primary" onClick={() => go(CONTAINERS_PATH)}>Back to containers</Button>} /></section>
      </ShipmentShell>
    );
  }
  const dId = c.dispatchId || CN_DISPATCH[c.id];
  const d = ds.list.find((x) => x.id === dId);
  const h = hubData(c, d);
  const i = cn.list.indexOf(c); const prev = cn.list[i - 1]; const next = cn.list[i + 1];
  const owner = c.number ? OWNERS[c.number.slice(0, 4)] : null;
  const cap = cnCap(c.type);
  const createDispatch = () => {
    const all = dspAll(); const nid = `ID-${Math.max(...all.map((x) => +x.id.slice(3))) + 1}`;
    dspSave([...all, { ...DSP_SEED[4], id: nid, doId: 943211 + all.length, number: c.number, size: CN_TYPES[c.type][0].replace('`', '’'), status: 'unassigned', carrier: null, plan: null, cargo: null, charges: [] }]);
    cn.update(c.id, { dispatchId: nid }); msgApi.success(`Dispatch ${nid} created`);
  };
  const copyLink = async () => { try { await navigator.clipboard.writeText(location.href); msgApi.success('Tracking link copied'); } catch { msgApi.info(location.href); } };
  const vgmLeft = until(HUB_CUTOFFS[1][1]);
  const alerts = [
    !c.number && { type: 'warning', text: 'Container number isn’t assigned — carrier tracking starts once it’s known.', action: <Button size="small" type="text" onClick={() => openDrawer({ type: 'info', id: c.id })}>Add number</Button> },
    !(c.checks?.vgm) && vgmLeft.soon && { type: 'warning', text: <>VGM is due <b>{vgmLeft.text}</b> ({dayjs(HUB_CUTOFFS[1][1]).format(HUB_FMT)}).</>, action: <Button size="small" type="text" onClick={() => cn.update(c.id, { checks: { ...(c.checks || {}), vgm: true } })}>Mark submitted</Button> },
    !d && { type: 'info', text: 'No drayage dispatch is linked to this container.', action: <Button size="small" type="text" onClick={createDispatch}>Create dispatch</Button> },
  ].filter(Boolean);

  return (
    <ShipmentShell selected="containers">
      {msgCtx}
      <div className="cn-card hub-head">
        <div className="hub-head-row">

          <section className="cn-card"><div className="dsp-sec-head"><b>Free time &amp; D&amp;D</b><Tooltip title="Detention runs while the box is outside the terminal; storage runs at the port until loading."><I.QuestionCircleOutlined className="muted" /></Tooltip></div><HubFreeTime key={c.id + (d?.id || '')} h={h} /></section>
          <section className="cn-card">
            <div className="dsp-sec-head"><b>Equipment</b><LinkBtn icon={<I.EditOutlined />} onClick={() => openDrawer({ type: 'info', id: c.id })}>Edit</LinkBtn></div>

              { key: 't', label: 'Type', children: `${CN_TYPES[c.type][1]} (${ISO_CODE[c.type]})` },
              { key: 'o', label: 'Owner', children: owner || '—' },
              { key: 'tare', label: 'Tare', children: `${num(TARE[c.type])} kg` },
              { key: 'p', label: 'Max payload', children: `${num(cap.kg)} kg` },
              { key: 'g', label: 'Max gross', children: `${num(cap.kg + TARE[c.type])} kg` },
              { key: 'v', label: 'Capacity', children: `${num(cap.cbm, 1)} cbm` },
            ]} />
            <CapBars c={c} />
          </section>
        </div>
      </div>
      {drawerEl}
    </ShipmentShell>
  );
}


/* =====================================================================
   Containers (global): every box across shipments in one tracking list —
   phase tabs, attention rules (LFD, holds, missing number, no drayage),
   quick view drawer, CSV export. SP-000275 rows open the full container page.
   ===================================================================== */

const GC_PHASES = {
  o1: ['origin', 'Empty picked up', 1], o2: ['origin', 'Loaded at shipper', 2], o3: ['origin', 'Gated in at POL', 3],
  w: ['water', 'On water', 4], d1: ['dest', 'Discharged at POD', 5], d2: ['dest', 'Out for delivery', 6], d3: ['dest', 'Delivered · empty to return', 6], r: ['done', 'Empty returned', 7],
};
const GC_TABS = [['all', 'All'], ['attention', 'Needs attention'], ['origin', 'At origin'], ['water', 'On water'], ['dest', 'At destination'], ['done', 'Completed']];
const GC_MS = ['Empty picked up', 'Loaded at shipper', 'Gate-in POL', 'Departed POL', 'Arrived POD', 'Delivered', 'Empty returned'];
const GC_LANES = [
  ['Newark, US', 'Cat Lai, VN', 'CMA CGM'], ['Los Angeles, US', 'Shanghai, CN', 'COSCO'], ['Savannah, US', 'Rotterdam, NL', 'Maersk'],
  ['Houston, US', 'Antwerp, BE', 'Maersk'], ['Oakland, US', 'Gdansk, PL', 'Hapag-Lloyd'], ['Norfolk, US', 'Busan, KR', 'ONE'],
];
const GC_NUMS = ['HAMU1481029', 'NWRU3517440', 'ONEU1051502', 'FXLU2152499', 'BMOU5003200', 'AFFU2404470', 'MSKU7712300', 'TGHU8802144', 'CMAU9382132', 'TCLU4410276'];
const GC_TYPES = ['40HC', '40HC', '20ST', '40ST', '40HC', '20RF'];
const GC_PHASE_SEQ = ['o1', 'o2', 'o3', 'w', 'w', 'w', 'd1', 'd2', 'd3', 'r', 'o3', 'w', 'd1', 'o2', 'w', 'd1', 'r', 'w', 'o1', 'd3', 'w', 'o3'];

// Demo rows for other shipments; the two SP-000275 boxes come live from the containers + dispatch stores
const GC_MOCK = GC_PHASE_SEQ.map((ph, i) => {
  const rnd = seeded(i + 11);
  const [pol, pod, line] = GC_LANES[i % GC_LANES.length];
  const [, label, ms] = GC_PHASES[ph];
  const lastAt = HUB_NOW.subtract(Math.round(rnd() * 60) + 2, 'hour');
  const nextAt = HUB_NOW.add(Math.round(rnd() * 120) + 6, 'hour');
  const needsTruck = ph.startsWith('o') || ph === 'd1' || ph === 'd2' || ph === 'd3';
  const lfdBase = { o1: 3, o2: 2, o3: 4, d1: 1, d2: 3, d3: 2 }[ph];
  return {
    key: 'g' + i, local: false, number: i === 18 ? '' : (() => { const b = GC_NUMS[i % GC_NUMS.length].slice(0, 4) + String(100000 + i * 7919).slice(-6); return b + checkDigit(b); })(),
    type: GC_TYPES[i % GC_TYPES.length], shipment: `SP-000${290 - (i % 9)}`, booking: String(412431231200 + i), line, pol, pod, phase: ph, ms, label,
    last: { name: label, place: ph.startsWith('o') ? pol : ph === 'w' ? 'At sea' : pod, at: lastAt },
    next: ph === 'r' ? null : { name: GC_MS[ms] || 'Empty returned', at: ph === 'w' ? HUB_NOW.add(4 + (i % 12), 'day') : nextAt },
    drayage: needsTruck ? (i % 7 === 3 ? null : { carrier: i % 2 ? 'Swift Transport Inc' : 'FastFreight LLC', dispatch: `ID-${9700 + i}`, haulage: ph.startsWith('o') ? 'Merchant' : 'Carrier' }) : null,
    needsTruck,
    lfd: lfdBase != null ? HUB_NOW.add(lfdBase * 24 - (i % 3) * 20, 'hour') : null,
    lfdKind: ph.startsWith('o') ? (ph === 'o3' ? 'Storage' : 'Detention') : ph === 'd1' ? 'Demurrage' : ph.startsWith('d') ? 'Detention' : null,
    holds: ph === 'd1' && i % 2 === 0 ? ['Customs'] : ph === 'd1' && i % 3 === 0 ? ['Freight'] : [],
    vgmPending: ph === 'o2' && i % 2 === 1,
  };
});

function gcLocalRows(cnList, dsList) {
  return cnList.map((c) => {
    const d = dsList.find((x) => x.id === (c.dispatchId || CN_DISPATCH[c.id]));
    const h = hubData(c, d);
    const ms = [h.drayage.find((e) => e.name === 'Gate Out (Empty)'), h.drayage.find((e) => e.name === 'Departed from Supplier'), h.gateIn].filter((e) => e?.done).length;
    const ph = ms >= 3 ? 'o3' : ms === 2 ? 'o2' : 'o1';
    const out = h.emptyOut?.done ? h.emptyOut.at : null;
    return {
      key: 'c' + c.id, local: true, id: c.id, number: c.number, type: c.type, shipment: SHIPMENT_ID, booking: '412431231212', line: 'CMA CGM',
      pol: 'Newark, US', pod: 'Cat Lai, VN', phase: ph, ms, label: GC_PHASES[ph][1],
      last: h.last ? { name: h.last.name, place: h.last.place, at: h.last.at } : null, next: h.next ? { name: h.next.name, at: h.next.at } : null,
      drayage: d && d.carrier ? { carrier: DSP_CARRIERS[d.carrier].name, dispatch: d.id, haulage: 'Merchant' } : null, needsTruck: true, dispatchId: d?.id,
      lfd: out ? out.add(HUB_FREE.detention, 'day') : null, lfdKind: 'Detention', holds: [], vgmPending: !(c.checks?.vgm),
    };
  });
}
const gcIssues = (r) => [
  !r.number && 'No container number',
  r.holds.length && `${r.holds.join(', ')} hold`,
  r.needsTruck && !r.drayage && 'Drayage not arranged',
  r.lfd && r.lfd.diff(HUB_NOW, 'hour') < 48 && (r.lfd.isBefore(HUB_NOW) ? `${r.lfdKind} running` : `LFD ${until(r.lfd).text}`),
  r.vgmPending && until(HUB_CUTOFFS[1][1]).soon && 'VGM due soon',
].filter(Boolean);
const gcCsv = (rows) => {
  const head = ['Container', 'Type', 'Shipment', 'Carrier', 'POL', 'POD', 'Status', 'Last event', 'Next event', 'Drayage', 'LFD', 'Issues'];
  const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  return [head, ...rows.map((r) => [r.number || 'Not assigned', CN_TYPES[r.type][0], r.shipment, r.line, r.pol, r.pod, r.label,
    r.last ? `${r.last.name} ${r.last.at.format('YYYY-MM-DD HH:mm')}` : '', r.next ? `${r.next.name} ${r.next.at.format('YYYY-MM-DD HH:mm')}` : '',
    r.drayage ? `${r.drayage.carrier} (${r.drayage.dispatch})` : '', r.lfd ? r.lfd.format('YYYY-MM-DD HH:mm') : '', gcIssues(r).join('; ')])].map((row) => row.map(q).join(',')).join('\n');
};

const gcOpen = (r) => go(r.local ? `${CONTAINERS_PATH}/${r.id}` : `/containers/${r.key}`);

const LfdTag = ({ r }) => {
  if (!r.lfd) return <Muted>—</Muted>;
  const u = until(r.lfd);
  return (
    <Tooltip title={`${r.lfdKind} last free day · ${r.lfd.format('D MMM YYYY, HH:mm')}`}>
      <span className="gc-lfd"><span>{r.lfd.format('D MMM')}</span><Tag className={'ref-tag' + (u.late ? ' late' : u.soon ? ' soon' : '')}>{u.late ? 'Charges running' : u.text}</Tag></span>
    </Tooltip>
  );
};

function GcQuickView({ r, onClose }) {
  const issues = gcIssues(r);
  const u = r.lfd ? until(r.lfd) : null;
  return (
    <Drw title={<span className="gc-qv-title"><Ic n="container" size={16} />{r.number || 'Number not assigned'}<PlainTag>{CN_TYPES[r.type][0]} · {ISO_CODE[r.type]}</PlainTag></span>} width={560} onClose={onClose} bordered className="gray"
      footer={<>
        <Button onClick={() => go(r.shipment === SHIPMENT_ID ? SHIPMENT_PATH : '/shipments')}>Open shipment</Button>
        <Button type="primary" icon={<I.ExportOutlined />} onClick={() => gcOpen(r)}>Open container page</Button>
      </>}>
      <div className="cn-stack">
        {issues.length > 0 && <Alert type="warning" showIcon title={issues.join(' · ')} />}
        <div className="card">
          <div className="gc-qv-route"><b>{r.pol}</b><I.ArrowRightOutlined className="muted" /><b>{r.pod}</b><span className="muted">· {r.line} · {r.shipment}</span></div>
          <div className="hub-steps-wrap"><Steps size="small" className="hub-steps gc-steps" current={r.ms} labelPlacement="vertical" responsive={false}
            items={GC_MS.map((t, i) => ({ title: t, status: i < r.ms ? 'finish' : i === r.ms ? 'process' : 'wait' }))} /></div>
          <div className="dsp-2">
            <KVb k="Last event">{r.last ? <><b>{r.last.name}</b><div>{r.last.place}</div><div className="lbl muted">{r.last.at.format('D MMM YYYY, HH:mm')}</div></> : <Muted>No events yet</Muted>}</KVb>
            <KVb k="Next event">{r.next ? <><b>{r.next.name}</b><div className="lbl muted">Est. {r.next.at.format('D MMM YYYY, HH:mm')}</div></> : <Muted>—</Muted>}</KVb>
          </div>
        </div>
        <div className="card">
          <div className="dsp-sec-head"><b>Drayage</b>{r.drayage && <Tag className="ref-tag">{r.drayage.haulage} haulage</Tag>}</div>
          {r.drayage
            ? <div className="dsp-2"><KVb k="Carrier">{r.drayage.carrier}</KVb><KVb k="Dispatch">{r.local ? <a href={href(`${DISPATCH_PATH}/${r.drayage.dispatch}`)}>{r.drayage.dispatch}</a> : r.drayage.dispatch}</KVb></div>
            : <Muted>{r.needsTruck ? 'No trucker assigned yet' : 'Not needed in this phase'}</Muted>}
        </div>
        <div className="card">
          <div className="dsp-sec-head"><b>Free time</b>{r.lfd && <span className={'lbl ' + (u.late ? 'err' : u.soon ? 'warn' : 'muted')}>{r.lfdKind} · LFD {r.lfd.format('D MMM, HH:mm')}</span>}</div>
          {r.lfd ? <Progress percent={u.late ? 100 : Math.max(5, 100 - (r.lfd.diff(HUB_NOW, 'hour') / (4 * 24)) * 100)} showInfo={false} status={u.late ? 'exception' : 'normal'} strokeColor={!u.late && u.soon ? '#faad14' : undefined} />
            : <Muted>No free time clock in this phase</Muted>}
          {r.holds.length > 0 && <div className="cn-tags">{r.holds.map((x) => <Tag key={x} color="error" variant="filled">{x} hold</Tag>)}</div>}
        </div>
      </div>
    </Drw>
  );
}

function AllContainersPage() {
  const cn = useContainers();
  const ds = useDispatches();
  const rows = useMemo(() => [...gcLocalRows(cn.list, ds.list), ...GC_MOCK], [cn.list, ds.list]);
  const [tab, setTab] = useState('all');
  const [q, setQ] = useState('');
  const [line, setLine] = useState([]);
  const [sort, setSort] = useState('lfd');
  const [sel, setSel] = useState([]);
  const [view, setView] = useState(null);
  const [msgApi, msgCtx] = message.useMessage();
  const screens = Grid.useBreakpoint();
  const [page, setPage] = useState(1);
  const inTab = (r, t) => t === 'all' || (t === 'attention' ? gcIssues(r).length > 0 : GC_PHASES[r.phase][0] === t);
  const shown = rows.filter((r) => inTab(r, tab) && (!line.length || line.includes(r.line)) && includesQ(q, r.number, r.shipment, r.booking, r.pol, r.pod, r.drayage?.carrier, r.drayage?.dispatch))
    .sort(sort === 'lfd' ? (a, b) => (a.lfd ? a.lfd.valueOf() : Infinity) - (b.lfd ? b.lfd.valueOf() : Infinity)
      : sort === 'next' ? (a, b) => (a.next ? a.next.at.valueOf() : Infinity) - (b.next ? b.next.at.valueOf() : Infinity)
        : byKey(sort));
  const attention = rows.filter((r) => gcIssues(r).length);
  const exportCsv = () => {
    const list = sel.length ? rows.filter((r) => sel.includes(r.key)) : shown;
    const url = URL.createObjectURL(new Blob([gcCsv(list)], { type: 'text/csv' }));
    const a = document.createElement('a'); a.href = url; a.download = `containers-${HUB_NOW.format('YYYY-MM-DD')}.csv`; a.click(); URL.revokeObjectURL(url);
    msgApi.success(`Exported ${list.length} containers`);
  };
  const tiles = [
    ['Tracked', rows.length, null], ['Needs attention', attention.length, 'warn'],
    ['LFD within 48h', rows.filter((r) => r.lfd && r.lfd.diff(HUB_NOW, 'hour') < 48).length, 'warn'],
    ['On holds', rows.filter((r) => r.holds.length).length, 'err'], ['On water', rows.filter((r) => r.phase === 'w').length, null],
  ];
  const cols = [
    { title: 'Container', key: 'num', width: 170, fixed: 'left', render: (_, r) => (
      <span className="gc-num"><b className={r.number ? '' : 'muted'}>{r.number || 'Not assigned'}</b><Tag className="ref-tag">{CN_TYPES[r.type][0]}</Tag></span>
    ) },
    { title: 'Status', key: 'st', width: 240, render: (_, r) => (
      <div><span className="gc-st-row"><StatusTag s={r.phase === 'r' ? 'done' : r.phase.startsWith('o') && r.ms < 2 ? 'ns' : 'transit'} /><span className="gc-st">{r.label}</span></span>
        {r.last && <div className="lbl muted">{r.last.place} · {r.last.at.format('D MMM, HH:mm')}</div>}</div>
    ) },
    { title: 'Free time', key: 'lfd', width: 160, render: (_, r) => <LfdTag r={r} /> },
    { title: 'Next event', key: 'next', width: 170, render: (_, r) => (r.next ? <div><div>{r.next.name}</div><div className="lbl muted">Est. {r.next.at.format('D MMM, HH:mm')}</div></div> : <Muted>—</Muted>) },
    { title: 'Drayage', key: 'dr', width: 180, render: (_, r) => (r.drayage ? <div><div className="gc-ell">{r.drayage.carrier}</div><div className="lbl muted">{r.drayage.dispatch} · {r.drayage.haulage}</div></div>
      : r.needsTruck ? <Tag color="warning" variant="filled">Not arranged</Tag> : <Muted>—</Muted>) },
    { title: 'Route', key: 'route', width: 210, render: (_, r) => <div><div>{r.pol} → {r.pod}</div><div className="lbl muted">{r.line} · {r.local ? <PageLink to={SHIPMENT_PATH}>{r.shipment}</PageLink> : r.shipment}</div></div> },
    { title: '', key: 'flags', width: 48, render: (_, r) => { const is = gcIssues(r); return is.length ? <Tooltip title={is.join(' · ')}><Badge count={is.length} size="small" color="#faad14"><I.WarningOutlined className="gc-flag" /></Badge></Tooltip> : null; } },
    { key: 'go', width: 88, fixed: 'right', render: (_, r) => (
      <span className="gc-acts" onClick={(e) => e.stopPropagation()}>
        <Tooltip title="Quick view"><Button size="small" type="text" icon={<I.EyeOutlined />} aria-label={`Quick view ${r.number || 'container'}`} onClick={() => setView(r)} /></Tooltip>
        <ArrowBtn onClick={() => gcOpen(r)} />
      </span>
    ) },
  ];
  return (
    <div className="page-stack">
      {msgCtx}
      <Toolbar search={q} onSearch={setQ} placeholder="Search container, shipment, booking, port or trucker">
        <Select mode="multiple" allowClear maxTagCount="responsive" placeholder="Ocean carrier" value={line} onChange={setLine} style={{ minWidth: 180 }}
          options={uniq(rows.map((r) => r.line)).map((v) => ({ value: v, label: v }))} />
        <SortBtn value={sort} onChange={setSort} options={[['lfd', 'Last free day first'], ['next', 'Next event first'], ['shipment', 'Shipment'], ['number', 'Container number']]} />
        <Button icon={<I.DownloadOutlined />} onClick={exportCsv}>{sel.length ? `Export ${sel.length}` : 'Export CSV'}</Button>
      </Toolbar>
      <div className="stat-tiles gc-tiles">
        {tiles.map(([label, n, tone]) => (
          <button key={label} type="button" className={'stat-tile gc-tile' + (tone && n ? ' ' + tone : '')}
            onClick={() => setTab(label === 'Needs attention' || label === 'LFD within 48h' || label === 'On holds' ? 'attention' : label === 'On water' ? 'water' : 'all')}>
            <b>{n}</b><span>{label}</span>
          </button>
        ))}
      </div>
      <div className="card-flat tabs-card">
        <Tabs activeKey={tab} onChange={(k) => { setTab(k); setSel([]); }} items={GC_TABS.map(([k, l]) => {
          const n = rows.filter((r) => inTab(r, k)).length;
          return { key: k, label: <span>{l} <span className={'count-badge' + (k === 'attention' && n ? ' warn' : '')}>{n}</span></span> };
        })} />
      </div>
      {screens.xl === false ? (
        <div className="gc-cards">
          {shown.slice(0, page * 10).map((r) => {
            const is = gcIssues(r);
            return (
              <div key={r.key} className={'gc-card' + (is.length ? ' warn' : '')} role="link" tabIndex={0} onClick={() => gcOpen(r)} onKeyDown={(e) => e.key === 'Enter' && gcOpen(r)}>
                <div className="gc-card-top">
                  <span className="gc-num"><b className={r.number ? '' : 'muted'}>{r.number || 'Not assigned'}</b><Tag className="ref-tag">{CN_TYPES[r.type][0]}</Tag></span>
                  <Button size="small" type="text" icon={<I.EyeOutlined />} aria-label="Quick view" onClick={(e) => { e.stopPropagation(); setView(r); }} />
                </div>
                <div className="gc-st-row"><StatusTag s={r.phase === 'r' ? 'done' : r.phase.startsWith('o') && r.ms < 2 ? 'ns' : 'transit'} /><span className="gc-st">{r.label}</span></div>
                <div className="lbl muted">{r.pol} → {r.pod} · {r.line} · {r.shipment}</div>
                <div className="gc-card-grid">
                  <KVb k="Next event">{r.next ? <>{r.next.name}<div className="lbl muted">{r.next.at.format('D MMM, HH:mm')}</div></> : <Muted>—</Muted>}</KVb>
                  <KVb k="Free time"><LfdTag r={r} /></KVb>
                  <KVb k="Drayage">{r.drayage ? r.drayage.carrier : r.needsTruck ? <Tag color="warning" variant="filled">Not arranged</Tag> : <Muted>—</Muted>}</KVb>
                </div>
                {is.length > 0 && <div className="gc-card-issues"><I.WarningOutlined /> {is.join(' · ')}</div>}
              </div>
            );
          })}
          {!shown.length && <div className="card-flat"><Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="No containers match" /></div>}
          {shown.length > page * 10 && <Button block onClick={() => setPage(page + 1)}>Show more · {shown.length - page * 10} left</Button>}
        </div>
      ) : (
      <section className="card-flat table-card">
        <DataTable columns={cols} dataSource={shown} pagination={PAGINATION} minWidth={1280}
          rowSelection={{ selectedRowKeys: sel, onChange: setSel }}
          onRow={(r) => ({ onClick: () => gcOpen(r), style: { cursor: 'pointer' } })}
          rowClassName={(r) => (gcIssues(r).length ? 'gc-row-warn' : '')}
          locale={{ emptyText: <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="No containers match" /> }} />
      </section>
      )}
      {view && <GcQuickView r={view} onClose={() => setView(null)} />}
    </div>
  );
}

/* ---------- container page for any row of the global list ---------- */
const GC_HUBS = { 'Cat Lai, VN': 'Singapore, SG', 'Shanghai, CN': 'Busan, KR', 'Rotterdam, NL': 'Algeciras, ES', 'Antwerp, BE': 'Algeciras, ES', 'Gdansk, PL': 'Bremerhaven, DE', 'Busan, KR': 'Tokyo, JP' };
const GC_VESSELS = { 'CMA CGM': ['CMA CGM T. JEFFERSON / 0XRBKW1MA', 'CMA CGM VELA / 0FL3SW1MA'], Maersk: ['MAERSK SENTOSA / 2415', 'MAERSK KENSINGTON / 2422'], COSCO: ['COSCO SHIPPING ARIES / 041W', 'COSCO PRIDE / 112E'],
  'Hapag-Lloyd': ['BERLIN EXPRESS / 2423W', 'HAMBURG EXPRESS / 2425E'], ONE: ['ONE COMMITMENT / 018W', 'ONE HARMONY / 021E'] };
const GC_DONE = { o1: 2, o2: 4, o3: 6, w: 8, d1: 12, d2: 13, d3: 14, r: 15 };
const GC_OFFSETS = [0, 10, 20, 30, 44, 50, 120, 140, 500, 548, 700, 708, 750, 774, 846]; // hours from the first event
const GC_RATES = { Demurrage: 175, Detention: 150, Storage: 95 };
const GC_CARGO_SETS = [
  [{ id: 'a1', name: 'Auto parts, boxed', hs: '8708.99', pkg: 'Pallets', pcs: 20, kg: 14200, cbm: 48 }, { id: 'a2', name: 'Brake discs', hs: '8708.30', pkg: 'Crates', pcs: 8, kg: 4100, cbm: 9 }],
  [{ id: 'b1', name: 'Frozen poultry cuts', hs: '0207.14', pkg: 'Cartons', pcs: 1100, kg: 24500, cbm: 58 }],
  [{ id: 'c1', name: 'Cotton fabric rolls', hs: '5208.32', pkg: 'Rolls', pcs: 240, kg: 9800, cbm: 52 }, { id: 'c2', name: 'Polyester yarn', hs: '5402.33', pkg: 'Bales', pcs: 60, kg: 6200, cbm: 18 }],
  [{ id: 'd1', name: 'Chemical Products (IMDG Class 3)', hs: '3814.00', pkg: 'Drums', pcs: 80, kg: 17600, cbm: 22 }],
  [{ id: 'e1', name: 'Furniture, flat-packed', hs: '9403.60', pkg: 'Cartons', pcs: 310, kg: 8900, cbm: 64 }, { id: 'e2', name: 'Mattresses, rolled', hs: '9404.21', pkg: 'Rolls', pcs: 40, kg: 1600, cbm: 8 }],
];
// Cargo booked for this container, scaled to fit its type
const gcCargo = (r) => {
  const set = GC_CARGO_SETS[+r.key.slice(1) % GC_CARGO_SETS.length];
  const cap = cnCap(r.type); const kg = set.reduce((t, g) => t + g.kg, 0); const cbm = set.reduce((t, g) => t + g.cbm, 0);
  const k = Math.min(1, (cap.kg * 0.92) / kg, (cap.cbm * 0.92) / cbm);
  return set.map((g) => ({ ...g, pcs: Math.max(1, Math.round(g.pcs * k)), kg: Math.round(g.kg * k), cbm: round3(g.cbm * k) }));
};
// Loaded at the shipper from phase o2 on; still empty before that
const gcLoad = (r, cargo) => (r.phase === 'o1' ? {} : Object.fromEntries(cargo.map((g) => [g.id, { pcs: g.pcs, kg: g.kg, cbm: g.cbm, value: g.kg * 3 }])));
const gcOverrides = {}; // session edits for demo rows (docs, checks, holds, trucker)
const gcEmail = (name) => `dispatch@${name.toLowerCase().replace(/[^a-z]/g, '')}.com`;

function gcHub(r) {
  const done = GC_DONE[r.phase];
  const t0 = (r.last?.at || HUB_NOW).subtract(GC_OFFSETS[done - 1] || 0, 'hour');
  const [v1, v2] = GC_VESSELS[r.line] || GC_VESSELS.Maersk;
  const hub = GC_HUBS[r.pod] || 'Transshipment hub';
  const origin = r.phase.startsWith('o');
  const ours = r.drayage ? `${r.drayage.carrier} · ${r.drayage.dispatch}` : 'Trucker not assigned';
  const truck = origin ? ours : 'Merchant haulage · origin trucker';
  const destTruck = !origin && r.drayage ? ours : `Carrier haulage · ${r.line}`;
  const tpl = [
    ['Arrived to CY', `Empty depot, ${r.pol}`, 'truck', truck], ['Gate Out (Empty)', `Empty depot, ${r.pol}`, 'truck', truck],
    ['Arrived to Supplier', `Shipper warehouse, ${r.pol}`, 'truck', truck], ['Departed from Supplier', `Shipper warehouse, ${r.pol}`, 'truck', truck],
    ['Arrived to Terminal', `Port terminal, ${r.pol}`, 'truck', truck], ['Gate In (Full)', `Port terminal, ${r.pol}`, 'truck', truck],
    ['Loaded on vessel', r.pol, 'vessel', v1], ['Vessel departure', r.pol, 'vessel', v1], ['Transshipment discharge', hub, 'vessel', v1],
    ['Loaded on vessel', hub, 'vessel', v2], ['Vessel arrival', r.pod, 'vessel', v2],
    ['Discharged', r.pod, 'vessel', `Terminal at ${r.pod}`], ['Gate out (Full) for delivery', r.pod, 'truck', destTruck],
    ['Delivered to consignee', `Consignee, ${r.pod}`, 'truck', destTruck], ['Empty returned', `Empty depot, ${r.pod}`, 'truck', destTruck],
  ].map(([name, place, mode, note], i) => ({ name, place, mode, note, at: t0.add(GC_OFFSETS[i], 'hour'), done: i < done }));
  const drayage = tpl.slice(0, 6); const ocean = tpl.slice(6, 11); const dest = tpl.slice(11);
  return { drayage, ocean, dest, all: tpl, last: tpl[done - 1], next: tpl[done], gateIn: drayage[5], emptyOut: drayage[1] };
}

/* Free time for the clock that is running in this phase, with a what-if date */
function GcFreeTime({ r }) {
  const [msgApi, msgCtx] = message.useMessage();
  const [when, setWhen] = useState(() => r.next?.at || HUB_NOW.add(1, 'day'));
  if (!r.lfd) return <div className="lbl muted">{r.phase === 'w' ? 'No clock while the box is on the water. Demurrage starts at discharge.' : 'No free time clock in this phase.'}</div>;
  const rate = GC_RATES[r.lfdKind];
  const left = r.lfd.diff(HUB_NOW, 'hour');
  const pct = Math.min(100, Math.max(4, 100 - (left / (4 * 24)) * 100));
  const over = Math.max(0, Math.ceil(when.diff(r.lfd, 'hour') / 24));
  const action = { Demurrage: 'pickup from the terminal', Detention: r.phase.startsWith('o') ? 'full gate-in' : 'empty return', Storage: 'vessel loading' }[r.lfdKind];
  return (
    <div className="hub-free">
      {msgCtx}
      <div className="hub-ft">
        <div className="hub-ft-top"><b>{r.lfdKind}</b><span className={left < 0 ? 'err' : left < 48 ? 'warn' : 'muted'}>{until(r.lfd).late ? 'Charges running' : `LFD ${until(r.lfd).text}`}</span></div>
        <Progress percent={pct} showInfo={false} size="small" status={left < 0 ? 'exception' : 'normal'} strokeColor={left >= 0 && left < 48 ? '#faad14' : undefined} />
        <div className="lbl muted">Last free day {r.lfd.format('D MMM, HH:mm')} · ${rate} per extra day</div>
      </div>
      <div className="hub-whatif">
        <div className="lbl muted">What if the {action} happens on…</div>
        <DatePicker showTime={{ format: 'HH:mm' }} format="D MMM YYYY, HH:mm" value={when} onChange={(v) => v && setWhen(v)} allowClear={false} style={{ width: '100%' }} aria-label={`Planned ${action}`} />
        <div className="hub-total"><span>Estimated {r.lfdKind.toLowerCase()}</span><b className={over ? 'err' : 'ok'}>{over ? money(over * rate) : 'No charges'}</b></div>
        {over > 0 && <div className="lbl muted">{over} day{over > 1 ? 's' : ''} after the last free day × ${rate}</div>}
      </div>
      <Button block icon={<I.ShoppingCartOutlined />} onClick={() => msgApi.success(`Request for extra free time sent to ${r.line}`)}>Buy extra free time</Button>
    </div>
  );
}

/* Import availability: the holds a trucker checks before pickup */
const GC_HOLD_KINDS = [['Customs', 'CBP / customs release'], ['Freight', 'Ocean freight paid'], ['Line', 'Carrier release'], ['Terminal', 'Terminal fees & exam']];
function GcHolds({ r, holds, onRelease }) {
  const arrived = ['d1', 'd2', 'd3', 'r'].includes(r.phase);
  const free = arrived && !holds.length;
  return (
    <div className="hub-ready">
      <div className="hub-ready-top"><span className={'gc-avail' + (free ? ' ok' : arrived ? ' hold' : '')}>{free ? <I.CheckCircleFilled /> : arrived ? <I.StopOutlined /> : <I.ClockCircleOutlined />}</span>
        <div><b>{free ? 'Available for pickup' : arrived ? 'On hold' : 'Not arrived yet'}</b><div className="lbl muted">{arrived ? `At ${r.pod}` : `ETA ${r.pod} · ${gcHub(r).ocean[4].at.format('D MMM')}`}</div></div></div>
      {GC_HOLD_KINDS.map(([k, sub]) => {
        const on = holds.includes(k);
        return (
          <div key={k} className={'hub-check' + (!on && arrived ? ' ok' : '')}>
            <span className="hub-check-ic">{on ? <I.StopOutlined style={{ color: '#ff4d4f' }} /> : arrived ? <I.CheckCircleFilled /> : <I.ClockCircleOutlined />}</span>
            <div style={{ flex: 1, minWidth: 0 }}><div>{k}</div><div className="lbl muted">{on ? 'Hold' : arrived ? 'Released' : 'Pending'} · {sub}</div></div>
            {on && <Button size="small" onClick={() => onRelease(k)}>Mark released</Button>}
          </div>
        );
      })}
    </div>
  );
}

function GlobalContainerPage({ gkey }) {
  const cn = useContainers();

  const h = gcHub(r);
  const cargo = gcCargo(base);

  const fakeCn = { update: (_, patch) => save(patch) }; // ContainerBody edits go to the session overrides
  const i = all.findIndex((x) => x.key === gkey); const prev = all[i - 1]; const next = all[i + 1];
  const openRow = (x) => go(x.local ? `${CONTAINERS_PATH}/${x.id}` : `/containers/${x.key}`);
  const owner = r.number ? OWNERS[r.number.slice(0, 4)] : null;
  const cap = cnCap(r.type);
  const origin = r.phase.startsWith('o');
  const issues = gcIssues(r);
  const status = r.phase === 'r' ? 'done' : origin && r.ms < 2 ? 'ns' : 'transit';
  const copyLink = async () => { try { await navigator.clipboard.writeText(location.href); msgApi.success('Tracking link copied'); } catch { msgApi.info(location.href); } };
  const charges = r.drayage ? DSP_SEED[0].charges : [];
  const dr = r.drayage;
  const apptEvents = origin ? [['Empty pickup', h.drayage[1]], ['Loading at shipper', h.drayage[3]], ['Full gate-in', h.drayage[5]]] : [['Pickup at terminal', h.dest[1]], ['Delivery to consignee', h.dest[2]], ['Empty return', h.dest[3]]];

          <div className="hub-title">

            <div className="lbl muted">{owner ? `${owner} equipment · ` : ''}{r.line} · Booking {r.booking} · {r.shipment}</div>
          </div>
          <span className="hub-head-acts">
            <span className="cn-pager"><span className="muted">{i + 1} of {all.length}</span>
              <Button size="small" icon={<I.LeftOutlined />} disabled={!prev} onClick={() => openRow(prev)} aria-label="Previous container" />
              <Button size="small" icon={<I.RightOutlined />} disabled={!next} onClick={() => openRow(next)} aria-label="Next container" /></span>
            <Button icon={<I.ShareAltOutlined />} onClick={copyLink}><span className="cn-btn-txt">Share</span></Button>
            <Button icon={<I.PrinterOutlined />} onClick={() => window.print()} aria-label="Print" />
          </span>
        </div>
        <HubMilestones h={h} />
        <div className="hub-now">
          <div><div className="lbl muted">Last event</div>{h.last ? <><b>{h.last.name}</b> · {h.last.place}<div className="lbl muted">{h.last.at.format('D MMM YYYY, HH:mm')}</div></> : <Muted>No events yet</Muted>}</div>
          <div><div className="lbl muted">Next event</div>{h.next ? <><b>{h.next.name}</b> · {h.next.place}<div className="lbl muted">Est. {h.next.at.format('D MMM YYYY, HH:mm')}</div></> : <Muted>Journey completed</Muted>}</div>
          <div><div className="lbl muted">Route</div><b>{r.pol}</b> → <b>{r.pod}</b><div className="lbl muted">via {GC_HUBS[r.pod] || 'transshipment hub'}</div></div>

                <Table size="small" rowKey="id" pagination={false} className="dsp-charges" scroll={{ x: 520 }} dataSource={charges} locale={{ emptyText: 'No drayage charges yet' }}

                    { title: 'Profit', key: 'p', width: 110, render: (_, x) => <span className={x.sell - x.buy < 0 ? 'neg' : 'pos'}>{x.sell - x.buy < 0 ? '-' : ''}{money(Math.abs(x.sell - x.buy))}</span> }]} />
              ) },
              { key: 'docs', label: <span>Documents <span className="count-badge">{c.docs.length}</span></span>, children: <HubDocs c={c} msg={msgApi} onChange={(docs) => save({ docs })} /> },

                  <div className="dsp-2"><KVb k="Drayage carrier">{dr.carrier}</KVb><KVb k="Dispatch">{dr.dispatch}</KVb></div>
                </div>
                <div className="hub-appts">
                  {apptEvents.map(([label, e]) => (
                    <div key={label} className="hub-appt"><span className={'hub-appt-dot' + (e.done ? ' done' : '')}>{e.done ? <I.CheckOutlined /> : <I.ClockCircleOutlined />}</span>
                      <div style={{ flex: 1, minWidth: 0 }}><div>{label} · {e.place}</div><div className="lbl muted">{e.done ? 'Done' : 'Appointment'} · {e.at.format('D MMM YYYY, HH:mm')}</div></div></div>
                  ))}
                </div>
                <div className="hub-dray-acts"><Button icon={<I.MailOutlined />} href={`mailto:${gcEmail(dr.carrier)}?subject=${encodeURIComponent(`${r.number || 'Container'} · ${dr.dispatch}`)}`}>Email carrier</Button></div>
              </div>
            ) : r.needsTruck ? (
              <div className="hub-dray">
                <div className="lbl muted">No trucker is assigned for the {origin ? 'export pickup' : 'import delivery'}.</div>
                <Select value={pickCarrier} onChange={setPickCarrier} placeholder="Choose a drayage carrier" options={Object.values(DSP_CARRIERS).map((x) => ({ value: x.name, label: x.name }))} />
                <Button type="primary" disabled={!pickCarrier} onClick={() => { const name = DSP_CARRIERS[pickCarrier]?.name || pickCarrier; save({ drayage: { carrier: name, dispatch: `ID-${9800 + i}`, haulage: origin ? 'Merchant' : 'Carrier' } }); msgApi.success(`${name} assigned`); }}>Assign trucker</Button>
              </div>
            ) : <Muted>Not needed while the container is {r.phase === 'w' ? 'on the water' : 'returned'}.</Muted>}
          </section>
          <section className="cn-card">
            {origin ? <HubReadiness c={c} h={h} onToggle={(k, v) => save({ checks: { ...(ov.checks || {}), [k]: v } })} />
              : <GcHolds r={r} holds={r.holds} onRelease={(k) => { save({ holds: r.holds.filter((x) => x !== k) }); msgApi.success(`${k} hold released`); }} />}
          </section>
          <section className="cn-card"><div className="dsp-sec-head"><b>Free time &amp; D&amp;D</b></div><GcFreeTime key={gkey} r={r} /></section>
          <section className="cn-card">
            <div className="dsp-sec-head"><b>Equipment</b><LinkBtn icon={<I.AppstoreOutlined />} onClick={() => setLoadOpen(true)}>Load plan</LinkBtn></div>

              { key: 't', label: 'Type', children: `${CN_TYPES[r.type][1]} (${ISO_CODE[r.type]})` }, { key: 'o', label: 'Owner', children: owner || '—' },
              { key: 'tare', label: 'Tare', children: `${num(TARE[r.type])} kg` }, { key: 'p', label: 'Max payload', children: `${num(cap.kg)} kg` },
              { key: 'g', label: 'Max gross', children: `${num(cap.kg + TARE[r.type])} kg` }, { key: 'v', label: 'Capacity', children: `${num(cap.cbm, 1)} cbm` },
            ]} />
            <CapBars c={c} />
          </section>
        </div>
      </div>
      {loadOpen && <LoadPlanDrawer list={[c]} startId={c.id} cargo={cargo} onClose={() => setLoadOpen(false)}
        onSave={(p) => { save({ load: p[c.id].load }); setLoadOpen(false); msgApi.success('Load plan updated'); }} />}
    </div>
  );
}

/* ---------- primitives ---------- */
// The one text component: size = Figma text style, muted = gray/6, caps = uppercase labels
function DocText({ size = 'sm', strong, muted, caps, block, style, children }) {
  return (
    <Typography.Text strong={strong} type={muted ? 'secondary' : undefined}
      style={{ ...DOC_TYPE[size], ...(caps && { textTransform: 'uppercase' }), ...(block && { display: 'block' }), ...style }}>
      {children}
    </Typography.Text>
  );
}
const DocLabel = ({ children, style }) => <DocText size="xxs" muted caps block style={style}>{children}</DocText>;

function DocField({ label, children }) {
  return (
    <Flex vertical gap={DOC_TOKENS.gapField} style={{ flex: 1, minWidth: 0 }}>
      <DocLabel>{label}</DocLabel>
      <DocText>{children}</DocText>
    </Flex>
  );
}

// A row of fields on an even grid. `cols` keeps column widths when a row has fewer fields than slots.
function DocFieldRow({ fields, cols = fields.length, gap = DOC_TOKENS.gapGrid }) {
  const slots = [...fields, ...Array(Math.max(0, cols - fields.length)).fill(null)];
  return (
    <Flex gap={gap} align="start">
      {slots.map((f, i) => (f ? <DocField key={f[0]} label={f[0]}>{f[1]}</DocField> : <div key={'pad' + i} style={{ flex: 1 }} />))}
    </Flex>
  );
}

const DocDivider = ({ variant, top = DOC_TOKENS.gapBlock }) => <Divider variant={variant} style={{ margin: `${top}px 0 0` }} />;

function DocSection({ title, tone = 'section', first, children }) {
  return (
    <section style={{ paddingTop: first ? 24 : 20 }}>
      <div style={{
        background: tone === 'split' ? DOC_TOKENS.colorSplit : DOC_TOKENS.colorSectionBg,
        borderLeft: `${DOC_TOKENS.lineWidthFocus}px solid ${DOC_TOKENS.colorText}`,
        borderRadius: `0 ${DOC_TOKENS.radiusXS}px ${DOC_TOKENS.radiusXS}px 0`, padding: '7px 12px',

        <DocText size="xxs" strong caps block>{title}</DocText>
      </div>
      <div style={{ padding: `${DOC_TOKENS.gapBlock}px 4px 0` }}>{children}</div>
    </section>
  );
}

function doDateCard(d, day) {
  const p = d.plan; const k = day.key;
  if ((d.blocked || []).includes(k)) return { status: 'No slots left', note: 'Site fully booked this day', tone: 'muted', disabled: true };
  if (p.loading === 'live') {
    const e = LIVE_EVAL[k];
    return { ...e, selected: p.drop === k, badge: d.rec === k ? 'Recommended' : null };
  }
  if (p.drop === k) return { status: 'Drop', note: DP_DROP_NOTE[k], selected: true, badge: 'Drop' };
  if (p.pickup === k) {
    const tight = k === 'tue2';
    return { status: tight ? 'Pickup · tight' : 'Pickup', note: DP_PICK_NOTE[p.access][k], tone: tight ? 'warn' : null, selected: true, badge: 'Pickup' };
  }
  return { ...DP_EVAL[k], badge: !p.drop && d.rec === k ? 'Recommended' : null };
}

/* Predicted schedule, cost warning and summary for the current plan */
function doEval(d) {
  const p = d.plan; const site = 'the site';
  const drop = p.drop && doDay(p.drop); const pick = p.pickup && doDay(p.pickup);
  if (!drop) return { points: [], warn: null, summary: null };
  const start = hm(p.dropWin);
  if (p.loading === 'live') {
    const appt = p.access === 'appt';
    const late = !appt && start != null && start >= 11 * 60;
    const tight = p.drop === 'tue2';
    const gate = start != null ? start + (appt ? 240 : 300) : 11 * 60;
    const pre = start != null ? start - (appt ? 75 : late ? 45 : 30) : 6 * 60;
    const points = [
      { type: 'Predicted', title: `Empty pickup · ${DO_CY_SHORT}`, time: `${drop.label}, ~${fmtHm(pre)}`, note: 'After the empty release' },
      appt
        ? { type: 'You entered', title: `Empty drop · ${site} slot`, time: `${drop.label}, ${p.dropWin}`, note: '2 h free from slot start, then $95/h' }
        : { type: 'You entered', title: `Empty drop · ${site}`, time: `${drop.label}, ${p.dropWin}`, note: late ? 'Late in the day for a first-come site' : 'At opening · shortest queue', warn: late },
      late
        ? { type: 'Predicted', title: `Gate-in · ${DO_CTO_SHORT}`, time: `${doNextDay(p.drop).label}, morning`, note: 'After the 16:30 gate close · overnight at the yard', warn: true }
        : { type: 'Predicted', title: `Gate-in · ${DO_CTO_SHORT}`, time: `${drop.label}, ~${fmtHm(gate)}`, note: tight ? 'Same day as the VGM and terminal cutoffs' : 'Before the 16:30 gate close · 1 of 4 free days', warn: tight },
    ];
    const warn = late ? '$50 yard storage' : tight ? 'rollover to the next vessel' : null;
    const summary = warn ? null : appt
      ? ['No extra cost expected', `The truck arrives about 1 h before the slot and gate-in is the same day. If the truck misses the slot, the site may rebook it and ${DO_CARRIERS[d.carrier]?.short || 'the carrier'} can charge waiting or truck-not-used [$].`]
      : ['No extra cost expected', `Gate-in the same day, ${drop.wd} working days before both cutoffs, 1 of 4 free days used.`];
    return { points, warn, summary, lateInput: late };
  }
  const cd = pick ? doFreeDays(p.drop, p.pickup) : null;
  const tight = p.pickup === 'tue2';
  if (p.access === 'appt') {
    const points = [
      { type: 'Predicted', title: `Empty pickup · ${DO_CY_SHORT}`, time: `${drop.label}, ~06:15`, note: 'After the empty release' },
      { type: 'You entered', title: `Empty drop · ${site}`, time: `${drop.label}, ${p.dropWin}`, note: 'On the slot · no truck waits' },
      pick && { type: 'You entered', title: `Full pickup · ${site}`, time: `${pick.label}, ${p.pickupWin}`, note: tight ? `3 h before the VGM cutoff · chassis day ${cd}` : `${pick.wd} working days before cutoffs · chassis day ${cd}`, warn: tight },
      pick && { type: 'Predicted', title: `Gate-in · ${DO_CTO_SHORT}`, time: `${pick.label}, ~${fmtHm((hm(p.pickupWin) ?? 8 * 60) + 90)}`, note: `Before the cutoff · ${cd} of 4 free days`, warn: tight || cd > 4 },
    ].filter(Boolean);
    const warn = pick && (tight || cd > 4) ? '$50 yard storage' : null;
    return { points, warn, summary: !warn && pick ? ['No extra cost expected', `Pickup ${pick.wd} working days before the VGM cutoff, gate-in ${pick.label} · ${cd} of 4 free days.`] : null, tightPickup: tight };
  }
  const points = [
    { type: 'Predicted', title: `Empty pickup · ${DO_CY_SHORT}`, time: `${drop.label}, morning`, note: 'After the empty release' },
    { type: 'You entered', title: `Empty drop · ${site}`, time: `${drop.label}, 06:00–14:00`, note: 'Inside site hours · no truck waits' },
    pick && { type: 'You entered', title: `Full pickup · ${site}`, time: `${pick.label}, after loaded`, note: 'Waits for the site to confirm loaded', warn: true },
    pick && { type: 'Predicted', title: `Gate-in · ${DO_CTO_SHORT}`, time: `${pick.label}, afternoon`, note: `Before the 16:30 gate close · ${cd} of 4 free days`, warn: cd > 4 },
  ].filter(Boolean);
  return { points, warn: pick ? '$50 yard storage' : null, summary: null };
}

      <Form form={form} layout="vertical" requiredMark={false}
        initialValues={{ drop: dateVal(p.drop), dropWin: suggest.dropWin ?? p.dropWin, dropRef: p.dropRef, pickup: dateVal(suggest.pickup ?? p.pickup), pickupWin: suggest.pickupWin ?? p.pickupWin, pickupRef: p.pickupRef, apptRef: p.apptRef }}>

        {!dp && p.access === 'appt' && <Form.Item name="apptRef" label="Appointment ref"><Input placeholder="[Site ref]" /></Form.Item>}
        {dp && <Form.Item name="pickup" label="Full pickup date" rules={[{ required: true, message: 'Pick a date' }]}><DatePicker format="ddd D MMM YYYY" disabledDate={allowed} style={{ width: '100%' }} /></Form.Item>}

      <div className="do-impact">
        <b>After the change</b>

const DoInput = ({ label, ...p }) => <label className="do-input"><span>{label}</span><Input {...p} /></label>;

/* Day typed into a field: "Thu 28 May", "28 May" or "thu 28" → a DO_DAYS key */
const doParseDay = (txt) => {
  const t = (txt || '').trim().toLowerCase();
  if (!t) return null;
  const day = DO_DAYS.find((x) => { const l = x.label.toLowerCase(); return t.startsWith(l) || t.startsWith(l.slice(4)) || t.startsWith(l.split(' ').slice(0, 2).join(' ')); });
  return day ? day.key : undefined;
};
// "Thu 28 May · 07:00–08:00" field: the day picks the date, the part after " · " is the window
function DoDayField({ label, dayKey, win, withWin = true, status, onChange }) {
  const show = (k, w) => (k ? `${doDay(k).label}${withWin ? ` · ${w || ''}` : ''}` : '');
  const [txt, setTxt] = useState(show(dayKey, win));
  const [bad, setBad] = useState(false);
  useEffect(() => { setTxt(show(dayKey, win)); setBad(false); }, [dayKey, win]);
  const commit = () => {
    const [dayPart, ...rest] = txt.split(' · ');
    const k = doParseDay(dayPart);
    if (k === undefined) { setBad(true); return; }
    onChange(k, withWin ? (rest.join(' · ') || win) : win);
  };
  return <DoInput label={label} value={txt} placeholder={withWin ? 'Thu 28 May · 07:00–08:00' : 'Thu 28 May'} status={bad ? 'error' : status}
    title={bad ? 'Type a day between Wed 27 May and Tue 2 Jun, e.g. Thu 28 May' : undefined}
    onChange={(e) => { setTxt(e.target.value); setBad(false); }} onBlur={commit} onPressEnter={commit} />;
}

function doAttention(d) {

  if (!d.vgm && d.legsDone < 3) items.push(d.legsDone >= 2

    : { key: 'vgm', when: 'This week', title: 'VGM not submitted', desc: `Loads ${t.load.split(' · ')[0]} · VGM cutoff Tue 2 Jun 12:00`, tag: 'Container', btn: 'Open container', act: 'container' });

  return items.filter((x) => !d.snoozed.includes(x.key));
}
const doNeedsAttention = (d) => (doStatus(d) === 'draft' ? doMissing(d).includes('weight') || (!d.plan.drop && d.rec === 'tue2') : doAttention(d).some((x) => x.warn));

/* ---------- legs: fixed (read-only) / planned (editable until reported) / actual (from the carrier) ---------- */
const reportNote = (c, r) => { const m = /by (phone|email) (\d\d:\d\d)/.exec(r || ''); return m ? `${c.short} · ${m[1]} ${m[2]}` : r ? `${c.short} · reported` : ''; };
const DO_LEG_TAG = { Next: 'next', Planned: '', Done: 'ok', 'In progress': 'next', 'Done · exception': 'err', 'Done · extra charge': 'gold' };

/* ---------- legs: the same event rows as the container tracking (Figma Container/step) ---------- */
// "Thu 28 May, 06:00" / "Today 15:00–17:00" / "09:30–11:30" → { day key, start, end }
const doParseWhen = (s, fallbackDay) => {
  const day = DO_DAYS.find((x) => (s || '').startsWith(x.label));
  const m = (s || '').match(/(\d\d:\d\d)(?:–(\d\d:\d\d))?/);
  return { day: day?.key || fallbackDay || 'thu28', start: m?.[1] || '08:00', end: m?.[2] || m?.[1] || '10:00' };
};
const doAt = (dayKey, time) => dayjs(`${doDay(dayKey).iso}T${time || '00:00'}`);
const DoPicker = (p) => <DatePicker showTime={{ format: 'HH:mm' }} format="DD/MM/YY HH:mm" placeholder="DD/MM/YY" allowClear={false} className="do-dp" {...p} />;

/* ---------- legs (DO / Legs): every leg shows its milestones; Edit opens the leg's drawer ---------- */
const doFmt = (v) => (v ? v.format('DD MMM, HH:mm') : null);
// legs with their milestones; estimated times come from the plan, actual from the carrier reports, d.ms holds the operator's edits
function doLegs(d) {
  const t = doTimes(d); const a = d.actual; const ms = d.ms || {};
  const pk = doParseWhen(t.pickup); const ld = doParseWhen(t.load, pk.day); const gt = doParseWhen(t.gate, ld.day);
  const at = (day, time, off = 0) => (time ? doAt(day, time).add(off, 'minute') : null);
  const r = (k, label, est, act) => { const a2 = ms[k] && 'act' in ms[k] ? (ms[k].act ? dayjs(ms[k].act) : null) : act; return { k, label, est: ms[k]?.est ? dayjs(ms[k].est) : est, act: a2, missing: !a2 && (d.missing || []).includes(k) }; };
  const l1 = d.legsDone >= 1; const l2in = d.legsDone >= 2 || d.inLeg; const l2 = d.legsDone >= 2; const l3 = d.legsDone >= 3;
  const legs = [
    { id: 'l1', n: '1', title: 'Empty container pickup', place: d.places.cy.name, fixed: [['Earliest release', '27 May, 08:00']], rows: [
      r('l1-arr', 'Arrival at depot', at(pk.day, pk.start, -30), l1 ? at(pk.day, a.pickedUp, -30) : null),
      r('l1-gin', 'Gate in', at(pk.day, pk.start, -20), l1 ? at(pk.day, a.pickedUp, -20) : null),
      r('l1-rel', 'Container released', at(pk.day, pk.start, -10), l1 ? at(pk.day, a.pickedUp, -10) : null),
      r('l1-gout', 'Gate out', at(pk.day, pk.start), l1 ? at(pk.day, a.pickedUp) : null)] },
    { id: 'l2', n: '2', title: 'Loading & full pickup', place: d.places.load.short || d.places.load.name, method: [['Receiving Method', DO_LOADING[d.plan.loading]], ['Loading method', d.plan.access === 'appt' ? 'Appointment' : 'First come, first served']], fixed: [['Earliest release', '27 May, 08:00']], rows: [
      r('l2-arr', 'Arrival', at(ld.day, ld.start), l2in ? at(ld.day, a.arrived) : null),
      r('l2-start', 'Loading started', at(ld.day, ld.start, 15), l2in ? at(ld.day, a.loadingSince || a.arrived, a.loadingSince ? 0 : 15) : null),
      r('l2-done', 'Loading completed', at(ld.day, ld.end, -30), l2 ? at(ld.day, a.loaded, -10) : null),
      r('l2-full', 'Full pickup', at(ld.day, ld.end), l2 ? at(ld.day, a.loaded) : null)] },
    d.extra && { id: 'ly', n: '+', yard: true, title: 'Yard stop · appointment only next day', place: `${DO_CARRIERS[d.carrier].short} yard, Elizabeth NJ`, fixed: [], rows: [
      r('ly-arr', 'Arrived at yard', doAt('wed27', '11:40'), doAt('wed27', '11:40')),
      r('ly-dep', 'Departed from yard', doAt('thu28', '12:10'), doAt('thu28', '12:10'))] },
    { id: 'l3', n: '3', title: 'Full container return', place: DO_TERMINAL, fixed: [['Earliest return', '27 May, 08:00'], ['Terminal cutoff', '02 Jun, 18:00']], rows: [
      r('l3-arr', 'Arrived at terminal', at(gt.day, gt.start, -30), l3 ? at(gt.day, a.gatedIn, -10) : null),
      r('l3-gin', 'Gate in', at(gt.day, gt.start), l3 ? at(gt.day, a.gatedIn) : null),
      r('l3-acc', 'Container accepted', at(gt.day, gt.start, 30), l3 ? at(gt.day, a.gatedIn, 20) : null)] },
  ].filter(Boolean);
  let nextSet = false;
  for (const l of legs) {
    l.done = l.rows.filter((x) => x.act).length;
    l.status = l.done === l.rows.length ? 'Completed' : l.done ? 'In progress' : !nextSet ? 'Next' : 'Planned';
    if (l.status !== 'Completed') nextSet = true;
  }
  return legs;
}
const DO_LEG_TONE = { Completed: 'ok', 'In progress': 'next', Next: 'next', Planned: '' };
// after an edit: completed legs, current leg and the reported times follow the milestones
function doFromLegs(d) {
  const legs = doLegs(d).filter((l) => !l.yard);
  let legsDone = 0; while (legsDone < legs.length && legs[legsDone].status === 'Completed') legsDone++;
  const act = (k) => legs.flatMap((l) => l.rows).find((x) => x.k === k)?.act?.format('HH:mm');

/* DO / Recommended days — every possible day with its cost, from the same rules as the planner */
// drop & pick with an appointment: the days exactly as on Figma 7602:138756
const DO_DROP_DAYS_DP_APPT = {
  wed27: { status: 'Early drop', note: 'Cargo not ready · adds a chassis day', tone: 'warn' },
  thu28: { status: 'No extra cost', note: 'Cargo ready · pickup Fri 29, 2 working days before the cutoffs', tone: 'ok' },
  fri29: { status: 'Tight', note: 'Pickup Mon 1 before 09:00 to make the VGM', tone: 'warn' },
  mon1: { status: 'Misses the VGM cutoff', note: "Loading and weighing can't finish by Tue 12:00", tone: 'err', disabled: true },
  tue2: { status: 'Misses the vessel', note: 'After the terminal cutoff', tone: 'err', disabled: true },
};
const doShortDay = (k) => doDay(k).label.replace(/ [A-Za-z]+$/, ''); // "Thu 28 May" → "Thu 28"
function DoDaysModal({ d, which, close, msg }) {
  const p = d.plan; const dp = p.loading === 'dp'; const pickup = which === 'pickup';
  const days = (pickup ? DO_DAYS.filter((x) => doDayIdx(x.key) > doDayIdx(p.drop || 'wed27')) : DO_DAYS).slice(0, 5);
  const card = (day) => {
    if (!pickup && doScen(p) === 'dp-appt' && DO_DROP_DAYS_DP_APPT[day.key]) return DO_DROP_DAYS_DP_APPT[day.key];
    if (!pickup) { const e0 = doDateCard({ ...d, plan: { ...p, drop: null, pickup: null } }, day); const e = { ...e0, status: e0.status === 'Drop' ? 'No extra cost' : e0.status }; return { ...e, tone: e.tone === 'error' ? 'err' : e.tone === 'warn' || e.status === 'Early drop' || e.status === 'Tight' ? 'warn' : e.tone === 'muted' ? 'muted' : 'ok' }; }
    const k = day.key; const tight = k === 'tue2'; const miss = k === 'wed3';
    return { status: miss ? 'Misses the vessel' : tight ? 'Tight' : 'No extra cost', note: miss ? 'After the terminal cutoff' : DP_PICK_NOTE[p.access][k] || 'Before the cutoffs', tone: miss ? 'err' : tight ? 'warn' : 'ok', disabled: miss };
  };
  const rec = pickup ? 'fri29' : d.rec;
  const [sel, setSel] = useState((pickup ? p.pickup : p.drop) || rec);
  const win = pickup ? (p.access === 'appt' ? '10:00–11:00' : 'after loaded') : DO_REC_WIN[doScen(p)];
  const use = () => { doPatch(d.id, { plan: { ...p, ...(pickup ? { pickup: sel, ...(p.access === 'appt' ? { pickupWin: win } : {}) } : { drop: sel, dropWin: win, ...(dp && p.pickup && doDayIdx(p.pickup) <= doDayIdx(sel) ? { pickup: null } : {}) }) } }); msg.success(`${pickup ? 'Full pickup' : 'Empty drop'} set to ${doDay(sel).label}`); close(); };
  return (
    <Modal open onCancel={close} width={992} className="do-days-modal" title={<div className="do-days-title"><b>Recommended days for the {pickup ? 'full pickup' : 'empty drop'}</b><span>{d.id} · {DO_LOADING[p.loading]} · {p.access === 'appt' ? 'Appointment' : 'First come, first served'}</span></div>}
      footer={<><Button onClick={close}>Cancel</Button><Button type="primary" className="do-dark" onClick={use}>Use {doShortDay(sel)}, {win}</Button></>} destroyOnHidden>
      <div className="do-days">
        <div className="do-days-head"><b>Pick a day</b><span className="do-legend"><i className="ok" />No extra cost<i className="warn" />Tight or extra cost<i className="err" />Misses the vessel</span></div>
        <div className="do-days-row">
          {days.map((day) => { const e = card(day); return (
            <button key={day.key} type="button" disabled={e.disabled} className={`do-day ${e.tone}${sel === day.key ? ' sel' : ''}`} onClick={() => setSel(day.key)}>
              <span className="do-day-top"><b>{doShortDay(day.key)}</b>{day.key === rec && <Tag color="green" bordered={false}>Recommended</Tag>}</span>
              <b className={`do-day-st ${e.tone}`}>{e.status}</b><span className="do-sub">{e.note}</span>
            </button>
          ); })}
        </div>
        <div className="do-days-box"><DoV label={`Arrival window on ${doShortDay(sel)}`} value={`${win} · recommended`} /></div>
        <div className="do-days-box"><b>Cargo and site</b><div className="do-days-grid"><DoV label="Cargo ready · customer" value="Thu 28 May" /><DoV label="Shipper loads within" value="1 day" /><DoV label="Site hours" value={p.hours || d.places.load.hours || 'Mon–Fri 06:00–14:00'} /><DoV label="Empty release from" value="Wed 27 May" /></div></div>
        <div className="do-days-box"><b>Terminal and vessel</b><div className="do-days-grid"><DoV label="Terminal receives (ERD)" value="Wed 27 May" /><DoV label="VGM cutoff" value="Tue 2 Jun, 12:00" /><DoV label="Port cutoff" value="Tue 2 Jun, 18:00" /><DoV label="Free time" value="4 days · LFD Mon 1 Jun" /></div></div>
      </div>
    </Modal>
  );
}

/* ---------- list (frame 0) ---------- */
function doRow(d) {
  const st = doStatus(d); const c = DO_CARRIERS[d.carrier]; const t = doTimes(d); const a = d.actual; const p = d.plan;
  const r = { d, id: d.id, st, container: d.number || 'Not assigned', bold: !!d.number, containerSub: `20'ST · ${d.siteTitle}`, carrier: '—', carrierSub: null, idSub: null };
  if (st === 'draft') {
    const tight = d.rec === 'tue2';
    r.idSub = doMissing(d).includes('weight') ? ['Weight missing', 'warn'] : !p.drop && tight ? ['Tight date', 'warn'] : null;
    r.fix = 'days:drop';
    [r.next, r.nextSub, r.nextWarn] = !p.drop ? ['Not planned yet', `Recommended: ${doDay(d.rec).label}${tight ? ' · tight' : ''}`, tight]
      : [`Drop ${doDay(p.drop).label}${p.pickup ? ` · pickup ${doDay(p.pickup).label}` : ''}`, 'Not sent to a carrier yet'];
    [r.deadline, r.deadlineSub, r.deadlineWarn, r.order] = [d.deadline.title, d.deadline.sub, d.deadline.warn, d.deadline.order];
  } else {
    r.carrier = c.name;
    if (st === 'dispatched') { [r.next, r.nextSub] = ['Waiting for confirmation', `Empty pickup ${t.pickup}`]; r.carrierSub = `Dispatched ${d.dispatchedAt}`; [r.deadline, r.deadlineSub, r.deadlineWarn, r.order] = ['Confirm by today 17:00', 'Day-before check', true, 0]; }
    if (st === 'confirmed') { [r.next, r.nextSub] = [`Empty pickup ${t.pickup}`, DO_CY_SHORT]; r.carrierSub = `Confirmed ${d.confirmedAt}`; [r.deadline, r.deadlineSub, r.order] = ['Empty pickup tomorrow 06:00', DO_CY_SHORT, 5]; }
    if (st === 'progress') {
      // as on the Figma list: the next milestone with its planned time
      const lg = doLegs(d); const nx = lg.flatMap((l) => doKeyRows(l)).find((x) => !x.act);
      const nm = nx && ({ 'l2-arr': 'Empty drop' }[nx.k] || nx.label);
      if (nx?.missing) r.fix = `leg:${lg.find((l) => l.rows.includes(nx)).id}`;
      [r.next, r.nextSub, r.nextWarn] = nx ? [`${nm}: ${nx.est.format('D MMM, HH:mm')}`, nx.missing ? `${nm} event missing` : null, nx.missing] : ['All legs done', null, false];
      r.carrierSub = 'Updated 08:40 · phone'; [r.deadline, r.deadlineSub, r.order] = ['Gate-in today 15:00', 'Day 1 of 4 free days', 1];
      if (d.exception?.open) r.idSub = [d.exception.kind === 'seal' ? 'Seal exception' : 'Exception', 'err'];
    }
    if (st === 'completed') { [r.next, r.nextSub] = [d.invoice ? 'Invoice added' : 'Carrier invoice', `Gated in 28 May ${a.gatedIn || ''}`]; r.carrierSub = 'All legs done'; [r.deadline, r.deadlineSub, r.order] = d.invoice ? ['—', 'Nothing due', 9] : ['Carrier invoice by Thu 4 Jun', '7 days after gate-in', 8]; if (d.extra === 'pending') r.idSub = ['Extra charge', 'warn']; }
  }
  r.attention = doNeedsAttention(d);
  return r;
}

const crumb = (title, to) => ({ title, to });
const HOME = crumb('Home', '/overview');
function resolvePage(path, query) {
  const fin = path.match(/^\/finances\/(receivables|payables)\/(billing|transactions)$/);
  if (fin) {
    const [, side, kind] = fin; const payable = side === 'payables';
    return { navKey: path, crumbs: [HOME, crumb('Finances'), crumb(payable ? 'Payables' : 'Receivables'), crumb(kind === 'billing' ? 'Billing' : 'Transactions')],
      el: kind === 'billing' ? <BillingPage key={path} payable={payable} /> : <TransactionsPage key={path} payable={payable} /> };
  }
  const rate = path.match(/^\/rates\/([\w-]+)$/);
  if (rate && RATE_TITLES[rate[1]]) return { navKey: '/rates', crumbs: [HOME, crumb('Rates', '/rates'), crumb(RATE_TITLES[rate[1]])], el: <RateTablePage key={rate[1]} slug={rate[1]} /> };
  const auth = path.match(/^\/auth\/([\w-]+)$/);
  if (auth && AUTH_STEPS.includes(auth[1])) return { bare: true, crumbs: [crumb({ 'sign-in': 'Sign In', forgot: 'Forgot password', reset: 'Change password', 'sign-up': 'Sign Up', verify: 'Verify your email' }[auth[1]])], el: <AuthPage step={auth[1]} /> };
  if (path === DOC_PATH) return { bare: true, crumbs: [crumb('Dispatch Order')], el: <DispatchOrderDocPage variant={query.v} /> };
  if (path === '/site') return { bare: true, crumbs: [crumb('Freight quotes')], el: <LandingPage /> };
  if (path === '/site/quotes') return { bare: true, crumbs: [crumb('Compare offers')], el: <PublicQuotesPage key={JSON.stringify(query)} query={query} /> };
  if (path === '/quote-shipments') {
    const searched = !!decodeQuery(query);
    return { navKey: path, crumbs: [HOME, crumb('Quote shipments', searched ? '/quote-shipments' : undefined), ...(searched ? [crumb('New request')] : [])],
      el: <QuoteShipmentsPage key={JSON.stringify(query)} query={query} /> };
  }
  if (path === '/profile') return { navKey: '', crumbs: [HOME, crumb('Profile')], el: <ProfilePage key={query.tab || 'documents'} initialTab={query.tab} /> };
  if (path === DISPATCH_PATH) {
    return { navKey: '/shipments', collapsed: true, crumbs: [crumb('Shipments', '/shipments'), crumb(SHIPMENT_ID, SHIPMENT_PATH), crumb('Inland Pickup · Dispatches')], el: <DispatchOrdersPage key={query.f || 'list'} f={query.f} /> };
  }
  const dspRoute = path.startsWith(DISPATCH_PATH + '/') && path.slice(DISPATCH_PATH.length + 1);
  if (dspRoute && /^ID-\d+$/.test(dspRoute)) {
    // ID-9981…9984 are the new dispatch orders; older seeded IDs keep the previous dispatch page

      return { navKey: '/shipments', collapsed: true, crumbs: [crumb('Shipments', '/shipments'), crumb(SHIPMENT_ID, SHIPMENT_PATH), crumb('Inland Pickup · Dispatches', DISPATCH_PATH), crumb(dspRoute)],

    }
    return { navKey: '/dispatches', crumbs: [crumb('Shipments', '/shipments'), crumb(SHIPMENT_ID, SHIPMENT_PATH), crumb('Inland Pickup'), crumb('Dispatches', DISPATCH_PATH), crumb(dspRoute)],
      el: <DispatchPage key={dspRoute} id={dspRoute} /> };
  }
  const gcRoute = path.match(/^\/containers\/(g\d+)$/);
  if (gcRoute) {
    const row = GC_MOCK.find((x) => x.key === gcRoute[1]);
    return { navKey: '/containers', crumbs: [HOME, crumb('Containers', '/containers'), crumb(row ? row.number || 'Not assigned' : 'Not found')], el: <GlobalContainerPage key={gcRoute[1]} gkey={gcRoute[1]} /> };
  }
  const cnRoute = path.startsWith(CONTAINERS_PATH) && path.slice(CONTAINERS_PATH.length).match(/^(?:\/(\d+))?$/);
  if (cnRoute) {
    const id = cnRoute[1];
    const base = [HOME, crumb('Shipments', '/shipments'), crumb(SHIPMENT_ID, SHIPMENT_PATH), crumb('Containers', id ? CONTAINERS_PATH : undefined)];
    return { navKey: '/shipments', collapsed: true, crumbs: id ? [...base, crumb(id)] : base,
      el: id ? <ContainerHubPage key={id} id={id} /> : <ContainersListPage /> };
  }
  if (path === SHIPMENT_PATH) {
    return { navKey: '/shipments', collapsed: true, crumbs: [HOME, crumb('Shipments', '/shipments'), crumb(SHIPMENT_ID, SHIPMENT_PATH), crumb('Ocean Booking'), crumb('Planning & Tracking')],
      el: <ShipmentPage screen={query.screen} /> };
  }
  const simple = {
    '/overview': ['Overview', <OverviewPage />],
    '/action-center/tasks': ['Tasks', <TasksPage />, 'Action Center'],
    '/action-center/notifications': ['Notifications', <NotificationsPage />, 'Action Center'],
    '/quote-requests': ['Quote requests', <QuoteRequestsPage />],
    '/guest-bookings': ['Guest bookings', <GuestBookingsPage />],
    '/dispatches': ['Dispatches', <DispatchesPage />],
    '/shipments': ['Shipments', <ShipmentsPage />],
    '/containers': ['Containers', <AllContainersPage />],
    '/contacts': ['Contacts', <ContactsPage />],
    '/rates': ['Rates', <RatesPage />],
    '/analytics': ['Analytics', <AnalyticsPage />],
  }[path];
  if (simple) {
    const [title, el, parent] = simple;
    return { navKey: path, crumbs: [HOME, ...(parent ? [crumb(parent)] : []), crumb(title)], el };
  }
  return { navKey: '', crumbs: [HOME, crumb('Not found')], el: <div className="card"><Empty description="Page not found"><Button type="primary" onClick={() => go('/overview')}>Go to Overview</Button></Empty></div> };
}

/* ---------- screens switcher ---------- */
function ScreenSwitcher({ route }) {
  const [open, setOpen] = useState(false);
  const full = route.path + (route.query.tab ? `?tab=${route.query.tab}` : '');
  const shipIdx = route.path === SHIPMENT_PATH ? clampScreen(route.query.screen) : -1;
  const pageIdx = PAGE_SCREENS.findIndex(([, , to]) => to === full);
  const badge = shipIdx >= 0 ? `S${shipIdx + 1}` : pageIdx >= 0 ? pageIdx + 1 : null;
  const pick = (to) => { go(to); setOpen(false); };
  return (
    <>
      <FloatButton icon={<I.AppstoreOutlined />} tooltip="Figma screens" onClick={() => setOpen(true)} badge={badge ? { count: badge, color: '#5f68c0' } : undefined}
        style={{ insetInlineStart: 8, insetInlineEnd: 'auto', bottom: 16, zIndex: 2000 }} />
      <Drawer open={open} onClose={() => setOpen(false)} title="Figma screens" size={360} placement="left" zIndex={2100}>
        <div className="sw-group">Pages</div>
        <List className="screens-list" dataSource={PAGE_SCREENS} renderItem={([id, name, to], i) => (
          <List.Item className={i === pageIdx ? 'cur' : ''} onClick={() => pick(to)}>
            <span><span className="num">{i + 1}</span>{name}</span><span className="lbl" style={{ color: '#6a6f88' }}>{id}</span>
          </List.Item>
        )} />
        <div className="sw-group">Shipment {SHIPMENT_ID} · Planning & Tracking <span className="muted">(← / →)</span></div>
        <List className="screens-list" dataSource={SCREENS} renderItem={([id, name], i) => (
          <List.Item className={i === shipIdx ? 'cur' : ''} onClick={() => pick(`${SHIPMENT_PATH}?screen=${i + 1}`)}>
            <span><span className="num">S{i + 1}</span>{name}</span><span className="lbl" style={{ color: '#6a6f88' }}>{id}</span>
          </List.Item>
        )} />
      </Drawer>
    </>
  );
}

/* ---------- shipment detail page (Planning & Tracking) ---------- */
const clampScreen = (n) => { const v = parseInt(n, 10); return v >= 1 && v <= SCREENS.length ? v - 1 : 0; };
function ShipmentPage({ screen }) {
  const cur = clampScreen(screen);
  const [st, setSt] = useState(() => SCREENS[cur][2]());
  useEffect(() => { setSt(SCREENS[cur][2]()); }, [cur]);
  useEffect(() => {
    const onKey = (e) => {
      if (/input|textarea/i.test(e.target.tagName) || document.querySelector('.ant-drawer-open')) return;
      if (e.key === 'ArrowRight' && cur < SCREENS.length - 1) go(`${SHIPMENT_PATH}?screen=${cur + 2}`);
      if (e.key === 'ArrowLeft' && cur > 0) go(`${SHIPMENT_PATH}?screen=${cur}`);
    };
    addEventListener('keydown', onKey);
    return () => removeEventListener('keydown', onKey);
  }, [cur]);
  const [msgApi, msgCtx] = message.useMessage();
  const act = {
    msg: msgApi,
    upsert: (section, group, rec) => setSt((s) => {
      const list = s.data[section][group];
      const next = list.some((r) => r.id === rec.id) ? list.map((r) => (r.id === rec.id ? rec : r)) : [...list, rec];
      return { ...s, open: { ...s.open, [section]: true }, data: { ...s.data, [section]: { ...s.data[section], [group]: next } } };
    }),
    remove: (section, group, id) => setSt((s) => ({
      ...s, data: { ...s.data, [section]: { ...s.data[section], [group]: s.data[section][group].filter((r) => r.id !== id) } },
    })),
    set: (o) => setSt((s) => ({ ...s, ...o })),
    toggle: (k) => setSt((s) => ({ ...s, open: { ...s.open, [k]: !s.open[k] } })),
    drawer: (d) => setSt((s) => ({ ...s, drawer: d })),
  };
  return (
    <>
      {msgCtx}
      <PageHeader />
      <div className="columns">
        <SideMenu />
        <div className="content-wrap">
          <ExceptionBars st={st} act={act} />
          <div className="content">
            <div className="col-left">
              <OriginSection st={st} act={act} />
              <MainSection st={st} act={act} />
              <DestinationSection st={st} act={act} />
            </div>
            <RightColumn st={st} act={act} />
          </div>
        </div>
      </div>
      <Drawers st={st} act={act} />
    </>
  );
}

/* ---------- app: hash router ---------- */
const parseRoute = () => {
  let h = location.hash.replace(/^#/, '');
  const legacy = h.match(/^screen-(\d+)/); // old links: #screen-N → shipment state N
  if (legacy) { h = `${SHIPMENT_PATH}?screen=${legacy[1]}`; history.replaceState(null, '', '#' + h); }
  // embedded (the claude.ai artifact viewer) opens on the dispatch list; the standalone site keeps Overview
  if (!h.startsWith('/')) h = window.self !== window.top ? DISPATCH_PATH : '/overview';
  const [path, qs] = h.split('?');
  return { path: path.replace(/\/$/, '') || '/overview', query: Object.fromEntries(new URLSearchParams(qs || '')) };
};
function App() {
  const [route, setRoute] = useState(parseRoute);
  const currentPath = useRef(route.path);
  useEffect(() => {
    // Page changes animate with the View Transitions API (cross-fade + the shipment card morphing into the header);
    // browsers without it get a CSS fade-in on .page instead.
    const onHash = () => {
      const next = parseRoute();
      const apply = () => ReactDOM.flushSync(() => setRoute((prev) => { if (prev.path !== next.path) scrollTo(0, 0); return next; }));
      const pathChanged = next.path !== currentPath.current;
      currentPath.current = next.path;
      const animate = pathChanged && document.startViewTransition && document.visibilityState === 'visible' && !matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!animate) { apply(); return; }
      // An interrupted transition (rapid navigation) rejects its promises; the DOM update itself still happens.
      const t = document.startViewTransition(apply);
      [t.ready, t.finished, t.updateCallbackDone].forEach((p) => p.catch(() => {}));
    };
    addEventListener('hashchange', onHash);
    return () => removeEventListener('hashchange', onHash);
  }, []);
  const page = resolvePage(route.path, route.query);
  useEffect(() => { document.title = `${page.crumbs[page.crumbs.length - 1].title} · Skypace`; }, [route.path]);
  return (
    <ConfigProvider theme={theme}>
      {page.bare ? <div className="page" key={route.path.startsWith('/auth/') ? '/auth' : route.path}>{page.el}</div> : (
        <div className={'app' + (page.collapsed ? ' collapsed' : ' full')}>
          {page.collapsed ? <Rail navKey={page.navKey} /> : <Sidebar navKey={page.navKey} />}
          <div className="main">
            <TopBar crumbs={page.crumbs} navKey={page.navKey} shipmentMenu={page.collapsed} />
            <main className="page" key={route.path}>{page.el}</main>
          </div>
        </div>
      )}
      <ScreenSwitcher route={route} />
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

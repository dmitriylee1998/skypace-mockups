<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<script>
/* one-time reset of the prototype's saved data for everyone who opened an older build */
(function () { try { var V = '2026-10-16'; if (localStorage.getItem('skypace.dataVersion') !== V) {
  Object.keys(localStorage).filter(function (k) { return k.indexOf('skypace.') === 0; }).forEach(function (k) { localStorage.removeItem(k); });
  sessionStorage.clear(); localStorage.setItem('skypace.dataVersion', V); } } catch (e) {} })();
</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skypace Shipments</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/antd@6.6.5/dist/antd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ant-design/icons@6.3.4/dist/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  :root {
    --text: #323656;
    --text-2: #555a75;
    --muted: #6a6f88;
    --bg: #f4f5f8;
    --card: #ffffff;
    --gray-1: #f9fafb;
    --split: #eeeff1;
    --primary: #5f68c0;
    --primary-7: #3d47a3;
    --primary-bg: #f0f1fa;
    --link: #414bb3;
    --pale: #d1d7e2;
    --border: #d9d9d9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Roboto, -apple-system, "Segoe UI", sans-serif; font-size: 14px; line-height: 22px; }
  p { margin: 0; }
  .ic { display: inline-flex; flex: none; line-height: 0; }
  .ic svg { width: 100%; height: 100%; display: block; }

  /* ---------- app shell ---------- */
  .app { display: flex; min-height: 100vh; }
  .rail { width: 47px; flex: none; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  .rail-logo { height: 48px; display: flex; align-items: center; justify-content: center; color: #202c3c; }
  .rail-item { padding: 4px; }
  .rail-item button { all: unset; cursor: pointer; width: 39px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--text); font-size: 14px; }
  .rail-item button:hover { background: #eaeef8; }
  .rail-item.active button { background: #fff; }
  .main { flex: 1; min-width: 0; margin-left: 8px; padding-right: 24px; display: flex; flex-direction: column; }
  .topbar { height: 48px; display: flex; align-items: center; justify-content: space-between; padding-left: 16px; }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .topbar-actions .ant-btn { width: 48px; }

  .page-header { background: #fff; border-radius: 8px; padding: 12px; box-shadow: inset 0 -1px 0 #f4f5f8; display: flex; gap: 32px; min-height: 76px; }
  .ph-left { width: 198px; flex: none; display: flex; gap: 16px; align-items: center; }
  .ph-title { font-size: 20px; line-height: 28px; font-weight: 500; }
  .po-tag { display: inline-flex; align-items: center; gap: 4px; background: #f4f5f8; border: 1px dashed #eaeef8; border-radius: 2px; padding: 1px 8px; font-size: 12px; line-height: 20px; cursor: pointer; }
  .ph-right { flex: 1; display: flex; align-items: center; gap: 16px; }
  .vdiv { width: 1px; align-self: stretch; background: var(--split); flex: none; }
  .ph-item { flex: 1; display: flex; gap: 8px; align-items: flex-start; min-width: 0; }
  .ph-item .ic { color: var(--pale); margin-top: 3px; }
  .ph-item .t1 { font-weight: 500; line-height: 20px; white-space: nowrap; }
  .ph-item .t2 { font-size: 12px; line-height: 16px; white-space: nowrap; }
  .ph-status { flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  .dot-ok { width: 7px; height: 7px; border-radius: 50%; background: #75cb3f; }

  .columns { display: flex; gap: 8px; margin-top: 8px; flex: 1; }
  .side { width: 256px; flex: none; background: #fff; border-radius: 8px 8px 0 0; padding-top: 4px; }
  .side .ant-menu { border-inline-end: none !important; background: transparent; }
  .side .ant-menu-sub .ant-menu-item { padding-left: 24px !important; }
  .side .ant-menu-submenu-selected > .ant-menu-submenu-title { color: var(--text); }
  .content { flex: 1; display: flex; gap: 8px; align-items: flex-start; min-width: 0; padding-bottom: 24px; }
  .col-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .col-right { width: 389px; flex: none; display: flex; flex-direction: column; gap: 10px; }

  /* ---------- cards ---------- */
  .card { background: #fff; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .card-head { display: flex; align-items: center; gap: 16px; }
  .card-head .title { flex: 1; font-weight: 600; }
  .link-btn.ant-btn { padding: 0; height: 22px; border: 0; }
  .gray-box { background: var(--gray-1); border-radius: 8px; padding: 8px 16px; }
  .lbl { font-size: 12px; line-height: 20px; }
  .stat-tiles { display: flex; gap: 8px; }
  .stat-tile { flex: 1; background: var(--gray-1); border-radius: 8px; padding: 8px 16px; text-align: center; }
  .stat-tile b { display: block; font-size: 20px; line-height: 28px; font-weight: 600; }
  .stat-tile span { font-size: 12px; line-height: 20px; }
  .kv-list { display: flex; flex-direction: column; gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

  /* ---------- sections ---------- */
  .section { background: #fff; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 16px; }
  .sec-head { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .icon-box { background: var(--gray-1); border-radius: 8px; padding: 12px; display: flex; color: var(--text); }
  .icon-box.sm { padding: 8px; }
  .sec-info { flex: 1; min-width: 0; }
  .sec-title { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sec-title b { font-weight: 600; }
  .sec-sub { font-size: 12px; line-height: 20px; display: flex; gap: 16px; }
  .st-tag.ant-tag { margin: 0; border: 0; font-size: 12px; line-height: 20px; height: 22px; padding: 0 7px; border-radius: 4px; display: inline-flex; align-items: center; }
  .st-done { background: #f6ffed !important; color: #389e0d !important; }
  .st-prog { background: var(--primary-bg) !important; color: var(--primary-7) !important; }
  .st-ns { background: #fafafa !important; color: var(--text) !important; }
  .managed { background: var(--primary-bg); color: var(--primary-7); border-radius: 100px; padding: 4px 8px; display: inline-flex; gap: 4px; align-items: center; font-size: 12px; line-height: 20px; }
  .managed .anticon { font-size: 12px; }
  .sub-title { font-weight: 600; margin-bottom: -8px; }
  .sec-body { display: flex; flex-direction: column; gap: 16px; }
  .sub-group { display: flex; flex-direction: column; gap: 8px; }
  .empty-slot { height: 100px; border: 1px dashed var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .item { background: var(--gray-1); border-radius: 8px; padding: 8px 16px; display: flex; flex-direction: column; gap: 8px; }
  .item-head { display: flex; gap: 16px; align-items: flex-start; }
  .item-head .name { flex: 1; font-weight: 600; }
  .item hr, .hr { border: 0; border-top: 1px solid var(--split); margin: 0; }
  .item-cols { display: flex; gap: 8px; }
  .item-cols > div { flex: 1; min-width: 0; }
  .editable { display: inline-flex; gap: 4px; align-items: center; }
  .editable .anticon { color: var(--link); font-size: 14px; cursor: pointer; }
  .add-link.ant-btn { align-self: flex-start; padding-inline: 15px; }
  .prog-cols { display: flex; gap: 8px; }
  .prog-cols > div { flex: 1; min-width: 0; padding-right: 8px; }
  .prog-cols .ant-progress { margin: 0; line-height: 1; }
  .prog-cols .ant-progress-outer { padding-top: 7px; padding-bottom: 8px; }

  /* ---------- route timeline ---------- */
  .route { display: flex; flex-direction: column; }
  .r-row { display: flex; gap: 8px; }
  .r-rail { width: 18px; flex: none; display: flex; flex-direction: column; align-items: center; }
  .r-line { width: 1px; background: var(--primary); }
  .r-line.pale { background: var(--pale); }
  .r-line.fill { flex: 1; }
  .r-line.hidden { visibility: hidden; }
  .r-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex: none; }
  .r-dot.pale { background: var(--pale); }
  .r-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
  .stop { background: var(--gray-1); border-radius: 8px; padding: 8px 16px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .stop .name { font-size: 16px; line-height: 24px; font-weight: 500; }
  .stop .meta { display: flex; gap: 16px; }
  .stop-detail { background: var(--gray-1); border-radius: 8px; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  .stop-detail .t { font-weight: 600; }
  .transport { display: flex; align-items: center; height: 30px; }
  .t-ico { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--primary); color: var(--primary); display: flex; align-items: center; justify-content: center; background: #fff; flex: none; }
  .t-ico.pale { border-color: var(--pale); color: var(--pale); }

  /* ---------- drawers ---------- */
  .ant-drawer-mask { backdrop-filter: blur(3px); }
  .drw .ant-drawer-header { padding: 16px 24px; border-bottom: 1px solid var(--split); }
  .drw .ant-drawer-title { font-size: 16px; line-height: 24px; font-weight: 600; }
  .drw .ant-drawer-footer { padding: 10px 16px; display: flex; justify-content: flex-end; gap: 8px; }
  .drw.gray .ant-drawer-body { background: var(--bg); }
  .drw.big .ant-drawer-title { font-size: 20px; line-height: 28px; font-weight: 500; }
  .drw.big .ant-drawer-footer { padding: 14px 24px; }
  .label-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
  .drw .ant-form-item-label > label { width: 100%; }
  .drw .ant-form-item { margin-bottom: 18px; }

  /* ---------- shipment · containers ---------- */
  .cn-wrap { display: flex; flex-direction: column; gap: 8px; padding-bottom: 24px; min-width: 0; }
  .cn-stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .cn-card { background: #fff; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .cn-head { display: flex; align-items: center; gap: 8px; }
  .cn-head h2, .cn-title h2 { flex: 1; margin: 0; font-size: 20px; line-height: 28px; font-weight: 500; color: var(--text); min-width: 0; overflow-wrap: anywhere; }
  .cn-title { display: flex; align-items: center; gap: 8px; padding: 8px 0 0; flex-wrap: wrap; }
  .cn-title h2 { flex: 0 1 auto; }
  .cn-pager { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
  .cn-card-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 1px dashed var(--split); }
  .cn-card-head b, .cn-sub { font-size: 16px; line-height: 24px; font-weight: 500; }
  .cn-stats .stat-tile b { font-size: 18px; }
  .cn-alloc.ant-collapse > .ant-collapse-item > .ant-collapse-header { padding: 0; align-items: center; }
  .cn-alloc.ant-collapse .ant-collapse-content > .ant-collapse-content-box { padding: 12px 0 0 !important; }
  .cn-alloc-list { display: flex; flex-direction: column; gap: 8px; }
  .cn-alloc-row .ant-progress { margin: 0; }
  .cn-alloc-name { font-weight: 500; overflow-wrap: anywhere; }
  .cn-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
  .cn-search { width: 280px; }
  .cn-toolbar .ant-btn-link { margin-left: auto; }
  .cn-ctr { gap: 16px; border: 1px solid transparent; transition: border-color .2s; }
  .cn-ctr.open { border-color: #d6d9f0; }
  .cn-ctr-head { gap: 12px; }
  .cn-ctr-info { flex: 1; min-width: 0; }
  .cn-ctr-sub { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .cn-ctr-acts { display: inline-flex; align-items: center; gap: 4px; }
  .cap-bars { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .cap-bars.compact { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; width: 340px; flex: none; }
  .cap-bars:not(.compact) { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 24px; }
  .cap-bar .ant-progress { margin: 0; line-height: 1; }
  .cap-txt { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; line-height: 20px; color: var(--muted); }
  .cap-txt .err { color: #ff4d4f; }
  .cn-body { display: flex; flex-direction: column; gap: 16px; }
  .cn-load { display: flex; flex-direction: column; gap: 12px; }
  .cn-table .ant-table-thead > tr > th { font-size: 12px; font-weight: 400; color: var(--muted); background: #fff; }
  .cn-table .ant-table-thead > tr > th::before { display: none; }
  .cn-dash { display: inline-flex; min-width: 36px; height: 22px; align-items: center; justify-content: center; border: 1px solid var(--split); border-radius: 4px; color: #c3c9d6; font-size: 12px; }
  .cn-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .cn-tags .ant-tag { margin: 0; }
  .cn-fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .cn-span { grid-column: 1 / -1; }
  .cn-field { border: 1px solid var(--split); border-radius: 8px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 0; height: 100%; }
  .cn-field .lbl { color: var(--muted); }
  .cn-type-sel.ant-select { margin-left: -7px; min-width: 170px; }
  .cn-add.ant-btn { border-style: dashed; }
  .cn-inline { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; max-width: 320px; }
  .cn-inline .ant-input { flex: 1; min-width: 0; }
  .cn-err { flex-basis: 100%; color: #ff4d4f; font-size: 12px; line-height: 20px; }
  .cn-ref-input.ant-input { width: 160px; }
  .cn-add-card { gap: 12px; }
  .cn-add-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px 32px; gap: 8px; align-items: start; }
  .cn-add-row .ant-form-item { margin: 0; }
  .cn-row-del.first { margin-top: 30px; }
  .assign-row.cn-num-row { padding: 12px 16px; display: grid; grid-template-columns: 40px minmax(0, 1fr) 200px 170px; gap: 12px; align-items: start; }
  .cn-num-row .ic-box { align-self: center; }
  .cn-num-name { min-width: 0; align-self: center; }
  .cn-num-field { min-width: 0; display: flex; flex-direction: column; }
  .lp-switch { gap: 12px; }
  .lp-switch-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lp-switch-sel.ant-select { width: 300px; }
  .lp-opt { display: inline-flex; align-items: center; gap: 8px; }
  .lp-opt b { font-weight: 500; }
  .lp-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
  .lp-left { margin-left: auto; font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
  .lp-left b { color: var(--text); font-weight: 600; }
  .lp-hint { display: flex; gap: 6px; align-items: center; padding: 0 4px; }
  .lp-card { cursor: default; gap: 12px; }
  .lp-card.off { opacity: .6; }
  .lp-name { font-weight: 500; display: block; overflow-wrap: anywhere; }
  .lp-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12px; line-height: 20px; }
  .lp-av { display: inline-flex; gap: 4px; align-items: center; }
  .lp-inputs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding-left: 32px; }
  .lp-cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .lp-cell .lbl { color: var(--muted); }
  .lp-max { font-size: 12px; line-height: 20px; color: var(--muted); }
  .lp-max.err { color: #ff4d4f; }
  @media (max-width: 1279px) { .cap-bars.compact { width: 260px; } }
  @media (max-width: 1100px) { .cn-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cn-fields > .cn-field:first-child { grid-column: 1 / -1; } }
  @media (max-width: 767px) {
    .cn-card { padding: 12px; }
    .cn-btn-txt { display: none; }
    .cn-stats { flex-wrap: wrap; }
    .cn-stats .stat-tile { flex: 1 1 40%; }
    .cn-search { width: 100%; }
    .cn-toolbar .ant-segmented { max-width: 100%; overflow-x: auto; }
    .cn-ctr-head { flex-wrap: wrap; }
    .cn-ctr-info { flex-basis: calc(100% - 120px); }
    .cap-bars.compact { order: 5; width: 100%; }
    .cap-bars:not(.compact) { grid-template-columns: minmax(0, 1fr); }
    .cn-fields { grid-template-columns: minmax(0, 1fr); }
    .cn-pager { margin-left: 0; }
    .lp-switch-sel.ant-select { flex: 1; width: auto; min-width: 0; }
    .lp-left { margin-left: 0; flex-basis: 100%; }
    .lp-inputs { grid-template-columns: repeat(2, minmax(0, 1fr)); padding-left: 0; }
    .assign-row.cn-num-row { grid-template-columns: 40px minmax(0, 1fr); }
    .cn-num-field { grid-column: 1 / -1; }
  }

  /* ---------- shipment · container page (hub) ---------- */
  .hub-head { gap: 16px; }
  .hub-head-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .hub-title { flex: 1; min-width: 200px; }
  .hub-title h2 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 500; }
  .hub-head-acts { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }
  .hub-steps-wrap { overflow-x: auto; padding: 4px 0; }
  .hub-steps .ant-steps-item-title { font-size: 13px; white-space: nowrap; }
  .hub-steps .ant-steps-item-description, .hub-steps .ant-steps-item-content { font-size: 12px; }
  .hub-now { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 16px; background: var(--gray-1); border-radius: 8px; padding: 12px 16px; position: relative; }
  .hub-now b { font-weight: 600; }
  .hub-cutoffs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .ref-tag.soon { border-color: #ffd666; background: #fffbe6; color: #d48806; }
  .ref-tag.late { border-color: #ffccc7; background: #fff2f0; color: #ff4d4f; }
  .hub-asof { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; }
  .hub-cols { display: flex; gap: 8px; align-items: flex-start; }
  .hub-main { flex: 1; min-width: 0; }
  .hub-side { width: 360px; flex: none; display: flex; flex-direction: column; gap: 8px; }
  .hub-tabs { padding: 0 16px 16px; }
  .hub-tabs .ant-tabs-nav { margin-bottom: 16px; }
  .hub-tabs .ant-tabs-tab.ant-tabs-tab-active .ant-tabs-tab-btn { color: var(--link); }
  .hub-tabs .ant-tabs-ink-bar { background: var(--link); }
  .hub-legs { display: flex; flex-direction: column; gap: 16px; }
  .hub-leg { border: 1px solid var(--split); border-radius: 8px; padding: 12px 16px; }
  .hub-leg-head { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px dashed var(--split); }
  .hub-leg-head b { font-weight: 600; }
  .hub-leg-st { margin-left: auto; }
  .hub-ev { display: grid; grid-template-columns: 28px minmax(0, 1fr) 190px; gap: 12px; }
  .hub-ev-rail { display: flex; flex-direction: column; align-items: center; padding-top: 10px; }
  .hub-ev-ic { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid var(--pale); color: var(--pale); flex: none; font-size: 13px; }
  .hub-ev.done .hub-ev-ic { background: #323656; border-color: #323656; color: #fff; }
  .hub-ev.next .hub-ev-ic { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 0 3px var(--primary-bg); }
  .hub-ev-line { flex: 1; width: 1px; background: var(--pale); min-height: 16px; margin-top: 4px; }
  .hub-ev.done .hub-ev-line { background: #323656; }
  .hub-ev-body, .hub-ev-date { padding: 10px 0; }
  .hub-ev-top { display: flex; gap: 8px; align-items: center; }
  .hub-ev-top b { font-weight: 600; }
  .hub-ev-date { text-align: right; }
  .hub-empty { padding: 8px 0; }
  .hub-dray { display: flex; flex-direction: column; gap: 12px; }
  .hub-dray-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hub-dray-id { font-weight: 600; }
  .hub-appts { display: flex; flex-direction: column; gap: 10px; }
  .hub-appt { display: flex; gap: 10px; align-items: flex-start; }

const LOCATION_FIELDS = ['name', 'addr', 'addr2', 'country', 'state', 'city', 'post', 'ptc'];
const toDayjs = (iso) => (iso ? dayjs(iso) : undefined);
const toIso = (v) => (v ? v.format('YYYY-MM-DDTHH:mm') : null);

function TerminalDrawer({ d, st, act, close }) {
  const [form] = Form.useForm();
  const list = st.data[d.section][d.group];
  const editing = d.editIdx != null ? list[d.editIdx] : null;
  const noun = GROUPS[d.group].noun;
  const dateFields = DATE_FIELDS[d.section][d.group];
  const assignedElsewhere = list.filter((r) => r !== editing).reduce((n, r) => n + (r.containers || 0), 0);
  const available = Math.max(0, TOTAL_CONTAINERS - assignedElsewhere);

  const initial = useMemo(() => {
    const src = { ...(editing || {}), ...(d.prefill || {}) };
    const v = {};
    LOCATION_FIELDS.forEach((k) => { if (src[k]) v[k] = src[k]; });
    dateFields.forEach(([k]) => { v[k] = typeof src[k] === 'string' ? toDayjs(src[k]) : src[k]; });
    v.containers = src.containers ?? Math.min(3, available);
    return v;
  }, []);

  const country = Form.useWatch('country', form);
  const state = Form.useWatch('state', form);
  const containers = Form.useWatch('containers', form);

  const draft = () => {
    const v = form.getFieldsValue();
    dateFields.forEach(([k]) => { v[k] = toIso(v[k]); });
    return v;
  };
  const onValuesChange = (changed) => {
    if ('country' in changed) form.setFieldsValue({ state: undefined, city: undefined });
    if ('state' in changed) form.setFieldsValue({ city: undefined });
  };
  const save = async () => {
    const v = await form.validateFields().catch(() => null); // invalid fields are shown inline
    if (!v) return;
    const rec = { ...(editing || {}), id: editing?.id || uid(), addr2: '', ptc: '', ...v };
    dateFields.forEach(([k]) => { rec[k] = toIso(v[k]); });
    act.upsert(d.section, d.group, rec);
    act.msg.success(`${rec.name} ${editing ? 'updated' : 'added'}`);
    close();
  };
  const remove = () => { act.remove(d.section, d.group, editing.id); act.msg.success(`${editing.name} deleted`); close(); };

  return (
    <Drw title={`${editing ? 'Edit' : 'Add'} container ${noun}`} width={700} onClose={close}
      footer={<>
        {editing && <DeleteBtn what={GROUPS[d.group].what} onConfirm={remove} />}
        <Button onClick={close}>{editing ? 'Cancel' : 'Close'}</Button>
        <Button type="primary" onClick={save}>{editing ? 'Save' : 'Confirm'}</Button>
      </>}>
      <Form form={form} layout="vertical" initialValues={initial} requiredMark={false} onValuesChange={onValuesChange}>
        <Form.Item name="name" rules={[{ required: true, whitespace: true, message: 'Enter the terminal name or select it from the list' }]}
          label={<div className="label-row"><span>Terminal Name</span>
            <Button type="link" size="small" icon={<I.UnorderedListOutlined />}
              onClick={() => act.drawer({ type: 'pickTerminal', group: d.group, section: d.section, editIdx: d.editIdx, prefill: draft() })}>Select from list</Button></div>}>
          <Input />
        </Form.Item>
        <Form.Item name="addr" label="Address Line" rules={[{ required: true, whitespace: true, message: 'Enter the street address' }]}><Input /></Form.Item>
        <Form.Item name="addr2" label="Address Line 2"><Input /></Form.Item>
        <div className="grid-2 form-2">
          <Form.Item name="country" label="Country" rules={[{ required: true, message: 'Select a country' }]}>
            <Select showSearch optionFilterProp="label" placeholder="Select Country" options={COUNTRY_OPTS} />
          </Form.Item>
          <Form.Item name="state" label="State / Province">
            <Select showSearch placeholder="Select state / province" options={stateOpts(country)} disabled={!country} />
          </Form.Item>
          <Form.Item name="city" label="City" rules={[{ required: true, message: 'Select a city' }]}>
            <Select showSearch placeholder="Select City" options={cityOpts(country, state)} disabled={!state} />
          </Form.Item>
          <Form.Item name="post" label="Post Code" rules={[{ pattern: /^[A-Za-z0-9 -]{3,10}$/, message: '3–10 letters or digits' }]}>
            <Input placeholder="e.g 10001" />
          </Form.Item>
        </div>
        <Form.Item name="ptc" label="Pass Through Code"><Input placeholder="e.g ABC123" /></Form.Item>
        {dateFields.map(([key, label], i) => (
          <Form.Item key={key} name={key} label={label} dependencies={i ? [dateFields[0][0]] : []}
            rules={i ? [({ getFieldValue }) => ({
              validator: (_, v) => (!v || !getFieldValue(dateFields[0][0]) || v.isAfter(getFieldValue(dateFields[0][0]))
                ? Promise.resolve() : Promise.reject(new Error(`Must be after ${dateFields[0][1]}`))),
            })] : []}>

function PickTerminalDrawer({ d, act, close }) {
  const [tab, setTab] = useState('all');

  const [sel, setSel] = useState(null);
  const [more, setMore] = useState(false);
  const source = tab === 'near' ? TERMINAL_DIR.filter((t) => t.nearby) : TERMINAL_DIR;
  const query = q.trim().toLowerCase();
  const filtered = source.filter((t) => !query || `${t.name} ${t.code} ${addressLine(t)}`.toLowerCase().includes(query));
  const shown = more ? filtered : filtered.slice(0, 5);
  const back = (extra = {}) => act.drawer({ type: 'terminal', group: d.group, section: d.section, editIdx: d.editIdx, prefill: { ...(d.prefill || {}), ...extra } });
  const pick = () => {
    const { name, addr, city, state, post, country } = TERMINAL_DIR[sel];

  const list = (
    <div style={{ padding: 15 }}>

        prefix={<I.SearchOutlined style={{ color: '#6a6f88' }} />} placeholder="Search by terminal name, code or address" style={{ height: 30 }} />
      {filtered.length ? (
        <>
          <div className="term-head"><span>Terminal</span><span>Code</span><span>Address</span></div>

              );

            <div style={{ textAlign: 'center', marginTop: 12 }}>
              <Button icon={<I.ReloadOutlined />} onClick={() => setMore(true)}>View more terminals ({filtered.length - shown.length})</Button>

        <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="No terminals found" style={{ margin: '32px 0' }}>
          <Button onClick={() => back({ name: q })}>Enter address manually</Button>

  return (
    <Drw title={`Add container ${GROUPS[d.group].noun}`} width={1137} onClose={close} bordered className="big pick"
      styles={{ body: { padding: '18px 27px' } }}

          { key: 'near', label: <span><I.EnvironmentOutlined /> Terminals nearby Oakland</span>, children: list },
          { key: 'all', label: <span><I.UnorderedListOutlined /> All terminals</span>, children: list },
        ]} />
      </div>
    </Drw>
  );
}

function FreeTimeDrawer({ d, st, act, close }) {
  const [form] = Form.useForm();
  const editing = d.editIdx != null ? st.data[d.section].free[d.editIdx] : null;
  const initial = editing ? { section: d.section, ...editing } : { section: d.section || 'origin', kind: 'det', type: 'cal' };
  const section = Form.useWatch('section', form) || initial.section;
  const days = Form.useWatch('days', form);
  const type = Form.useWatch('type', form) || initial.type;
  const preview = days > 0 ? lastFreeDay(section, { days, type }) : null;

  const kindConflict = (kind, sec) => {
    const others = st.data[sec].free.filter((r) => r !== editing);
    const clash = others.find((r) => r.kind === kind || r.kind === 'mer' || kind === 'mer');
    return clash ? `${FREE_KINDS[clash.kind]} is already set for ${sec === 'origin' ? 'Origin' : 'Destination'} — edit it instead` : null;
  };
  const save = async () => {
    const v = await form.validateFields().catch(() => null); // invalid fields are shown inline
    if (!v) return;
    const rec = { id: editing?.id || uid(), kind: v.kind, days: v.days, type: v.type };
    act.upsert(v.section, 'free', rec);
    act.msg.success(`${FREE_KINDS[rec.kind]} free time ${editing ? 'updated' : 'added'}`);
    close();
  };
  const remove = () => { act.remove(d.section, 'free', editing.id); act.msg.success('Free time deleted'); close(); };

  return (
    <Drw title={`${editing ? 'Edit' : 'Add'} Free time`} width={400} onClose={close}
      footer={<>
        {editing && <DeleteBtn what="free time" onConfirm={remove} />}
        <Button onClick={close}>Cancel</Button>
        <Button type="primary" onClick={save}>{editing ? 'Save' : 'Add'}</Button>
      </>}>
      <Form form={form} layout="vertical" initialValues={initial} requiredMark={false}>
        <Form.Item name="section" label="Location" hidden={!!d.section}>
          <Radio.Group optionType="button" buttonStyle="solid" style={{ display: 'flex' }} options={[
            { value: 'origin', label: 'Origin', style: { flex: 1, textAlign: 'center' } },
            { value: 'dest', label: 'Destination', style: { flex: 1, textAlign: 'center' } },
          ]} />
        </Form.Item>
        <Form.Item name="kind" dependencies={['section']} rules={[({ getFieldValue }) => ({
          validator: (_, k) => { const err = kindConflict(k, getFieldValue('section')); return err ? Promise.reject(new Error(err)) : Promise.resolve(); },
        })]}>
          <Radio.Group optionType="button" buttonStyle="solid" style={{ display: 'flex' }} options={[
            { value: 'det', label: 'Detention', style: { flex: 1, textAlign: 'center' } },
            { value: 'dem', label: 'Demurrage', style: { flex: 1, textAlign: 'center' } },
            { value: 'mer', label: 'Merged', style: { flex: 1, textAlign: 'center' } },
          ]} />
        </Form.Item>
        <Form.Item name="days" label="Days" rules={[{ required: true, message: 'Enter the number of free days' }, { type: 'number', min: 1, max: 90, message: 'From 1 to 90 days' }]}
          extra={preview ? `Last free day: ${preview}` : `Counted from ${fmt(FREE_START[section], LONG_DT)}`}>
          <InputNumber precision={0} style={{ width: '100%' }} placeholder="e.g 5" />
        </Form.Item>
        <Form.Item name="type" label="Day type"><Radio.Group options={[{ value: 'cal', label: 'Calendar' }, { value: 'work', label: 'Working' }]} /></Form.Item>
      </Form>
    </Drw>
  );
}

function Drawers({ st, act }) {

  switch (d.type) {

const CHART = { indigo: '#5f68c0', red: '#ff4d4f', redSoft: '#ff7875', green: '#52c41a', teal: '#006d75', purple: '#722ed1', grid: '#eeeff1', axis: '#555a75' };
function useWidth() {
  const ref = useRef(null);
  const [w, setW] = useState(0);
  useEffect(() => {
    const ro = new ResizeObserver(([e]) => setW(Math.floor(e.contentRect.width)));
    if (ref.current) ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);
  return [ref, w];
}
const smoothPath = (pts) => pts.map((p, i) => {
  if (!i) return `M${p[0]},${p[1]}`;
  const p0 = pts[i - 2] || pts[i - 1], p1 = pts[i - 1], p2 = p, p3 = pts[i + 1] || p;
  const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
  return `C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`;
}).join(' ');
function LineChart({ data, max, ticks, label, height = 180, xEvery = 1 }) {
  const [ref, w] = useWidth();
  const [hover, setHover] = useState(null);
  const L = 28, R = 12, T = 8, B = 22, H = height;
  const iw = Math.max(0, w - L - R), ih = H - T - B;
  const x = (i) => L + (data.length > 1 ? (i / (data.length - 1)) * iw : 0);
  const y = (v) => T + ih - (v / max) * ih;
  const pts = data.map((d, i) => [x(i), y(d.v)]);
  const onMove = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const i = Math.round(((e.clientX - r.left - L) / iw) * (data.length - 1));
    setHover(Math.max(0, Math.min(data.length - 1, i)));
  };
  return (
    <div ref={ref} className="chart-box" style={{ height: H }}>
      {w > 0 && (
        <svg width={w} height={H} role="img" aria-label={label} onMouseMove={onMove} onMouseLeave={() => setHover(null)}>
          {ticks.map((t) => <g key={t}><line x1={L} x2={w - R} y1={y(t)} y2={y(t)} stroke={CHART.grid} /><text x={L - 8} y={y(t) + 4} textAnchor="end" className="ax">{t}</text></g>)}
          {data.map((d, i) => (i % xEvery === 0 || i === data.length - 1) && d.x ? <text key={i} x={x(i)} y={H - 4} textAnchor="middle" className="ax">{d.x}</text> : null)}
          <path d={smoothPath(pts)} fill="none" stroke={CHART.indigo} strokeWidth="2" strokeLinecap="round" />
          {hover != null && <g><line x1={pts[hover][0]} x2={pts[hover][0]} y1={T} y2={T + ih} stroke="#d1d7e2" strokeDasharray="3 3" /><circle cx={pts[hover][0]} cy={pts[hover][1]} r="5" fill={CHART.indigo} stroke="#fff" strokeWidth="2" /></g>}
        </svg>
      )}
      {hover != null && (
        <div className="chart-tip" style={{ left: Math.min(Math.max(pts[hover][0], 60), w - 60), top: pts[hover][1] - 12 }}>
          <b>{data[hover].v}</b> users<span>{data[hover].full}</span>
        </div>
      )}
    </div>
  );
}
function GrowthChart({ weeks }) {
  const [ref, w] = useWidth();
  const H = 190, L = 28, B = 22, T = 6, max = 16;
  const iw = Math.max(0, w - L - 8), ih = H - T - B;
  const y = (v) => T + ih / 2 - (v / max) * (ih / 2);
  const bw = Math.min(64, (iw / weeks.length) * 0.8);
  const SER = [['new', 'New', CHART.indigo], ['returning', 'Returning', CHART.red], ['resurrecting', 'Resurrecting', CHART.green]];
  return (
    <div ref={ref} className="chart-box" style={{ height: H }}>
      {w > 0 && (
        <svg width={w} height={H} role="img" aria-label="Growth accounting by week">
          {[16, 8, 0, -8, -16].map((t) => <g key={t}><line x1={L} x2={w - 8} y1={y(t)} y2={y(t)} stroke={t === 0 ? '#d1d7e2' : CHART.grid} /><text x={L - 8} y={y(t) + 4} textAnchor="end" className="ax">{t}</text></g>)}
          {weeks.map((wk, i) => {

                ); })}
                <Tooltip title={`${wk.x} · Dormant: ${wk.dormant}`}><rect x={cx - bw / 2} y={y(0) + 1} width={bw} height={Math.max(0, y(-wk.dormant) - y(0) - 1)} fill={CHART.redSoft} /></Tooltip>
                <text x={cx} y={H - 4} textAnchor="middle" className="ax">{wk.x}</text>

            );
          })}
        </svg>
      )}
    </div>

}

function analyticsData(tab) {

  const days = range(31, (i) => { const d = dayjs('2026-08-22').add(i, 'day'); return { x: i % 3 === 0 ? d.format('MMM D') : '', full: d.format('ddd, D MMM'), v: Math.round(1 + rnd() * 9) }; });
  const weeks = range(12, (i) => { const d = dayjs('2026-07-01').add(i, 'week'); return { x: [0, 4, 8].includes(i) ? d.format('MMMM') : '', full: `Week of ${d.format('D MMM')}`, v: Math.round(10 + rnd() * 22) }; });
  const growth = ['Aug 16', 'Aug 23', 'Aug 30', 'Sep 6', 'Sep 13', 'Sep 20'].map((x) => ({ x, new: Math.round(2 + rnd() * 3), returning: Math.round(2 + rnd() * 3), resurrecting: Math.round(rnd() * 3), dormant: Math.round(1 + rnd() * 13) }));
  const cohorts = ['Jul 12 to Jul 18', 'Jul 19 to Jul 25', 'Jul 26 to Aug 1', 'Aug 2 to Aug 8', 'Aug 9 to Aug 15', 'Aug 16 to Aug 22', 'Aug 23 to Aug 29'].map((c, i) => ({ c, size: Math.round(2 + rnd() * 12), weeks: range(7 - i, (k) => (k === 0 ? 100 : rnd() > 0.8 ? +(rnd() * 12).toFixed(1) : 0)) }));
  const domains = [['qa.freightune.co', 92, CHART.indigo], ['$direct', 70, CHART.teal], ['yopmail.com', 28, CHART.green], ['com.slack', 8, CHART.purple]].map(([d, v, c]) => [d, Math.round(v * (0.8 + rnd() * 0.2)), c]);
  return { days, weeks, growth, cohorts, domains };
}

  mode: q.mode, from: q.from, to: q.to, c: q.boxes.map((b) => `${boxCode(b.type)}x${b.qty}`).join(','), k: q.commodity,
  s: q.services.join(','), d: q.direction, t: q.terms, cu: q.customer || '',
}).toString();
const decodeQuery = (o = {}) => {
  if (!o.from || !o.to) return null;
  const boxes = (o.c || '40STx1').split(',').map((p) => {
    const [code, qty] = p.split('x');
    return { type: CONTAINER_TYPES.find((t) => boxCode(t) === code) || "40` ST", qty: Math.min(99, Math.max(1, +qty || 1)) };
  });
  return { ...DEFAULT_Q, mode: MODES.some((m) => m.key === o.mode) ? o.mode : 'FCL', from: o.from, to: o.to, boxes, commodity: o.k || 'FAK',
    services: o.s ? o.s.split(',') : [], direction: o.d || 'Export', terms: o.t || '30 Days (Net)', customer: o.cu || DEFAULT_Q.customer };
};
const shortPlace = (p) => (p || '').split(',')[0].trim();
const cargoText = (q) => `${q.boxes.map((b) => `${b.type.replace('` ST', '’').replace('`', '’')} × ${b.qty}`).join(', ')}, ${COMMODITIES.find(([v]) => v === q.commodity)?.[0] || q.commodity}`;

/* ---------- free-search limit for the public site ---------- */
const FREE_SEARCHES = 5;
const store = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable: limit lives for this page only */ } },
};
let memoryUsed = 0;
const usedSearches = () => Math.max(memoryUsed, store.get('skypace.freeSearches', 0));
const isRegistered = () => store.get('skypace.registered', false);
function useSearchGate() {
  const [used, setUsed] = useState(usedSearches);
  const [modal, setModal] = useState(null); // 'limit' | 'book' | 'signup'
  const registered = isRegistered();
  const consume = () => {
    if (registered) return true;
    const n = usedSearches();
    if (n >= FREE_SEARCHES) { setModal('limit'); return false; }
    memoryUsed = n + 1; store.set('skypace.freeSearches', n + 1); setUsed(n + 1);
    return true;
  };
  return { used, left: Math.max(0, FREE_SEARCHES - used), registered, consume, modal, setModal };
}

/* ---------- shared form state + panels ---------- */
function useQuoteForm(initial) {
  const [q, setQ] = useState(() => ({ ...DEFAULT_Q, ...(initial || {}) }));
  const [errors, setErrors] = useState({});
  const set = (patch) => {
    setQ((p) => ({ ...p, ...patch }));
    setErrors((e) => { const n = { ...e }; Object.keys(patch).forEach((k) => delete n[k]); return n; });
  };
  const validate = () => {
    const e = {};
    if (!q.from.trim()) e.from = 'Enter where you are shipping from';
    if (!q.to.trim()) e.to = 'Enter where you are shipping to';
    if (q.from.trim() && q.from.trim() === q.to.trim()) e.to = 'Destination must differ from origin';
    setErrors(e);
    return !Object.keys(e).length;
  };
  return { q, set, errors, validate, swap: () => set({ from: q.to, to: q.from }) };
}

/* ---------- offers ---------- */
const SERVICE_COST = { pickup: 450, origin: 320, freight: 0, destination: 380 };
function makeOffers(q) {
  const rnd = seeded(hashStr(q.from + q.to + q.mode + q.commodity));
  const teu = q.boxes.reduce((n, b) => n + b.qty * (b.type.startsWith('20') ? 1 : 2), 0);
  const modeK = q.mode === 'AIR' ? 3.1 : q.mode === 'LCL' ? 0.45 : q.mode === 'FTL' ? 0.6 : 1;
  const to = shortPlace(q.to);
  const mk = (i, alt) => {
    const c = QUOTE_CARRIERS[Math.floor(rnd() * QUOTE_CARRIERS.length)];
    const days = Math.round(11 + rnd() * 20);
    const etd = readyDate().add(Math.round(rnd() * 25), 'day');
    const via = rnd() > 0.35 ? pick(['New York', 'Rotterdam', 'Singapore', 'Antwerp'], Math.floor(rnd() * 4)) : null;
    const freight = Math.round((1500 + rnd() * 2600) * teu * modeK * (alt ? 0.86 : 1));
    return {
      key: (alt ? 'a' : 'o') + i, carrier: c.name, logo: c.logo, voyage: `CHIM${330 + Math.floor(rnd() * 20)}N${20 + Math.floor(rnd() * 9)}`,
      etd, eta: etd.add(days, 'day'), days, via, alt, dest: alt ? ALT_PORT[to] || `${to} (alt. terminal)` : to, freight,
      expires: NOW.add(5 + Math.floor(rnd() * 20), 'day').hour(23).minute(0), kind: i % 5 === 0 ? 'spot' : i % 5 === 1 ? 'public' : null,
      windowFrom: etd.subtract(3, 'day'), more: 1 + Math.floor(rnd() * 4), moreFrom: Math.round(freight * (0.7 + rnd() * 0.2)),
    };
  };
  return [...range(24, (i) => mk(i, false)), ...range(10, (i) => mk(i, true))];
}
const offerPrice = (o, incl) => o.freight + INCLUDED.reduce((s, [k]) => s + (incl.includes(k) ? SERVICE_COST[k] : 0), 0) + (incl.includes('freight') ? 0 : -Math.round(o.freight * 0.85));
const fmtUsd = (n) => '$ ' + n.toLocaleString('en-US');
function breakdown(o, incl) {
  const rows = [['Ocean freight', Math.round(o.freight * 0.72)], ['Bunker adjustment (BAF)', Math.round(o.freight * 0.18)], ['Documentation fee', Math.round(o.freight * 0.1)]];
  if (!incl.includes('freight')) rows.length = 1, rows[0] = ['Freight (not included)', Math.round(o.freight * 0.15)];
  if (incl.includes('pickup')) rows.push(['Inland pickup', SERVICE_COST.pickup]);
  if (incl.includes('origin')) rows.push(['Origin handling (THC)', SERVICE_COST.origin]);
  if (incl.includes('destination')) rows.push(['Destination handling (THC)', SERVICE_COST.destination]);
  return rows;
}
function Breakdown({ o, incl }) {
  const rows = breakdown(o, incl);
  return (
    <div className="bd">
      {rows.map(([k, v]) => <div key={k} className="bd-row"><span>{k}</span><span>{fmtUsd(v)}</span></div>)}
      <div className="bd-row bd-total"><span>Total</span><span>{fmtUsd(offerPrice(o, incl))}</span></div>
    </div>
  );
}

/* ---------- filters (shared) ---------- */
function useOfferFilters(offers) {
  const prices = offers.map((o) => o.freight);
  const [f, setF] = useState({ incl: ['pickup', 'origin', 'freight'], alt: true, price: null, days: null, carriers: [], route: [], vias: [], dests: [] });
  const set = (patch) => setF((s) => ({ ...s, ...patch }));
  const apply = (list) => list.filter((o) =>
    (!f.price || (o.freight >= f.price[0] && o.freight <= f.price[1]))
    && (!f.days || o.days <= f.days)
    && (!f.carriers.length || f.carriers.includes(o.carrier))
    && (!f.route.length || f.route.includes(o.via ? 'transship' : 'direct'))
    && (!f.vias.length || f.vias.includes(o.via || 'Direct'))
    && (!f.dests.length || f.dests.includes(o.dest)));
  const active = [f.price, f.days, f.carriers.length, f.route.length, f.vias.length, f.dests.length].filter(Boolean).length;
  return { f, set, apply, active, minP: Math.min(...prices), maxP: Math.max(...prices), reset: () => set({ price: null, days: null, carriers: [], route: [], vias: [], dests: [] }) };
}
function OfferFilters({ offers, flt, q }) {
  const { f, set } = flt;
  const opts = (arr) => uniq(arr).map((v) => ({ label: v, value: v }));
  const items = [
    { key: 'price', label: 'Price', children: <div className="flt-body"><Slider range min={flt.minP} max={flt.maxP} step={50} value={f.price || [flt.minP, flt.maxP]} onChange={(v) => set({ price: v })} tooltip={{ formatter: fmtUsd }} /><div className="lbl muted flt-range"><span>{fmtUsd(f.price?.[0] ?? flt.minP)}</span><span>{fmtUsd(f.price?.[1] ?? flt.maxP)}</span></div></div> },
    { key: 'days', label: 'Transit time', children: <div className="flt-body"><Slider min={10} max={32} value={f.days || 32} onChange={(v) => set({ days: v === 32 ? null : v })} tooltip={{ formatter: (v) => `≤ ${v} days` }} /><div className="lbl muted">Up to {f.days || 32} days</div></div> },
    { key: 'carrier', label: 'Carrier', children: <Checkbox.Group className="flt-checks" value={f.carriers} onChange={(v) => set({ carriers: v })} options={opts(offers.map((o) => o.carrier))} /> },
    { key: 'mode', label: 'Transit mode', children: <Checkbox.Group className="flt-checks" value={f.route} onChange={(v) => set({ route: v })} options={[{ label: 'Direct', value: 'direct' }, { label: 'With transshipment', value: 'transship' }]} /> },
    { key: 'origin', label: 'Origin locations', children: <Checkbox.Group className="flt-checks" value={[shortPlace(q.from)]} options={[{ label: shortPlace(q.from), value: shortPlace(q.from), disabled: true }]} /> },
    { key: 'via', label: 'Transit ports', children: <Checkbox.Group className="flt-checks" value={f.vias} onChange={(v) => set({ vias: v })} options={opts(offers.map((o) => o.via || 'Direct'))} /> },
    { key: 'dest', label: 'Destination locations', children: <Checkbox.Group className="flt-checks" value={f.dests} onChange={(v) => set({ dests: v })} options={opts(offers.map((o) => o.dest))} /> },
  ];
  return (
    <div className="rq-filters">
      <div className="rq-ftitle"><I.DollarOutlined /> What’s included in quote price?</div>
      <div className="incl-list">
        {INCLUDED.map(([k, l]) => {
          const on = f.incl.includes(k);
          return (
            <button key={k} type="button" className={'incl-tag' + (on ? ' on' : '')} aria-pressed={on}
              onClick={() => set({ incl: on ? f.incl.filter((x) => x !== k) : [...f.incl, k] })}>
              {on ? <I.CheckOutlined className="incl-ok" /> : <I.PlusOutlined />}{l}
            </button>
          );
        })}
      </div>
      <div className="rq-ftitle" style={{ marginTop: 32 }}>
        <I.FilterOutlined /> Filters
        {flt.active > 0 && <a className="flt-reset" onClick={flt.reset}>Reset ({flt.active})</a>}
      </div>
      <label className="flt-alt"><Checkbox checked={f.alt} onChange={(e) => set({ alt: e.target.checked })} /> Show alternative routes</label>
      <Collapse ghost className="flt-collapse" items={items} expandIcon={({ isActive }) => <I.RightOutlined rotate={isActive ? 90 : 0} style={{ fontSize: 12 }} />} />
    </div>
  );
}
const sortOffers = (list, by, incl) => [...list].sort(
  by === 'cheapest' ? (a, b) => offerPrice(a, incl) - offerPrice(b, incl)
    : by === 'fastest' ? (a, b) => a.days - b.days
      : by === 'earliest' ? (a, b) => a.etd - b.etd
        : (a, b) => (offerPrice(a, incl) / 1000 + a.days * 0.6) - (offerPrice(b, incl) / 1000 + b.days * 0.6));

function RouteLine({ o, from }) {
  return (
    <div className="iq-route">
      <div className="iq-heads"><span>{from}</span><span>{o.via ? `via ${o.via}` : 'Direct'}</span><span>{o.dest}</span></div>
      <div className="iq-time"><b>{o.etd.format('D MMM')}</b><span className="iq-line"><i />~ {o.days} day(s)<i /></span><b>{o.eta.format('D MMM')}</b></div>
    </div>
  );
}

function InternalResults({ q }) {
  const offers = useMemo(() => makeOffers(q), [encodeQuery(q)]);
  const flt = useOfferFilters(offers);
  const [tab, setTab] = useState('best');
  const [other, setOther] = useState('earliest');
  const [shown, setShown] = useState(10);
  const [altOpen, setAltOpen] = useState(true);
  const [filtersOpen, setFiltersOpen] = useState(false);
  const [msgApi, msgCtx] = message.useMessage();
  const screens = Grid.useBreakpoint();
  const incl = flt.f.incl;
  const main = flt.apply(offers.filter((o) => !o.alt));
  const alts = flt.apply(offers.filter((o) => o.alt));
  const by = tab === 'best' ? 'best' : tab === 'cheapest' ? 'cheapest' : other;
  const sorted = sortOffers(main, by, incl);
  const best = sortOffers(main, 'best', incl)[0];
  const cheap = sortOffers(main, 'cheapest', incl)[0];
  const top = sorted.slice(0, 3);
  const avgTop = top.length ? top.reduce((s, o) => s + offerPrice(o, incl), 0) / top.length : 0;
  const altSorted = sortOffers(alts, 'cheapest', incl);
  const select = (o, price) => {
    QUOTES.unshift({ key: 'q' + Date.now(), origin: q.from, etd: `ETD ${o.etd.format('D MMM')}`, dest: o.dest, eta: `ETA ${o.eta.format('D MMM')}`,
      equipment: q.boxes.map((b) => `${b.type.replace('`', '’')} × ${b.qty}`).join(', '), cargo: COMMODITIES.find(([v]) => v === q.commodity)?.[1] || q.commodity,
      by: q.customer || 'Bridget Tran', created: dayjs(), offers: 1, saved: true });
    msgApi.success(`${o.carrier} · ${fmtUsd(price)} selected — quote request created`);
    setTimeout(() => go('/quote-requests'), 700);
  };
  const filters = <OfferFilters offers={offers} flt={flt} q={q} />;
  const tabBtn = (key, title, sub) => (
    <button type="button" className={'rq-tab' + (tab === key ? ' on' : '')} onClick={() => setTab(key)}><b>{title}</b><span>{sub}</span></button>
  );
  return (
    <div className="rq-grid">
      {msgCtx}
      {screens.lg ? filters : (
        <Drawer open={filtersOpen} onClose={() => setFiltersOpen(false)} placement="left" size={320} title="Filters">{filters}</Drawer>
      )}
      <div className="rq-list">
        {!screens.lg && <Button icon={<I.FilterOutlined />} onClick={() => setFiltersOpen(true)} style={{ alignSelf: 'flex-start' }}>Filters{flt.active ? ` · ${flt.active}` : ''}</Button>}
        <div className="rq-tabs">
          {tabBtn('best', 'Best', best ? `${fmtUsd(offerPrice(best, incl))} · ${best.days} day(s)` : '—')}
          {tabBtn('cheapest', 'Cheapest', cheap ? `${fmtUsd(offerPrice(cheap, incl))} · ${cheap.days} day(s)` : '—')}
          <Dropdown trigger={['click']} menu={{ selectable: true, selectedKeys: [other], onClick: ({ key }) => { setOther(key); setTab('other'); },
            items: [{ key: 'earliest', label: 'Earliest departure' }, { key: 'fastest', label: 'Fastest transit' }] }}>
            <button type="button" className={'rq-tab rq-other' + (tab === 'other' ? ' on' : '')}>
              <b>Other options</b><span>{other === 'earliest' ? 'Earliest departure' : 'Fastest transit'}</span><I.DownOutlined className="rq-chev" />
            </button>
          </Dropdown>
        </div>
        {sorted.length ? sorted.slice(0, shown).map((o) => <InternalOfferCard key={o.key} o={o} q={q} incl={incl} onSelect={select} />)
          : <div className="card-flat" style={{ padding: 12 }}><Empty description="No offers match the filters"><Button onClick={flt.reset}>Reset filters</Button></Empty></div>}
        {sorted.length > shown && <Button onClick={() => setShown(shown + 10)} style={{ alignSelf: 'center' }}>Show {Math.min(10, sorted.length - shown)} more</Button>}
        {flt.f.alt && altOpen && altSorted.length > 0 && (
          <section className="alt-section">
            <div className="alt-head">
              <b>Lower prices available on nearby routes</b>
              <span className="pill-save solid">Save {Math.max(1, Math.round((1 - offerPrice(altSorted[0], incl) / (avgTop || 1)) * 100))}%</span>
              <Tooltip title="Hide nearby routes"><Button size="small" className="alt-close" icon={<I.CloseCircleOutlined />} onClick={() => setAltOpen(false)} aria-label="Hide nearby routes" /></Tooltip>
            </div>
            <AltList alts={altSorted} q={q} incl={incl} onSelect={select} avg={avgTop} />
          </section>
        )}
      </div>
    </div>
  );
}

/* Zoom booking widget: duration + timezone, month grid, 3-day slot columns */
const SLOT_TIMES = range(18, (i) => [9 + Math.floor(i / 2), i % 2 ? 30 : 0]); // 09:00 – 17:30
const tzName = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone.replace(/_/g, ' '); } catch { return 'Local time'; } })();
const isWorkday = (d) => d.day() !== 0 && d.day() !== 6;
const nextWorkday = (d) => { let x = d; while (!isWorkday(x)) x = x.add(1, 'day'); return x; };
function daySlots(d) {
  if (!isWorkday(d)) return [];
  const rnd = seeded(hashStr(d.format('YYYYMMDD')));
  return SLOT_TIMES.map(([h, m]) => d.hour(h).minute(m).second(0)).filter((t) => t.isAfter(dayjs().add(30, 'minute')) && rnd() > 0.3);
}
function ScheduleCall({ onBack, onBooked }) {
  const today = dayjs().startOf('day');
  const [day, setDay] = useState(nextWorkday(today));
  const [month, setMonth] = useState(today.startOf('month'));
  const [slot, setSlot] = useState(null);
  const [email, setEmail] = useState(session().email || '');
  const [err, setErr] = useState(false);
  const cols = range(3, (i) => day.add(i, 'day'));
  const lead = (month.day() + 6) % 7; // weeks start on Monday
  const cells = range(lead + month.daysInMonth(), (i) => (i < lead ? null : month.date(i - lead + 1)));
  const selectable = (d) => !d.isBefore(today, 'day') && isWorkday(d) && d.isBefore(today.add(60, 'day'));
  const confirm = () => { if (!/^\S+@\S+\.\S+$/.test(email)) { setErr(true); return; } onBooked(slot, email); };
  return (
    <>
      <div className="ns-head ns-head-back">
        <Button type="text" icon={<I.ArrowLeftOutlined />} onClick={slot ? () => setSlot(null) : onBack} aria-label="Back" />
        <div><h2>Schedule a call with an expert</h2><p className="muted">Pick a time that works for you — the invite lands in your inbox right away.</p></div>
      </div>
      <div className="sc-grid">
        <div className="sc-left">
          <div className="sc-meta">
            <span><I.ClockCircleOutlined /> 30 min</span>
            <span><I.VideoCameraOutlined /> Zoom meeting</span>
            <span><I.GlobalOutlined /> {tzName}</span>
          </div>
          <div className="sc-cal">
            <div className="sc-cal-head">
              <Button size="small" type="text" icon={<I.LeftOutlined />} disabled={!month.isAfter(today, 'month')} onClick={() => setMonth(month.subtract(1, 'month'))} aria-label="Previous month" />
              <b>{month.format('MMMM YYYY')}</b>
              <Button size="small" type="text" icon={<I.RightOutlined />} disabled={month.isAfter(today.add(1, 'month'), 'month')} onClick={() => setMonth(month.add(1, 'month'))} aria-label="Next month" />
            </div>
            <div className="sc-days">
              {['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((d, i) => <span key={i} className="sc-dow">{d}</span>)}
              {cells.map((d, i) => (d ? (
                <button key={i} type="button" disabled={!selectable(d)} onClick={() => { setDay(d); setSlot(null); }}
                  className={'sc-day' + (d.isSame(day, 'day') ? ' sel' : '') + (d.isSame(today, 'day') ? ' today' : '')}>{d.date()}</button>
              ) : <span key={i} />))}
            </div>
          </div>
        </div>
        <div className="sc-right">
          {slot ? (
            <div className="sc-confirm">
              <span className="ns-opt-ic"><I.CalendarOutlined /></span>
              <b>{slot.format('dddd, D MMMM')}</b>
              <span className="muted">{slot.format('HH:mm')} – {slot.add(30, 'minute').format('HH:mm')} · Zoom</span>
              <Input value={email} status={err ? 'error' : ''} placeholder="Email for the invite" prefix={<I.MailOutlined className="muted" />}
                onChange={(e) => { setEmail(e.target.value); setErr(false); }} onPressEnter={confirm} />
              {err && <span className="ns-err">Enter a valid email</span>}
              <Button type="primary" block className="btn-slate" onClick={confirm}>Confirm call</Button>
            </div>
          ) : (
            <>
              <div className="sc-right-head">
                <b>{day.format('MMM D')} – {day.add(2, 'day').format('D, YYYY')}</b>
                <Button size="small" icon={<I.CalendarOutlined />} onClick={() => { const d = nextWorkday(today); setDay(d); setMonth(d.startOf('month')); }}>Today</Button>
              </div>
              <div className="sc-cols">
                {cols.map((d) => {
                  const slots = daySlots(d);
                  return (
                    <div key={d.format()} className="sc-col">
                      <span className={'sc-col-head' + (d.isSame(day, 'day') ? ' sel' : '')}>{d.format('ddd')} <i>{d.date()}</i></span>
                      {slots.length ? slots.map((t) => <button key={t.format()} type="button" className="sc-slot" onClick={() => setSlot(t)}>{t.format('HH:mm')}</button>)
                        : <span className="sc-none">{isWorkday(d) ? 'Fully booked' : 'Weekend'}</span>}
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>
      </div>
    </>
  );
}

/* Live chat panel (bottom-right), opened from "Talk to us" */
function SupportChat({ sel, onClose }) {
  const intro = sel ? `Hi! I’d like to book ${sel.o.carrier} ${shortPlace(sel.q.from)} → ${sel.o.dest} at ${fmtUsd(sel.price)}.` : null;
  const [msgs, setMsgs] = useState(() => [
    { from: 'bot', text: 'Welcome to Skypace! Need help with this rate or have questions? I’m here to assist — let’s get things moving.' },
    ...(intro ? [{ from: 'me', text: intro }] : []),
  ]);
  const [text, setText] = useState('');
  const [typing, setTyping] = useState(false);
  const end = useRef(null);
  const reply = (t, delay = 1200) => { setTyping(true); setTimeout(() => { setTyping(false); setMsgs((m) => [...m, { from: 'agent', text: t }]); }, delay); };
  useEffect(() => { if (intro) reply('Hi, this is Julia from Skypace. Great choice — let me check space on that sailing for you. Can I have your email so I can send the confirmation?', 1600); }, []);
  useEffect(() => { end.current?.scrollIntoView({ block: 'end' }); }, [msgs, typing]);
  const send = () => {
    const t = text.trim(); if (!t) return;
    setMsgs((m) => [...m, { from: 'me', text: t }]); setText('');
    reply(/\S+@\S+\.\S+/.test(t) ? 'Thanks! I’ve put a hold on the space and will email the booking details shortly.' : 'Got it — give me a moment to check with the carrier.');
  };
  return (
    <aside className="chat" role="dialog" aria-label="Skypace Support chat">
      <header className="chat-head">
        <span className="chat-avatar"><I.CustomerServiceOutlined /></span>
        <div><b>Skypace Support</b><span className="muted">Typically replies in a few minutes</span></div>
        <Button type="text" size="small" icon={<I.CloseOutlined />} onClick={onClose} aria-label="Close chat" />
      </header>
      <div className="chat-body">
        <p className="chat-note muted">By chatting, you consent to our <a>privacy policy</a>.</p>
        {msgs.map((m, i) => (
          <div key={i} className={'chat-msg ' + m.from}>
            {m.text}
            {m.from === 'agent' && <span className="chat-by">Julia · Shipping agent</span>}
          </div>
        ))}
        {typing && <div className="chat-msg agent chat-typing"><i /><i /><i /></div>}
        <div ref={end} />
      </div>
      <div className="chat-input">
        <Input variant="borderless" placeholder="Write a message…" value={text} onChange={(e) => setText(e.target.value)} onPressEnter={send} autoFocus />
        <Button type="text" icon={<I.SendOutlined />} onClick={send} disabled={!text.trim()} aria-label="Send" />
      </div>
    </aside>
  );
}

      <NextStepModal key={sel ? sel.o.key : 'closed'} sel={sel} onClose={() => setSel(null)} onChat={openChat} onSignUp={signUpFromNext} />
      {chat !== null && <SupportChat key={chat ? chat.o.key : 'chat'} sel={chat} onClose={() => setChat(null)} />}
    </div>
  );
}

   One flow component, rendered as full pages (#/auth/...) or inside a modal.
   Mock backend: accounts live in this browser's localStorage, passwords are never stored.

const AUTH_STEPS = ['sign-in', 'forgot', 'reset', 'sign-up', 'verify'];
const DEMO_USER = { email: 'vladimir.nikolaev@maxtonshipping.com', first: 'Vladimir', last: 'Nikolaev', verified: true };
const authUsers = () => { const list = store.get('skypace.users', []); return list.some((u) => u.email === DEMO_USER.email) ? list : [DEMO_USER, ...list]; };
const findUser = (email) => authUsers().find((u) => u.email.toLowerCase() === (email || '').trim().toLowerCase());
const saveUser = (u) => store.set('skypace.users', [...authUsers().filter((x) => x.email !== u.email), u]);
const signInAs = (u) => { store.set('skypace.registered', true); store.set('skypace.session', { email: u.email, first: u.first, last: u.last }); store.set('skypace.freeSearches', 0); memoryUsed = 0; };
const signOut = () => { store.set('skypace.registered', false); store.set('skypace.session', null); };
/* ---------- password rules & email typo helpers ---------- */
const PW_CHECKS = [
  ['len', 'At least 8 characters', (v) => v.length >= 8],
  ['letter', 'A letter', (v) => /[A-Za-z]/.test(v)],
  ['digit', 'A number', (v) => /\d/.test(v)],
];
const PASSWORD_RULES = [
  { required: true, message: 'Enter a password' },
  { validator: (_, v) => (!v || PW_CHECKS.every(([, , ok]) => ok(v)) ? Promise.resolve() : Promise.reject(new Error('Use at least 8 characters with a letter and a number'))) },
];
const EMAIL_RULES = [{ required: true, message: 'Enter your email' }, { type: 'email', message: 'Enter a valid email, like name@company.com' }];
const COMMON_DOMAINS = ['gmail.com', 'outlook.com', 'hotmail.com', 'yahoo.com', 'icloud.com', 'maxtonshipping.com'];
const editDistance = (a, b) => {
  const d = range(a.length + 1, (i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
};
const emailSuggestion = (v) => {
  const m = /^([^@\s]+)@([^@\s]+\.[^@\s]+)$/.exec((v || '').trim());
  if (!m) return null;
  const dom = m[2].toLowerCase();
  if (COMMON_DOMAINS.includes(dom)) return null;
  const near = COMMON_DOMAINS.find((d) => editDistance(d, dom) <= 2);
  return near ? `${m[1]}@${near}` : null;
};

// Password field that warns about Caps Lock, like most modern sign-in forms
function SecretInput({ capsRef, ...p }) {
  const [caps, setCaps] = useState(false);
  const check = (e) => { const on = e.getModifierState && e.getModifierState('CapsLock'); setCaps(!!on); };
  return (
    <>
      <Input.Password onKeyUp={check} onKeyDown={check} onBlur={() => setCaps(false)} {...p} />
      {caps && <div className="caps-warn"><I.WarningOutlined /> Caps Lock is on</div>}
    </>
  );
}

function EmailField({ form, autoFocus, label = 'Email', placeholder }) {
  const value = Form.useWatch('email', form);
  const hint = emailSuggestion(value);
  return (
    <Form.Item name="email" label={label} rules={EMAIL_RULES} validateTrigger="onBlur"
      extra={hint ? <span>Did you mean <a onClick={() => { form.setFieldsValue({ email: hint }); form.validateFields(['email']); }}>{hint}</a>?</span> : null}>
      <Input type="email" inputMode="email" autoComplete="email" placeholder={placeholder} autoFocus={autoFocus} />
    </Form.Item>
  );
}

/* The form column: switches between the five screens */
function AuthFlow({ step, setStep, onDone, inModal, intro }) {
  const [form] = Form.useForm();
  const [email, setEmailState] = useState(() => store.get('skypace.pendingEmail', ''));
  const setEmail = (v) => { setEmailState(v); store.set('skypace.pendingEmail', v); };
  const [busy, setBusy] = useState(false);
  const [alert, setAlert] = useState(null); // { type, text, action }
  const [cooldown, setCooldown] = useState(0);
  const [msgApi, msgCtx] = message.useMessage();
  useEffect(() => { form.resetFields(); setAlert(null); if (email && step !== 'sign-up') form.setFieldsValue({ email }); }, [step]);
  useEffect(() => { if (!cooldown) return; const t = setTimeout(() => setCooldown(cooldown - 1), 1000); return () => clearTimeout(t); }, [cooldown]);
  const later = (fn) => { setBusy(true); setAlert(null); setTimeout(() => { setBusy(false); fn(); }, 600); }; // simulated network round-trip

  const onSignIn = (v) => later(() => {
    const u = findUser(v.email);
    // Same message for unknown email and wrong password, so the form doesn't reveal which accounts exist
    if (!u) return setAlert({ type: 'error', text: 'Incorrect email or password. Try again or reset your password.' });
    if (!u.verified) {
      setEmail(u.email);
      return setAlert({ type: 'warning', text: 'Confirm your email to finish setting up your account.', action: <Button size="small" onClick={() => { setCooldown(30); setStep('verify'); }}>Resend email</Button> });
    }
    signInAs(u); msgApi.success(`Welcome back, ${u.first}`); setTimeout(() => onDone(u), 400);
  });
  const onSignUp = (v) => later(() => {
    if (findUser(v.email)) { form.setFields([{ name: 'email', errors: ['This email is already registered. Sign in instead.'] }]); return; }
    const u = { email: v.email.trim(), first: v.first.trim(), last: v.last.trim(), verified: false };
    saveUser(u); setEmail(u.email); setCooldown(30); setStep('verify');
  });
  const onForgot = (v) => later(() => {
    setEmail(v.email.trim()); setCooldown(30);
    msgApi.info({ content: 'If an account exists for this email, we’ve sent a 6-digit code', duration: 4 });
    setStep('reset');
  });
  const onReset = () => later(() => { msgApi.success('Password updated. Sign in with your new password.'); setStep('sign-in'); });
  const resend = () => { setCooldown(30); msgApi.info({ content: `We sent a new email to ${email}`, duration: 3 }); };
  const verifyNow = () => { const u = { ...(findUser(email) || { email, first: 'New', last: 'User' }), verified: true }; saveUser(u); signInAs(u); msgApi.success('Email confirmed — welcome to Skypace'); setTimeout(() => onDone(u), 500); };

  // Left-aligned heading for the secondary steps (reset / new password), Figma: Heading/4 + small lead
  const head = (title, sub) => (
    <div className="auth-head">
      <div className="auth-title">{title}</div>
      {sub && <div className="auth-lead">{sub}</div>}
    </div>
  );
  const go2 = (to) => (e) => { e.preventDefault(); setStep(to); };
  const submit = (label) => <Button type="primary" htmlType="submit" block loading={busy} className="auth-submit">{label}</Button>;
  const formProps = { form, layout: 'vertical', requiredMark: false, className: 'auth-fields', validateTrigger: 'onBlur', scrollToFirstError: true };
  const passwordLabel = (text = 'Password') => <div className="label-row"><span>{text}</span><a href="#/auth/forgot" onClick={go2('forgot')}>Forgot password?</a></div>;
  const showIntro = inModal && intro && (step === 'sign-in' || step === 'sign-up');

  return (
    <div className={'auth-form' + (inModal ? ' in-modal' : '')}>
      {msgCtx}
      {!inModal && (
        <div className="auth-brand">
          <img src="assets/skypace-logo-lg.svg" width="200" height="40" alt="Skypace" />
          <span>Empowering Global Trade Logistics</span>
        </div>
      )}
      {showIntro && <div className="am-intro"><h2>{intro[0]}</h2><p>{intro[1]}</p></div>}

      <div className="auth-body">
        {alert && <Alert type={alert.type} showIcon title={alert.text} action={alert.action} className="auth-alert" />}

        {step === 'sign-in' && <>
          <Form {...formProps} onFinish={onSignIn}>
            <EmailField form={form} autoFocus label="Work email" />
            <Form.Item name="password" rules={[{ required: true, message: 'Enter your password' }]} label={passwordLabel()}>
              <SecretInput autoComplete="current-password" />
            </Form.Item>
            {submit('Sign in')}
          </Form>
          <div className="auth-foot">New to Skypace? <a href="#/auth/sign-up" onClick={go2('sign-up')}>Create an account</a></div>
        </>}

        {step === 'sign-up' && <>
          <Form {...formProps} onFinish={onSignUp}>
            <Form.Item name="first" label="First name" rules={[{ required: true, whitespace: true, message: 'Enter your first name' }]}><Input autoComplete="given-name" autoFocus /></Form.Item>
            <Form.Item name="last" label="Last name" rules={[{ required: true, whitespace: true, message: 'Enter your last name' }]}><Input autoComplete="family-name" /></Form.Item>
            <EmailField form={form} label="Work email" />
            <Form.Item name="password" label={passwordLabel()} rules={PASSWORD_RULES}>
              <SecretInput autoComplete="new-password" />
            </Form.Item>
            {submit('Create account')}
          </Form>
          <div className="auth-foot">Already have an account? <a className="u" href="#/auth/sign-in" onClick={go2('sign-in')}>Sign in</a></div>
        </>}

        {step === 'forgot' && <>
          {head('Reset your password', 'Enter your email and we’ll send you a 6-digit reset code.')}
          <Form {...formProps} onFinish={onForgot}>
            <EmailField form={form} autoFocus label="Work email" />
            {submit('Request password reset')}
          </Form>
          <div className="auth-foot"><a href="#/auth/sign-in" onClick={go2('sign-in')}><I.ArrowLeftOutlined /> Back to sign in</a></div>
        </>}

        {step === 'reset' && <>
          {head('Set a new password')}
          <Form {...formProps} onFinish={onReset}>
            <Form.Item name="code" label="Code from email" normalize={(v = '') => v.replace(/\D/g, '').slice(0, 6)}
              rules={[{ required: true, message: 'Enter the 6-digit code' }, { pattern: /^\d{6}$/, message: 'The code has 6 digits' }]}>
              <Input inputMode="numeric" autoComplete="one-time-code" autoFocus maxLength={6} />
            </Form.Item>
            <Form.Item name="password" label="New password" rules={PASSWORD_RULES}>
              <SecretInput autoComplete="new-password" />
            </Form.Item>
            <Form.Item name="confirm" label="Confirm password" dependencies={['password']}
              rules={[{ required: true, message: 'Repeat the new password' }, ({ getFieldValue }) => ({ validator: (_, v) => (!v || v === getFieldValue('password') ? Promise.resolve() : Promise.reject(new Error('Passwords don’t match'))) })]}>
              <SecretInput autoComplete="new-password" />
            </Form.Item>
            {submit('Set new password')}
          </Form>
          <div className="auth-foot">
            <Button type="link" size="small" className="auth-link-btn" disabled={cooldown > 0} onClick={resend}>{cooldown > 0 ? `Resend code in ${cooldown}s` : 'Resend code'}</Button>
          </div>
        </>}

        {step === 'verify' && (
          <div className="auth-verify">
            <span className="auth-env"><img src="assets/auth-envelope.svg" width="40" height="40" alt="" /></span>
            <b className="av-title">Verify your Email</b>
            <span className="av-text">To complete registration, please follow instructions sent to {email || 'your email'}</span>
            {/* Demo: pressing Sign in counts as having opened the link from the email */}
            <Button type="primary" className="auth-submit av-btn" onClick={verifyNow}>Sign in</Button>
          </div>
        )}
      </div>
    </div>
  );
}

const CONTAINERS_PATH = SHIPMENT_PATH + '/containers';
// code: [short, full name, max payload kg, internal volume cbm]
const CN_TYPES = {
  '20ST': ['20` ST', '20` Dry Standard', 28200, 33.2], '40ST': ['40` ST', '40` Dry Standard', 26700, 67.7],
  '40HC': ['40` HC', '40` High Cube', 26500, 76.3], '45HC': ['45` HC', '45` High Cube', 27700, 86],
  '20RF': ['20` RF', '20` Reefer', 27400, 28.3], '40RF': ['40` RF', '40` Reefer High Cube', 29000, 67.3],
};
const cnCap = (t) => ({ kg: CN_TYPES[t][2], cbm: CN_TYPES[t][3] });
const CN_TYPE_OPTS = Object.entries(CN_TYPES).map(([value, [, label]]) => ({ value, label }));
// Cargo lines of the shipment that get spread across its containers
const SHIP_CARGO = [
  { id: 'c1', name: 'Frozen bovine cuts, with bone in (excl. carcases and halfcarcases)', hs: '0202.20', pkg: 'Cartons', pcs: 1, kg: 1, cbm: 0 },
  { id: 'c2', name: 'Frozen boneless beef, vacuum packed', hs: '0202.30', pkg: 'Cartons', pcs: 120, kg: 18400, cbm: 32.5 },
  { id: 'c3', name: 'Wooden pallets, empty', hs: '4415.20', pkg: 'Pallets', pcs: 12, kg: 300, cbm: 4 },
];
const CN_SEED = [
  { id: '10682', type: '40ST', number: '', seal: '', refs: [], status: 'ns', load: {} },
  { id: '10683', type: '40HC', number: 'MRKU4930122', seal: 'ML-4471203', refs: ['PO 4F0268'], status: 'transit', load: { c2: { pcs: 60, kg: 9200, cbm: 16.25, value: 48000 } } },
];

/* ISO 6346: 3-letter owner code, category U/J/Z, 6 digits and a check digit */
const ISO_VAL = (() => { const m = {}; let v = 10; for (const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') { if (v % 11 === 0) v++; m[c] = v++; } return m; })();
const checkDigit = (s) => [...s.slice(0, 10)].reduce((sum, ch, i) => sum + (ISO_VAL[ch] ?? Number(ch)) * 2 ** i, 0) % 11 % 10;
const normalizeCn = (v = '') => v.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 11);
const cnNumberError = (v) => {
  if (!v) return null;
  if (!/^[A-Z]{3}[UJZ]\d{7}$/.test(v)) return 'Use 4 letters and 7 digits, like MSKU7712300';
  if (checkDigit(v) !== Number(v[10])) return 'Check digit doesn’t match — please re-check the number';
  return null;
};
const CN_NUMBER_RULE = { validator: (_, v) => { const e = cnNumberError(v); return e ? Promise.reject(new Error(e)) : Promise.resolve(); } };

/* Shared store so the list, the container page and the drawers stay in sync */
const CN_KEY = 'skypace.containers.v2';
let cnCache = null;
const cnSubs = new Set();
const cnAll = () => (cnCache ||= store.get(CN_KEY, null) || CN_SEED);
const cnSave = (list) => { cnCache = list; store.set(CN_KEY, list); cnSubs.forEach((f) => f(list)); };
const cnNextId = (list) => Math.max(10681, ...list.map((x) => +x.id)) + 1;
function useContainers() {
  const [list, setList] = useState(cnAll);
  useEffect(() => { cnSubs.add(setList); return () => cnSubs.delete(setList); }, []);
  return {
    list,
    addMany: (items) => {
      const all = cnAll(); let next = cnNextId(all);
      const made = items.map((c) => ({ number: '', seal: '', refs: [], status: 'ns', load: {}, ...c, id: String(next++) }));
      cnSave([...all, ...made]); return made;
    },
    update: (id, patch) => cnSave(cnAll().map((c) => (c.id === id ? { ...c, ...patch } : c))),
    patchMany: (patches) => cnSave(cnAll().map((c) => (patches[c.id] ? { ...c, ...patches[c.id] } : c))),
    remove: (id) => cnSave(cnAll().filter((c) => c.id !== id)),
  };
}

const sumLoad = (load = {}) => Object.values(load).reduce((t, l) => ({ pcs: t.pcs + (l.pcs || 0), kg: t.kg + (l.kg || 0), cbm: t.cbm + (l.cbm || 0), value: t.value + (l.value || 0) }), { pcs: 0, kg: 0, cbm: 0, value: 0 });
const num = (n, d = 0) => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: d });
const round3 = (n) => Math.round(n * 1000) / 1000;
const cnName = (c) => c.number || 'Number not assigned';
// What is still free for a container: cargo total minus what the other containers carry
const cnAvailable = (list, selfId, cargo = SHIP_CARGO) => Object.fromEntries(cargo.map((g) => {
  const used = list.filter((c) => c.id !== selfId).reduce((t, c) => {
    const l = c.load?.[g.id]; return l ? { pcs: t.pcs + (l.pcs || 0), kg: t.kg + (l.kg || 0), cbm: t.cbm + (l.cbm || 0) } : t;
  }, { pcs: 0, kg: 0, cbm: 0 });
  return [g.id, { pcs: g.pcs - used.pcs, kg: g.kg - used.kg, cbm: round3(g.cbm - used.cbm) }];
}));
// How much of each cargo line is loaded across all containers
const cargoLoaded = (list) => SHIP_CARGO.map((g) => {
  const l = list.reduce((t, c) => { const x = c.load?.[g.id]; return x ? { pcs: t.pcs + (x.pcs || 0), kg: t.kg + (x.kg || 0) } : t; }, { pcs: 0, kg: 0 });
  return { ...g, loadedPcs: l.pcs, loadedKg: l.kg, left: g.pcs - l.pcs };
});

}
